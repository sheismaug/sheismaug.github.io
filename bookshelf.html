<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bookshelf — sheislab</title>
<meta name="description" content="บันทึกหลังอ่านหนังสือจบของ sheismaug">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--ink:#0d0d0d;--ink2:#3a3a3a;--mut:#7a7a7a;--line:#ececec;--soft:#f6f6f6;--pop:#f5c800}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Google Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:40px 0 20px}
.crumb{font-size:14.5px;color:var(--mut);text-decoration:none;display:flex;gap:8px;align-items:center}
.crumb b{color:var(--ink);font-weight:600}
.crumb i{width:7px;height:7px;border-radius:50%;background:var(--pop)}
.navr{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
#upd{margin-right:8px}
.social{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:var(--ink2);border:1px solid var(--line);transition:.2s}
.social svg{width:17px;height:17px}
.social:hover{color:var(--pop);background:var(--ink);border-color:var(--ink)}

.head{position:relative;padding:56px 0 30px}
.kick{font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.kick::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--pop)}
h1{font-size:clamp(46px,8vw,84px);font-weight:500;letter-spacing:-.04em;line-height:.95}
h1 span{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--ink);margin-left:.04em;box-shadow:0 .14em 0 -.04em var(--pop)}
.meta{margin-top:20px;display:flex;gap:8px;font-size:13.5px;color:var(--mut)}
.meta span{padding:5px 12px;border-radius:99px;border:1px solid var(--line)}
.meta b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
/* cheese-book mascot */
.mascot{position:absolute;right:0;bottom:26px;width:150px;height:auto;overflow:visible}
.mb{transform-origin:80px 140px;animation:bob 4.5s ease-in-out infinite}
.head:hover .mb{animation:wig .6s ease-in-out 2}
.mascot .sp1{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite}
.mascot .sp2{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out 1.4s infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes tw{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.1);opacity:1}}

/* control row */
.bar{position:sticky;top:0;z-index:5;margin:0 -32px;padding:14px 32px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:rgba(255,255,255,.94);backdrop-filter:blur(6px)}
.bar.stuck{border-bottom:1px solid var(--line)}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:99px;font-size:14.5px;color:var(--mut);border:1px solid var(--line);transition:.2s;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:#cfcfcf}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--pop);font-weight:600}
.chip small{margin-left:6px;font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.grow{flex:1 0 8px}
@media(min-width:821px){.bar{flex-wrap:wrap;overflow:visible;row-gap:8px}.srch{margin-left:auto}}
.srch{flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.srch input{width:150px;padding:8px 0;border:0;background:none;font:inherit;font-size:14.5px;color:var(--ink);outline:none}
.srch input::-webkit-search-cancel-button{display:none}
.srch:focus-within{border-color:var(--ink)}
.srch{cursor:text;height:38px}
@media(min-width:821px){.srch{padding:0 11px;gap:0}.srch input{width:0;transition:width .25s}.srch:focus-within,.srch.has{padding:0 14px;gap:8px}.srch:focus-within input,.srch.has input{width:150px}}

/* the shelf: one black line, books grouped by category */
.wall{display:flex;flex-wrap:wrap;align-items:stretch;row-gap:44px;margin-top:34px}
.grp{display:flex;flex-direction:column;padding:0 14px;border-bottom:5px solid var(--ink);min-width:0}
.grp:first-child{padding-left:10px}
.gl{font-size:12.5px;font-weight:600;color:var(--mut);white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.gl small{font-weight:400;font-size:11.5px;opacity:.8}
.gs{display:flex;align-items:flex-end;gap:4px;margin-top:auto;padding-top:30px}
.sp{--h:220px;--w:46px;flex:none;position:relative;height:var(--h);width:var(--w);border-radius:4px 4px 1px 1px;background:var(--bg-c);color:var(--fg-c);
  writing-mode:vertical-rl;display:flex;align-items:center;gap:10px;padding:26px 0 14px;overflow:hidden;text-align:start;
  box-shadow:inset 3px 0 0 rgba(255,255,255,.16),inset -4px 0 0 rgba(0,0,0,.08);
  transition:transform .35s cubic-bezier(.3,.7,.4,1),box-shadow .35s}
.sp.lt{box-shadow:inset 0 0 0 1.5px #d9d9d9,inset -4px 0 0 rgba(0,0,0,.04)}
.sp::before,.sp::after{content:"";position:absolute;left:6px;right:6px;border-radius:1px;background:var(--ac-c)}
.sp::before{top:10px;height:5px}
.sp::after{bottom:7px;height:2px;opacity:.5}
.sp .tt{flex:1 1 auto;min-height:0;font-size:13px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp .au{flex:none;font-size:11px;opacity:.72;white-space:nowrap;max-height:42%;overflow:hidden;text-overflow:ellipsis}
.sp:hover{transform:translateY(-8px)}
.sp[aria-pressed="true"]{transform:translateY(-24px);box-shadow:0 16px 22px -12px rgba(0,0,0,.45),inset 3px 0 0 rgba(255,255,255,.16)}
.sp.lt[aria-pressed="true"]{box-shadow:0 16px 22px -12px rgba(0,0,0,.35),inset 0 0 0 1.5px #d9d9d9}
.end{flex:none;width:12px;height:64px;margin-left:6px;border-radius:3px 3px 0 0;background:var(--pop);align-self:flex-end}
.empty{padding:60px 0;color:var(--mut);text-align:center;width:100%}

/* picked book */
.pick{display:flex;gap:24px;margin:40px 0 0;padding:20px;border:1px solid var(--line);border-radius:20px;max-width:780px;text-align:left;width:100%;transition:border-color .2s,box-shadow .2s}
.pick:hover{border-color:#d6d6d6;box-shadow:0 14px 30px -20px rgba(0,0,0,.3)}
.pick img{flex:none;width:118px;aspect-ratio:.72;object-fit:cover;object-position:50% 0;border-radius:8px;background:var(--soft);box-shadow:0 10px 22px -12px rgba(0,0,0,.45)}
.pick .bd{min-width:0;display:flex;flex-direction:column}
.pick .c{font-size:12.5px;color:var(--mut)}
.pick .t{font-size:21px;font-weight:600;line-height:1.3;margin-top:4px;letter-spacing:-.01em}
.pick .a{font-size:14px;color:var(--mut);margin-top:3px}
.pick p{font-size:15px;line-height:1.65;color:var(--ink2);margin-top:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pick .go{margin-top:auto;padding-top:14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.pick .go::before{content:"";width:16px;height:3px;border-radius:2px;background:var(--pop)}
.pick .x{display:none}
.hint{margin:22px 0 90px;font-size:13.5px;color:var(--mut)}
footer{max-width:1180px;margin:0 auto;padding:0 32px 28px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between}

/* detail sheet */
dialog.sheet{border:0;padding:0;margin:auto;width:min(1080px,calc(100vw - 48px));max-height:calc(100vh - 48px);border-radius:22px;background:#fff;color:var(--ink);overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.35)}
dialog.sheet::backdrop{background:rgba(13,13,13,.5);backdrop-filter:blur(6px)}
dialog.sheet[open]{animation:pop .32s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}}
.sh{display:grid;grid-template-columns:330px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:calc(100vh - 48px);max-height:calc(100vh - 48px)}
.sh-body,.sh-img{min-height:0}
.sh-img{background:var(--soft);overflow:auto;scrollbar-width:thin;padding:22px}
.sh-img img{width:100%;display:block;border-radius:12px;box-shadow:0 14px 30px -14px rgba(0,0,0,.35)}
.sh-body{overflow:auto;padding:46px 56px 56px;position:relative}
.sh-top{position:sticky;top:-46px;margin:-46px -56px 0;padding:18px 20px 14px;background:linear-gradient(#fff 75%,rgba(255,255,255,0));display:flex;justify-content:flex-end;gap:6px;z-index:2}
.ib{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);color:var(--ink2);font-size:18px;transition:.2s}
.ib:hover{background:var(--ink);color:var(--pop);border-color:var(--ink)}
.ib:disabled{opacity:.3;pointer-events:none}
.pcat{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--mut);margin-top:4px;display:flex;align-items:center;gap:8px}
.pcat i{width:10px;height:10px;border-radius:3px;background:var(--bg-c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.ptitle{font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.2;margin-top:10px;text-wrap:balance}
.pauthor{color:var(--mut);font-size:16px;margin-top:8px}
.stars{color:var(--ink);letter-spacing:2px;margin-left:6px}
.pq{margin-top:28px;font-size:22px;line-height:1.6;font-weight:500;padding-left:18px;border-left:3px solid var(--pop);max-width:30em}
.plbl{font-size:13px;font-weight:600;letter-spacing:.06em;color:#9a9a9a;margin-top:36px}
/* before reading: why this book */
.pwhy{margin-top:26px;max-width:36em}.pwhy p{font-size:16.5px;line-height:1.9;color:#555;margin-top:8px;white-space:pre-line}
/* closing card: what I liked + small scores */
.fcard{margin-top:34px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:30px;border:1px solid var(--line);border-radius:20px;padding:26px 28px}
.fcard.one{grid-template-columns:minmax(0,1fr)}
.fcard .k{font-size:13px;font-weight:600;letter-spacing:.06em;color:#9a9a9a;margin-bottom:10px}
.fcard .lk{font-size:16.5px;line-height:1.95;color:#262626;white-space:pre-line}
.fcard .cr{display:grid;gap:15px;align-content:start;border-left:1px solid #efefef;padding-left:28px}
.fcard.one .cr{border-left:0;padding-left:0}
.fcard .row{display:flex;align-items:center;gap:12px}.fcard .row span{flex:1;font-size:15px;color:#262626}
.fcard .bars{display:flex;gap:5px}.fcard .bars i{width:24px;height:6px;border-radius:3px;background:#ececec}.fcard .bars i.on{background:var(--pop)}
.fcard .row small{width:50px;text-align:right;font-size:13px;color:#8a8a8a}
.fcard .ft{grid-column:1/-1;border-top:1px solid #f1f1f1;padding-top:15px;display:flex;justify-content:space-between;gap:16px;font-size:14px;color:#8a8a8a}
.fcard .ft b{color:var(--ink);font-weight:600}.fcard .ft .st{color:var(--pop);letter-spacing:3px;white-space:nowrap}
@media (max-width:640px){.fcard{grid-template-columns:minmax(0,1fr);padding:20px;gap:22px}.fcard .cr{border-left:0;padding-left:0;border-top:1px solid #efefef;padding-top:20px}}
.rv{max-width:36em}
.rv p{font-size:17.5px;line-height:1.95;color:#262626;margin-top:18px;white-space:pre-line}
.ptags{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.tag{font-size:14px;color:var(--mut)}

/* reading journal: saved pages + ending */
.jr{list-style:none;margin:22px 0 0;padding:0 0 0 22px;border-left:2px dashed var(--line);display:grid;gap:38px;max-width:36em}
.jr li{position:relative}
.jr li::before{content:"";position:absolute;left:-29px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--pop);box-shadow:0 0 0 3px #fff}
.jr .jm{font-size:13px;color:var(--mut);font-weight:500}
.jr figure{position:relative;margin:14px 0 0;max-width:340px;transform:rotate(-1.2deg)}
.jr li:nth-child(even) figure{transform:rotate(1deg)}
.jr figure img{display:block;width:100%;border-radius:4px;box-shadow:0 10px 24px -10px rgba(0,0,0,.35);cursor:zoom-in}
.jr figure::before{content:"";position:absolute;width:74px;height:20px;background:rgba(245,200,0,.55);top:-9px;left:50%;margin-left:-37px;transform:rotate(3deg);z-index:1}
.jr p{font-size:17.5px;line-height:1.9;color:var(--ink2);margin-top:16px;white-space:pre-line}
.endc{margin-top:22px}
.endc p{font-size:17px;line-height:2.05;letter-spacing:.005em;color:#262626;white-space:pre-line;text-wrap:pretty}
.endc p+p{margin-top:1.6em}
/* formatted review (KANN paragraph styles) */
.endc.doc>*{max-width:none}
.doc>*+*{margin-top:1.1em}
.doc p+p{margin-top:1.6em}
.doc h2{font-size:24px;font-weight:600;line-height:1.5;color:var(--ink);margin-top:1.6em}
.doc h3{font-size:20px;font-weight:600;line-height:1.55;color:var(--ink);margin-top:1.5em}
.doc h4{font-size:17px;font-weight:600;line-height:1.6;color:var(--ink);margin-top:1.4em}
.doc>h2:first-child,.doc>h3:first-child,.doc>h4:first-child{margin-top:0}
.doc ul,.doc ol{padding-left:1.4em;font-size:17px;line-height:2;color:#262626}
.doc li+li{margin-top:.3em}
.doc li::marker{color:var(--mut)}
.doc blockquote{border-left:3px solid var(--pop);padding:2px 0 2px 20px;font-size:17px;line-height:2;color:var(--ink);white-space:pre-line}
.doc code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:#f1f1f1;padding:.1em .35em;border-radius:5px}
.doc a{color:inherit;text-decoration:underline;text-decoration-color:var(--pop);text-decoration-thickness:2px;text-underline-offset:3px}
.doc aside{background:var(--soft);border-radius:14px;padding:16px 20px;font-size:16.5px;line-height:1.95;color:#262626;white-space:pre-line}
.pz{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:grid;place-items:center;overflow:hidden;touch-action:none;padding:16px;cursor:zoom-out}
.pz img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:50% 50%;user-select:none;-webkit-user-drag:none;cursor:zoom-in;will-change:transform}
.pz.zin img{cursor:grab}.pz.zin.drag img{cursor:grabbing}
.pz .pzx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:22px;line-height:40px;cursor:pointer}
.pz .pzh{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:13px;pointer-events:none;transition:opacity .3s}
.pz.zin .pzh{opacity:0}
/* journal books on wide screens: one column, photo and caption side by side like a notebook spread */
@media(min-width:821px){
  .sh.jbook{grid-template-columns:minmax(0,1fr)}
  .sh.jbook .sh-img{display:none}
  .sh.jbook .sh-body{padding:46px 64px 64px}
  .sh.jbook .sh-body>*:not(.sh-top){max-width:820px;margin-left:auto;margin-right:auto}
  .sh.jbook .sh-body>.plbl{margin-top:36px}
  .jhead{display:flex;gap:22px;align-items:flex-end}
  .jhead img{width:96px;border-radius:8px;box-shadow:0 10px 24px -12px rgba(0,0,0,.4);flex:none}
  .sh.jbook .jr{max-width:none;padding-left:30px}
  .sh.jbook .jr li{display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:auto 1fr;gap:10px 36px;align-items:start}
  .sh.jbook .jr li::before{left:-37px}
  .sh.jbook .jr .jm{grid-column:2;grid-row:1;margin-top:6px}
  .sh.jbook .jr figure{grid-column:1;grid-row:1 / span 2;margin:0}
  .sh.jbook .jr p{grid-column:2;grid-row:2;margin-top:0;font-size:18px;max-width:28em}
  .sh.jbook .endc{max-width:none}
}
/* reading now */
.now{margin:4px 0 30px}
.nowh{font-size:13px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nowh i{width:8px;height:8px;border-radius:50%;background:var(--pop);box-shadow:0 0 0 0 rgba(245,200,0,.6);animation:pulse 2s ease-out infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(245,200,0,0)}100%{box-shadow:0 0 0 0 rgba(245,200,0,0)}}
.nowl{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.nowl::-webkit-scrollbar{display:none}
.nb{flex:0 0 auto;width:min(430px,84vw);display:flex;gap:18px;padding:16px;border:1px solid var(--line);border-radius:20px;text-align:left;transition:border-color .2s,box-shadow .2s}
.nb:hover{border-color:#d6d6d6;box-shadow:0 14px 30px -20px rgba(0,0,0,.3)}
.nb>img{flex:none;width:88px;aspect-ratio:.72;object-fit:cover;object-position:50% 0;border-radius:7px;background:var(--soft);box-shadow:0 10px 22px -12px rgba(0,0,0,.45)}
.nb .bd{min-width:0;display:flex;flex-direction:column}
.nb .t{font-size:18px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.nb .a{font-size:13.5px;color:var(--mut);margin-top:2px}
.nb .m{font-size:13px;color:var(--ink2);margin-top:8px;font-variant-numeric:tabular-nums}
.nb .pg{margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
.nb .pg img{width:30px;height:40px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
.nb .pg span{margin-left:4px}
.pnow{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:var(--ink2);padding:6px 12px;border-radius:99px;background:var(--soft)}
.pnow i{width:7px;height:7px;border-radius:50%;background:var(--pop)}
.sh.rbook .sh-img{display:none}
.notyet{margin-top:18px;max-width:36em;padding:18px 22px;border-radius:16px;border:1.5px dashed var(--line);color:var(--mut);font-size:15px}
@media(max-width:820px){.jhead img{display:none}.endc p{font-size:16.5px;line-height:2}}
@media(max-width:820px){
  .wrap{padding:0 16px}
  .bar{margin:0 -16px;padding:12px 16px}
  .nav{padding-top:28px}
  .head{padding:40px 0 24px}
  .mascot{width:104px;bottom:22px}
  .srch input{width:96px}
  #upd{display:none}
  .wall{row-gap:36px;margin-top:26px}
  .grp{padding:0 8px}
  .grp:first-child{padding-left:6px}
  .gs{padding-top:22px}
  .sp{height:calc(var(--hm) * 1px);width:calc(var(--w) * .8);padding:22px 0 12px}
  .sp .tt{font-size:12px}
  .sp .au{display:none}
  .sp[aria-pressed="true"]{transform:translateY(-16px)}
  .end{display:none}
  /* picked book floats at the bottom on phones */
  .pick{position:fixed;left:12px;right:12px;bottom:12px;z-index:8;width:auto;margin:0;padding:12px 14px;gap:14px;background:#fff;border-color:var(--line);box-shadow:0 18px 40px -12px rgba(0,0,0,.35);transform:translateY(calc(100% + 24px));transition:transform .35s cubic-bezier(.3,.7,.4,1)}
  .pick.on{transform:none}
  .pick img{width:62px}
  .pick .t{font-size:16px}
  .pick .a{font-size:12.5px}
  .pick p{display:none}
  .pick .go{padding-top:8px;font-size:12.5px}
  .pick .x{display:flex;position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;color:var(--mut);font-size:15px}
  .hint{margin-bottom:120px}

      : b.liked ? [el('div', { class: 'plbl' }, 'ชอบตรงไหน'), el('div', { class: 'rv' }, el('p', {}, b.liked)), closingCard(b, false)] : null,
    (b.tags || []).length ? el('div', { class: 'ptags' }, b.tags.map(t => el('span', { class: 'tag' }, '#' + t))) : null].flat(2).filter(Boolean));
  $('.sh').classList.toggle('jbook', !!(b.pages || []).length || b.status === 'reading');
  $('.sh').classList.toggle('rbook', b.status === 'reading');
  $('#shbody').scrollTop = 0; $('#shimg').scrollTop = 0; $('.sh').scrollTop = 0;
  if (!sheet.open) { sheet.showModal(); document.body.style.overflow = 'hidden'; }
  history.replaceState(null, '', '#' + b.id);
  if (b.status !== 'reading') pick(b, true);
}
function close(){ sheet.close(); }
$('#pick').addEventListener('click', () => picked && openBook(order.indexOf(picked)));
sheet.addEventListener('close', () => { document.body.style.overflow = ''; cur = -1; history.replaceState(null, '', location.pathname); });
sheet.addEventListener('click', e => { if (e.target === sheet) close(); });
addEventListener('keydown', e => { if (!sheet.open) return; if (e.key === 'ArrowRight' && cur < order.length - 1) openBook(cur + 1); if (e.key === 'ArrowLeft' && cur > 0) openBook(cur - 1); });
new IntersectionObserver(([e]) => $('#bar').classList.toggle('stuck', !e.isIntersecting)).observe($('#barsent'));
$('#q').addEventListener('input', e => { q = e.target.value.trim(); $('.srch').classList.toggle('has', !!q); render(); });
fetch('bookshelf/books.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
  books = (d.books || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  now = books.filter(b => b.status === 'reading').sort((a, b) => (b.start || '').localeCompare(a.start || ''));
  books = books.filter(b => b.status !== 'reading');
  cats = d.categories || [...new Set(books.map(b => b.category))];
  books.forEach(b => { if (!b.category) { b.category = 'อื่นๆ'; if (!cats.includes('อื่นๆ')) cats.push('อื่นๆ'); } });
  $('#n').textContent = books.length;
  if (d.updated) $('#upd').textContent = 'อัปเดต ' + new Date(d.updated + 'T00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
  render();
  const h = location.hash.slice(1); const i = order.findIndex(b => b.id === h); if (i >= 0) openBook(i);
});
})();
</script>
</body>
