<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>movieshelf — sheislab</title>
<meta name="description" content="รีวิวหนังและซีรีส์ของ sheismaug #sheisbingewatchin">
<meta name="theme-color" content="#ffffff">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--ink:#0d0d0d;--ink2:#3a3a3a;--mut:#7a7a7a;--line:#ececec;--soft:#f6f6f6;--pop:#f5c800}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Google Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:40px 0 20px}
.crumb{font-size:14.5px;color:var(--mut);text-decoration:none;display:flex;gap:8px;align-items:center}
.crumb b{color:var(--ink);font-weight:600}
.crumb i{width:7px;height:7px;border-radius:50%;background:var(--pop)}
.navr{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
#upd{margin-right:8px}
.social{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:var(--ink2);border:1px solid var(--line);transition:.2s}
.social svg{width:17px;height:17px}
.social:hover{color:var(--pop);background:var(--ink);border-color:var(--ink)}

.head{padding:56px 0 34px}
.kick{font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.kick::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--pop)}
h1{font-size:clamp(46px,8vw,84px);font-weight:500;letter-spacing:-.04em;line-height:.95}
h1 span{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--ink);margin-left:.04em;box-shadow:0 .14em 0 -.04em var(--pop)}
.meta{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.meta span{padding:6px 14px;border-radius:99px;border:1px solid var(--line)}
.meta b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.head{position:relative}
.popcorn{position:absolute;right:6px;bottom:30px;width:150px;height:auto;overflow:visible}
.pc-body{transform-origin:80px 196px;animation:pcbob 4.5s ease-in-out infinite}
.head:hover .pc-body{animation:pcwig .6s ease-in-out 2}
.pc-fly .k1{animation:pcpop 3.6s ease-in-out infinite}
.pc-fly .k2{animation:pcpop 3.6s ease-in-out 1.8s infinite}
.pc-fly .spark{transform-box:fill-box;transform-origin:center;animation:pctw 2.8s ease-in-out infinite}
.pc-fly .s2{animation-delay:1.4s}
.eyes circle{transform-box:fill-box;transform-origin:center;animation:pcblink 5s infinite}
@keyframes pcbob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes pcwig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes pcpop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pctw{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.1);opacity:1}}
@keyframes pcblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

/* chips */
.bar{position:sticky;top:0;z-index:5;margin:0 -32px;padding:14px 32px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:rgba(255,255,255,.94);backdrop-filter:blur(6px)}
.bar.stuck{border-bottom:1px solid var(--line)}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:99px;font-size:14.5px;color:var(--mut);border:1px solid var(--line);transition:.2s;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:#cfcfcf}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--pop);font-weight:600}
.chip small{margin-left:6px;font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.sep{flex:none;width:1px;background:var(--line);margin:6px 4px}
.srch{flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.srch input{width:150px;padding:8px 0;border:0;background:none;font:inherit;font-size:14.5px;color:var(--ink);outline:none}
.srch:focus-within{border-color:var(--ink)}
.grow{flex:1 0 8px}
/* rails: one scrolling row per group */
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin:0 -32px;padding:4px 32px 12px;scroll-padding:0 32px}
.rail::-webkit-scrollbar{display:none}
.rail .tile{flex:0 0 172px;scroll-snap-align:start}
.railwrap{position:relative}
.rbtn{position:absolute;top:calc(50% - 36px);width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:20px;color:var(--ink);z-index:2;display:none}
.rbtn:hover{background:var(--ink);color:var(--pop)}
.rbtn.l{left:-14px}.rbtn.r{right:-14px}
@media(hover:hover) and (min-width:821px){.railwrap.can-l .rbtn.l,.railwrap.can-r .rbtn.r{display:block}}
.rh .all{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--ink);padding:5px 12px;border-radius:99px;border:1px solid var(--line)}
.rh .all:hover{background:var(--ink);color:var(--pop);border-color:var(--ink)}

/* rows */
.row{margin-top:34px}
.rh{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.rh h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.rh small{font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px 18px}
.tile{display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.pic{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--soft);isolation:isolate;transition:transform .3s cubic-bezier(.3,.7,.4,1),box-shadow .3s}
.pic .blur{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px) saturate(1.1);opacity:.55;z-index:-1}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.tile:hover .pic,.tile:focus-visible .pic{transform:translateY(-4px);box-shadow:0 16px 30px -14px rgba(0,0,0,.35)}
.score{position:absolute;top:10px;left:10px;padding:4px 9px 4px 7px;border-radius:99px;background:var(--ink);color:var(--pop);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.score.top{background:var(--pop);color:var(--ink)}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:16px;background:var(--ink);color:var(--pop);font-size:19px;font-weight:600;line-height:1.25;text-align:left;overflow-wrap:anywhere}
.ph.big{position:relative;aspect-ratio:4/5;border-radius:12px;font-size:26px;padding:22px}
.tt{font-size:15.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.tt small{display:block;font-size:13px;font-weight:400;color:var(--mut);margin-top:3px}
.empty{padding:60px 0;text-align:center;color:var(--mut)}
.hint{margin:40px 0 0;font-size:14px;color:var(--mut);text-align:center}
footer{max-width:1180px;margin:60px auto 0;padding:20px 32px 36px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between;border-top:1px solid var(--line)}

/* detail sheet */
dialog.sheet{border:0;padding:0;margin:auto;width:min(1040px,calc(100vw - 48px));max-height:calc(100vh - 48px);border-radius:22px;background:#fff;color:var(--ink);overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.35)}
dialog.sheet::backdrop{background:rgba(13,13,13,.55);backdrop-filter:blur(6px)}
dialog.sheet[open]{animation:pop .3s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}}
.sh{display:grid;grid-template-columns:360px minmax(0,1fr);height:calc(100vh - 48px);max-height:calc(100vh - 48px)}
.sh-img{background:var(--soft);overflow:auto;padding:22px;min-height:0}
.sh-img img{width:100%;display:block;border-radius:12px;box-shadow:0 14px 30px -16px rgba(0,0,0,.4)}
.sh-body{overflow:auto;padding:46px 56px 56px;position:relative;min-height:0}
.sh-top{position:sticky;top:-46px;margin:-46px -56px 0;padding:18px 20px 14px;background:linear-gradient(#fff 75%,rgba(255,255,255,0));display:flex;justify-content:flex-end;gap:6px;z-index:2}
.ib{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);color:var(--ink2);font-size:18px;transition:.2s}
.ib:hover{background:var(--ink);color:var(--pop);border-color:var(--ink)}
.ib:disabled{opacity:.3;pointer-events:none}
.pgroup{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--mut)}
.ptitle{font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.2;margin-top:10px;text-wrap:balance}
.pline{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap;color:var(--mut);font-size:15px}
.pscore{display:inline-flex;align-items:baseline;gap:4px;padding:6px 14px;border-radius:99px;background:var(--ink);color:var(--pop);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.pscore small{font-size:12.5px;font-weight:500;opacity:.75}
.rv{max-width:36em;margin-top:26px}
.rv p{font-size:17.5px;line-height:1.95;color:var(--ink2);margin-top:16px;white-space:pre-line}
.src{display:inline-block;margin-top:30px;font-size:13.5px;color:var(--mut)}
.src b{color:var(--ink);font-weight:600}

@media(max-width:820px){
  .wrap{padding:0 18px}
  .bar{margin:0 -18px;padding:12px 18px}
  .nav{padding-top:28px}
  .head{padding:36px 0 26px}
  .popcorn{width:78px;right:0;bottom:auto;top:22px}
  .grid{grid-template-columns:1fr 1fr;gap:18px 12px}
  .rail{margin:0 -18px;padding:4px 18px 12px;gap:12px;scroll-padding:0 18px}
  .rail .tile{flex-basis:138px}
  .bar{flex-wrap:wrap;row-gap:8px}
  .srch{order:-1;flex:1 1 100%}
  .srch input{width:100%}
  .grow{display:none}
  .sep{display:none}
  .chip{padding:7px 13px;font-size:14px}
  .tt{font-size:14.5px}
  footer{padding:20px 18px 30px}
  #upd{display:none}
  dialog.sheet{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}
  .sh{grid-template-columns:1fr;height:100dvh;max-height:100dvh;overflow:auto}
  .sh-img{order:-1;overflow:visible;padding:0 18px;background:none}
  .sh-body{overflow:visible;padding:20px 22px 40px}
  .sh-top{position:fixed;top:0;left:0;right:0;margin:0;padding:12px 14px;background:none}
  .sh-img{padding-top:62px}
  .sh-img img{max-height:52vh;width:auto;max-width:100%;margin:0 auto}
  .ptitle{font-size:28px}
  .rv p{font-size:17px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>

<script>
(() => {
const $ = s => document.querySelector(s);
const el = (t, a = {}, ...k) => { const e = document.createElement(t); for (const [n, v] of Object.entries(a)) { if (v == null || v === false) continue; if (n === 'class') e.className = v; else if (n === 'style') e.style.cssText = v; else if (n.startsWith('on')) e.addEventListener(n.slice(2), v); else e.setAttribute(n, v); } e.append(...k.flat(2).filter(x => x != null && x !== false)); return e; };
const fmt = d => new Date(d + 'T00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
const main = t => t.replace(/\s*\((?!\d{4}\)).*\)$/, '');
const sub = t => (t.match(/\(([^)]*[^\d)][^)]*)\)$/) || [])[1] || '';
const num = c => Number.isInteger(c) ? String(c) : c.toFixed(1);
let movies = [], groups = [], order = [], cur = -1, filt = null, sort = 'new', kind = 'all', q = '';
const isSeries = m => m.group.startsWith('ซีรีส์');
const norm = t => (t || '').toLowerCase();
const top = () => { const y = $('#sent').getBoundingClientRect().top + scrollY; if (scrollY > y) scrollTo({ top: y, behavior: 'smooth' }); };
const sheet = $('#sheet');

function tile(m){
  const has = m.cheese != null;
  return el('button', { class: 'tile', 'aria-label': m.title + (has ? ' ' + num(m.cheese) + ' ชีส' : ''), onclick: () => open(order.indexOf(m)) },
    el('span', { class: 'pic' }, m.image ? [el('span', { class: 'blur', style: `background-image:url(${m.image})` }), el('img', { src: m.image, alt: '', loading: 'lazy' })] : el('span', { class: 'ph' }, main(m.title)),
      has ? el('span', { class: 'score' + (m.cheese >= 9 ? ' top' : '') }, '🧀 ' + num(m.cheese)) : null),
    el('span', { class: 'tt' }, main(m.title), sub(m.title) ? el('small', {}, sub(m.title)) : el('small', {}, fmt(m.date))));
}
function sorted(l){ return l.slice().sort(sort === 'top' ? (a, b) => (b.cheese ?? -1) - (a.cheese ?? -1) || b.date.localeCompare(a.date) : (a, b) => b.date.localeCompare(a.date)); }
function railEl(l){
  const r = el('div', { class: 'rail' }, l.map(tile));
  const w = el('div', { class: 'railwrap' },
    el('button', { class: 'rbtn l', 'aria-label': 'เลื่อนซ้าย', onclick: () => r.scrollBy({ left: -r.clientWidth * .8, behavior: 'smooth' }) }, '‹'), r,
    el('button', { class: 'rbtn r', 'aria-label': 'เลื่อนขวา', onclick: () => r.scrollBy({ left: r.clientWidth * .8, behavior: 'smooth' }) }, '›'));
  const upd = () => { w.classList.toggle('can-l', r.scrollLeft > 4); w.classList.toggle('can-r', r.scrollLeft + r.clientWidth < r.scrollWidth - 4); };
  r.addEventListener('scroll', upd, { passive: true }); requestAnimationFrame(upd);
  return w;
}
function render(keepBar){
  const pool = movies.filter(m => kind === 'all' || (kind === 'series') === isSeries(m));
  const all = groups.map(g => [g, sorted(pool.filter(m => m.group === g))]).filter(([, l]) => l.length);
  const chip = (label, n, on, fn) => el('button', { class: 'chip', 'aria-pressed': String(on), onclick: fn }, label, n != null ? el('small', {}, n) : null);
  const setKind = k => () => { kind = k; filt = null; render(); top(); };
  const sr = $('#q') || el('input', { id: 'q', type: 'search', placeholder: 'หาเรื่อง', 'aria-label': 'ค้นหาเรื่อง', oninput: e => { q = e.target.value.trim(); render(true); } });
  if (!keepBar) $('#bar').replaceChildren(
    chip('ทั้งหมด', movies.length, kind === 'all', setKind('all')),
    chip('หนัง', movies.filter(m => !isSeries(m)).length, kind === 'movie', setKind('movie')),
    chip('ซีรีส์', movies.filter(isSeries).length, kind === 'series', setKind('series')),
    el('span', { class: 'sep' }),
    el('button', { class: 'chip', 'aria-label': 'เปลี่ยนการเรียง', onclick: () => { sort = sort === 'new' ? 'top' : 'new'; render(); } }, '⇅ ', sort === 'new' ? 'ล่าสุด' : '🧀 สูงสุด'),
    el('span', { class: 'grow' }),
    el('label', { class: 'srch' }, el('span', { 'aria-hidden': 'true' }, '⌕'), sr));
  if (q) {
    const hit = sorted(movies.filter(m => [m.title, m.group].some(t => norm(t).includes(norm(q)))));
    order = hit;
    $('#main').replaceChildren(hit.length ? el('section', { class: 'row' }, el('div', { class: 'rh' }, el('h2', {}, 'ผลการค้นหา'), el('small', {}, hit.length + ' เรื่อง')), el('div', { class: 'grid' }, hit.map(tile)))
      : el('p', { class: 'empty' }, 'ไม่เจอเรื่องที่ค้นหา ลองคำอื่นดูนะ'));
    return;
  }
  const show = filt ? all.filter(([g]) => g === filt) : all;
  order = show.flatMap(([, l]) => l);
  $('#main').replaceChildren(...show.map(([g, l]) => el('section', { class: 'row' },
    el('div', { class: 'rh' }, el('h2', {}, g), el('small', {}, l.length + ' เรื่อง'),
      filt ? el('button', { class: 'all', onclick: () => { filt = null; render(); top(); } }, '← ทุกหมวด')
        : l.length > 4 ? el('button', { class: 'all', onclick: () => { filt = g; render(); top(); } }, 'ดูทั้งหมด →') : null),
    filt ? el('div', { class: 'grid' }, l.map(tile)) : railEl(l))));
}
function open(i){
  cur = i; const m = order[i]; if (!m) return;
  $('#shimg').replaceChildren(m.image ? el('img', { src: m.image, alt: 'โปสเตอร์ ' + m.title }) : el('div', { class: 'ph big' }, main(m.title)));
  $('#shbody').replaceChildren(
    el('div', { class: 'sh-top' },
      el('button', { class: 'ib', 'aria-label': 'เรื่องก่อนหน้า', disabled: i === 0 || null, onclick: () => open(i - 1) }, '‹'),
      el('button', { class: 'ib', 'aria-label': 'เรื่องถัดไป', disabled: i === order.length - 1 || null, onclick: () => open(i + 1) }, '›'),
      el('button', { class: 'ib', 'aria-label': 'ปิด', onclick: () => sheet.close() }, '✕')),
    el('div', { class: 'pgroup' }, m.group),
    el('h2', { class: 'ptitle' }, m.title),
    el('div', { class: 'pline' }, m.cheese != null ? el('span', { class: 'pscore' }, '🧀 ' + num(m.cheese), el('small', {}, '/10')) : null, el('span', {}, 'โพสต์เมื่อ ' + fmt(m.date))),
    el('div', { class: 'rv' }, m.review.split(/\n{2,}/).map(t => el('p', {}, t))),
    el('span', { class: 'src' }, 'โพสต์ใน Facebook', m.tag ? [' ', el('b', {}, '#sheisbingewatchin')] : null));
  $('#shbody').scrollTop = 0; $('#shimg').scrollTop = 0; $('.sh').scrollTop = 0;
  if (!sheet.open) { sheet.showModal(); document.body.style.overflow = 'hidden'; }
  history.replaceState(null, '', '#' + m.id);
}
sheet.addEventListener('close', () => { document.body.style.overflow = ''; cur = -1; history.replaceState(null, '', location.pathname); });
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });
addEventListener('keydown', e => { if (!sheet.open) return; if (e.key === 'ArrowRight' && cur < order.length - 1) open(cur + 1); if (e.key === 'ArrowLeft' && cur > 0) open(cur - 1); });
new IntersectionObserver(([e]) => $('#bar').classList.toggle('stuck', !e.isIntersecting)).observe($('#sent'));
fetch('movieshelf/movies.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
  movies = d.movies || [];
  groups = d.groups || [...new Set(movies.map(m => m.group))];
  movies.forEach(m => { if (!groups.includes(m.group)) groups.push(m.group); });
  $('#n').textContent = movies.length; $('#nm').textContent = movies.filter(m => !isSeries(m)).length; $('#ns').textContent = movies.filter(isSeries).length;
  if (d.updated) $('#upd').textContent = 'อัปเดต ' + fmt(d.updated);
  render();
  const h = location.hash.slice(1); const i = order.findIndex(m => m.id === h); if (i >= 0) open(i);
  if (!movies.length) $('#main').replaceChildren(el('p', { class: 'empty' }, 'ยังไม่มีรีวิว'));
});
})();
</script>
