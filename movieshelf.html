<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>movieshelf — sheislab</title>
<meta name="description" content="รีวิวหนังและซีรีส์ของ sheismaug #sheisbingewatchin">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--ink:#0d0d0d;--ink2:#3a3a3a;--mut:#7a7a7a;--line:#ececec;--soft:#f6f6f6;--pop:#f5c800}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Google Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:40px 0 20px}
.crumb{font-size:14.5px;color:var(--mut);text-decoration:none;display:flex;gap:8px;align-items:center}
.crumb b{color:var(--ink);font-weight:600}
.crumb i{width:7px;height:7px;border-radius:50%;background:var(--pop)}
.navr{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
#upd{margin-right:8px}
.social{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:var(--ink2);border:1px solid var(--line);transition:.2s}
.social svg{width:17px;height:17px}
.social:hover{color:var(--pop);background:var(--ink);border-color:var(--ink)}

.head{padding:56px 0 34px}
.kick{font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.kick::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--pop)}
h1{font-size:clamp(46px,8vw,84px);font-weight:500;letter-spacing:-.04em;line-height:.95}
h1 span{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--ink);margin-left:.04em;box-shadow:0 .14em 0 -.04em var(--pop)}
.head{position:relative}
.popcorn{position:absolute;right:6px;bottom:22px;width:124px;height:auto;overflow:visible}
.pc-body{transform-origin:80px 196px;animation:pcbob 4.5s ease-in-out infinite}
.head:hover .pc-body{animation:pcwig .6s ease-in-out 2}
.pc-fly .k1{animation:pcpop 3.6s ease-in-out infinite}
.pc-fly .k2{animation:pcpop 3.6s ease-in-out 1.8s infinite}
.pc-fly .spark{transform-box:fill-box;transform-origin:center;animation:pctw 2.8s ease-in-out infinite}
.pc-fly .s2{animation-delay:1.4s}
@keyframes pcbob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes pcwig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes pcpop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pctw{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.1);opacity:1}}

/* chips */
.bar{position:sticky;top:0;z-index:5;margin:0 -32px;padding:14px 32px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:rgba(255,255,255,.94);backdrop-filter:blur(6px)}
.bar.stuck{border-bottom:1px solid var(--line)}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:99px;font-size:14.5px;color:var(--mut);border:1px solid var(--line);transition:.2s;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:#cfcfcf}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--pop);font-weight:600}
.seg{flex:none;display:flex;padding:3px;border-radius:99px;background:var(--soft)}
.seg button{padding:6px 14px;border-radius:99px;font-size:14.5px;color:var(--mut);white-space:nowrap;transition:.2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--pop);font-weight:600}
.seg small{margin-left:5px;font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.sbtn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);color:var(--ink2);font-size:17px;display:none;align-items:center;justify-content:center}
.chip.sel{display:inline-flex;align-items:center;gap:4px;color:var(--ink2);cursor:pointer;position:relative}
.chip.sel b{font-weight:600;color:var(--ink)}
.chip.sel select{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;font-size:16px}
.chip.sel span{font-size:10px;color:var(--mut)}
.chip.sel .lb{font-size:inherit;color:var(--mut)}
.chip.sel:focus-within{border-color:var(--ink)}
.chip small{margin-left:6px;font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.sep{flex:none;width:1px;background:var(--line);margin:6px 4px}
.srch{flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.srch input{width:150px;padding:8px 0;border:0;background:none;font:inherit;font-size:14.5px;color:var(--ink);outline:none}
.srch:focus-within{border-color:var(--ink)}
.grow{flex:1 0 8px}
/* rails: one scrolling row per group */
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin:0 -32px;padding:4px 32px 12px;scroll-padding:0 32px}
.rail::-webkit-scrollbar{display:none}
.rail .tile{flex:0 0 250px;scroll-snap-align:start}
.railwrap{position:relative}
.rbtn{position:absolute;top:calc(50% - 36px);width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:20px;color:var(--ink);z-index:2;display:none}
.rbtn:hover{background:var(--ink);color:var(--pop)}
.rbtn.l{left:-14px}.rbtn.r{right:-14px}
@media(hover:hover) and (min-width:821px){.railwrap.can-l .rbtn.l,.railwrap.can-r .rbtn.r{display:block}}
.rh .all{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--ink);padding:5px 12px;border-radius:99px;border:1px solid var(--line)}
.rh .all:hover{background:var(--ink);color:var(--pop);border-color:var(--ink)}

/* top 3 */
.top3{margin-top:30px}
.t3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.t3c{position:relative;display:flex;flex-direction:column;text-align:left;border-radius:18px;overflow:hidden;background:var(--ink);color:#fff;min-width:0;transition:transform .3s cubic-bezier(.3,.7,.4,1),box-shadow .3s}
.t3c:hover{transform:translateY(-4px);box-shadow:0 20px 40px -18px rgba(0,0,0,.5)}
.t3c .im{position:relative;aspect-ratio:16/10;overflow:hidden}
.t3c .im img{width:100%;height:100%;object-fit:cover;display:block}
.t3c .im img.tall{object-position:center 22%}
.t3c .im::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(13,13,13,.92))}
.t3c .rk{position:absolute;left:16px;bottom:-14px;z-index:1;font-size:92px;font-weight:700;line-height:1;letter-spacing:-.05em;color:var(--pop)}
.t3c .bd{padding:4px 18px 18px 74px;display:flex;flex-direction:column;gap:4px;min-height:84px}
.t3c .nm{font-size:17px;font-weight:600;line-height:1.3}
.t3c .mt{font-size:13px;color:rgba(255,255,255,.6)}
.t3c .sc{position:absolute;top:12px;right:12px;padding:5px 11px;border-radius:99px;background:var(--pop);color:var(--ink);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
/* rows */
.row{margin-top:34px}
.rh{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.rh h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.rh small{font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px 18px}
.tile{display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.pic{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--soft);isolation:isolate;transition:transform .3s cubic-bezier(.3,.7,.4,1),box-shadow .3s}
.pic .blur{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px) saturate(1.1);opacity:.55;z-index:-1}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic img.tall{object-position:center 22%}
.tile:hover .pic,.tile:focus-visible .pic{transform:translateY(-4px);box-shadow:0 16px 30px -14px rgba(0,0,0,.35)}
.score{position:absolute;top:10px;left:10px;padding:4px 9px 4px 7px;border-radius:99px;background:var(--ink);color:var(--pop);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.score.top{background:var(--pop);color:var(--ink)}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:16px;background:var(--ink);color:var(--pop);font-size:19px;font-weight:600;line-height:1.25;text-align:left;overflow-wrap:anywhere}
.ph.big{position:relative;aspect-ratio:4/5;border-radius:12px;font-size:26px;padding:22px}
.tt{font-size:15.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.tm{font-size:13px;color:var(--mut);margin-top:-6px}
.empty{padding:60px 0;text-align:center;color:var(--mut)}
.hint{margin:40px 0 0;font-size:14px;color:var(--mut);text-align:center}
footer{max-width:1180px;margin:60px auto 0;padding:20px 32px 36px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between;border-top:1px solid var(--line)}

/* detail sheet */
dialog.sheet{border:0;padding:0;margin:auto;width:min(1040px,calc(100vw - 48px));max-height:calc(100vh - 48px);border-radius:22px;background:#fff;color:var(--ink);overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.35)}
dialog.sheet::backdrop{background:rgba(13,13,13,.55);backdrop-filter:blur(6px)}
dialog.sheet[open]{animation:pop .3s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}}
.sh{display:grid;grid-template-columns:360px minmax(0,1fr);height:calc(100vh - 48px);max-height:calc(100vh - 48px)}
.sh-img{background:var(--soft);overflow:auto;padding:22px;min-height:0}
.sh-img img{width:100%;display:block;border-radius:12px;box-shadow:0 14px 30px -16px rgba(0,0,0,.4)}
.sh-body{overflow:auto;padding:46px 56px 56px;position:relative;min-height:0}
.sh-top{position:sticky;top:-46px;margin:-46px -56px 0;padding:18px 20px 14px;background:linear-gradient(#fff 75%,rgba(255,255,255,0));display:flex;justify-content:flex-end;gap:6px;z-index:2}
.ib{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);color:var(--ink2);font-size:18px;transition:.2s}
.ib:hover{background:var(--ink);color:var(--pop);border-color:var(--ink)}
.ib:disabled{opacity:.3;pointer-events:none}
.pgroup{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--mut)}
.ptitle{font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.2;margin-top:10px;text-wrap:balance}
.pline{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap;color:var(--mut);font-size:15px}
.pscore{display:inline-flex;align-items:baseline;gap:4px;padding:6px 14px;border-radius:99px;background:var(--ink);color:var(--pop);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.pscore small{font-size:12.5px;font-weight:500;opacity:.75}
.rv{max-width:36em;margin-top:26px}
.rv p{font-size:17.5px;line-height:1.95;color:var(--ink2);margin-top:16px;white-space:pre-line}
.src{display:inline-block;margin-top:30px;font-size:13.5px;color:var(--mut)}
.src b{color:var(--ink);font-weight:600}

.pq{margin-top:26px;font-size:21px;line-height:1.6;font-weight:500;padding-left:18px;border-left:3px solid var(--pop);max-width:30em}
.plbl{font-size:13px;font-weight:600;letter-spacing:.06em;color:#9a9a9a;margin-top:34px}
.jr{list-style:none;margin:16px 0 0;padding:12px 2px 18px;display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain}
.jr::-webkit-scrollbar{display:none}
.sh-body{min-width:0}
.jr li{flex:0 0 min(80%,290px);scroll-snap-align:start;min-width:0}
.jr .jm{font-size:13px;color:var(--mut);font-weight:500}
.jr figure{position:relative;margin:14px 0 0;transform:rotate(-1deg)}
.jr li:nth-child(even) figure{transform:rotate(1deg)}
.jr figure img{display:block;width:100%;aspect-ratio:16 / 10;object-fit:cover;border-radius:4px;box-shadow:0 10px 22px -10px rgba(0,0,0,.35);cursor:zoom-in;background:#f2f2f2}
.jr figure::before{content:"";position:absolute;width:64px;height:18px;background:rgba(245,200,0,.55);top:-8px;left:50%;margin-left:-32px;transform:rotate(3deg);z-index:1}
.jr p{font-size:16px;line-height:1.85;color:var(--ink2);margin-top:16px;white-space:pre-line}
.jrh{display:flex;align-items:center;gap:10px}.jrh>span:first-child{flex:1}
.jrn{display:none;gap:6px}
.jrn button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:17px;line-height:1;cursor:pointer;padding:0}
.jrn button:disabled{opacity:.3;cursor:default}
@media (hover:hover){.jrn{display:flex}}
.endc{margin-top:18px;max-width:36em;padding:22px 24px;border-radius:16px;background:var(--soft)}
.endc p{font-size:17.5px;line-height:1.95;color:var(--ink2);white-space:pre-line}
.endc p+p{margin-top:14px}
.notyet{margin-top:18px;max-width:36em;padding:18px 22px;border-radius:16px;border:1.5px dashed var(--line);color:var(--mut);font-size:15px}
.pnow{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:var(--ink2);padding:6px 12px;border-radius:99px;background:var(--soft)}
.pnow i{width:7px;height:7px;border-radius:50%;background:var(--pop)}
.pz{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:grid;place-items:center;overflow:hidden;touch-action:none;padding:16px;cursor:zoom-out}
.pz img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:50% 50%;user-select:none;-webkit-user-drag:none;cursor:zoom-in;will-change:transform}
.jr figure .hlsv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:multiply;border-radius:4px}
.pz .pzhl{position:absolute;pointer-events:none;mix-blend-mode:multiply;transform-origin:50% 50%;will-change:transform}
.pz.zin img{cursor:grab}.pz.zin.drag img{cursor:grabbing}
.pz .pzx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:22px;line-height:40px;cursor:pointer}
.pz .pzh{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:13px;pointer-events:none;transition:opacity .3s}
.pz.zin .pzh{opacity:0}
/* watching now */
.now{margin-top:30px}
.nowh{font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nowh i{width:8px;height:8px;border-radius:50%;background:var(--pop);box-shadow:0 0 0 0 rgba(245,200,0,.6);animation:pulse 2s ease-out infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(245,200,0,0)}100%{box-shadow:0 0 0 0 rgba(245,200,0,0)}}
.nowl{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.nowl::-webkit-scrollbar{display:none}
.nb{flex:0 0 auto;width:min(460px,86vw);display:flex;gap:16px;padding:14px;border:1px solid var(--line);border-radius:20px;text-align:left;transition:border-color .2s,box-shadow .2s}
.nb:hover{border-color:#d6d6d6;box-shadow:0 14px 30px -20px rgba(0,0,0,.3)}
.nb>img,.nb>.ph{position:relative;flex:none;width:150px;aspect-ratio:16/10;object-fit:cover;border-radius:10px;background:var(--soft)}
.nb .bd{min-width:0;display:flex;flex-direction:column}
.nb .t{font-size:17px;font-weight:600;line-height:1.3}
.nb .m{font-size:13px;color:var(--ink2);margin-top:6px;font-variant-numeric:tabular-nums}
.nb .pg{margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
.nb .pg img{width:40px;height:26px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
@media(max-width:820px){.nb>img,.nb>.ph{width:112px}.pq{font-size:19px}}
@media(min-width:821px){
  .sh.jbook{grid-template-columns:minmax(0,1fr)}
  .sh.jbook .sh-img{display:none}
  .sh.jbook .sh-body{padding:46px 64px 64px}
  .sh.jbook .sh-body>*:not(.sh-top){max-width:820px;margin-left:auto;margin-right:auto}
  .jhead{display:flex;gap:22px;align-items:flex-end}
  .jhead>img{width:180px;aspect-ratio:16/10;object-fit:cover;border-radius:10px;box-shadow:0 10px 24px -12px rgba(0,0,0,.4);flex:none}
  .sh.jbook .endc,.sh.jbook .rv{max-width:none}
  .sh.jbook .src{display:block}
}
@media(max-width:820px){.jhead>img{display:none}}
@media(max-width:820px){
  .wrap{padding:0 18px}
  .bar{margin:0 -18px;padding:12px 18px}
  .nav{padding-top:28px}
  .head{padding:36px 0 26px}
  .popcorn{width:78px;right:0;bottom:auto;top:22px}
  .grid{grid-template-columns:1fr;gap:20px}
  .rail{margin:0 -18px;padding:4px 18px 12px;gap:12px;scroll-padding:0 18px}
  .t3{display:flex;flex-direction:column;gap:8px}
  .t3c{flex-direction:row;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--soft);color:var(--ink)}
  .t3c:hover{transform:none;box-shadow:none}
  .t3c .im{flex:0 0 96px;aspect-ratio:16/10;border-radius:9px;order:1}
  .t3c .im::after{display:none}
  .t3c .rk{position:static;order:0;flex:0 0 22px;font-size:30px;text-align:center;color:var(--ink);-webkit-text-stroke:0}
  .t3c .bd{order:2;flex:1;min-width:0;padding:0;min-height:0;gap:2px}
  .t3c .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t3c .mt{color:var(--mut);font-size:12.5px}
  .t3c .sc{position:static;order:3;flex:none;font-size:13px;padding:4px 9px}
  .rail .tile{flex-basis:168px}
  .row{margin-top:28px}
  .rh h2{font-size:18px}
  .tt{font-size:14.5px}
  .bar{flex-wrap:wrap;row-gap:8px}
  .bar{gap:6px}
  .seg button{padding:6px 11px;font-size:14px}
  .seg small{display:none}
  .chip.sel .lb{display:none}
  .sbtn{display:inline-flex;margin-left:auto}
  .srch{display:none;order:9;flex:1 1 100%}
  .bar.sopen .srch{display:flex}
  .bar.sopen .sbtn{background:var(--ink);color:var(--pop);border-color:var(--ink)}
  .srch input{width:100%}
  .grow{display:none}
  .sep{display:none}
  .chip{padding:7px 13px;font-size:14px}
  .tt{font-size:14.5px}
  footer{padding:20px 18px 30px}
  #upd{display:none}
  dialog.sheet{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}
  .sh{grid-template-columns:1fr;height:100dvh;max-height:100dvh;overflow:auto}
  .sh-img{order:-1;overflow:visible;padding:0 18px;background:none}
  .sh-body{overflow:visible;padding:20px 22px 40px}
  .sh-top{position:fixed;top:0;left:0;right:0;margin:0;padding:12px 14px;background:none}
  .sh-img{padding-top:62px}
  .sh-img img{max-height:52vh;width:auto;max-width:100%;margin:0 auto}
  .ptitle{font-size:28px}
  .rv p{font-size:17px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>

const HL_NS = 'http://www.w3.org/2000/svg';

    if (hsv) Object.assign(hsv.style, { left: img.offsetLeft + 'px', top: img.offsetTop + 'px', width: img.offsetWidth + 'px', height: img.offsetHeight + 'px', transform: img.style.transform });

function render(keepBar){

      el('button', { class: 'ib', 'aria-label': 'ปิด', onclick: () => sheet.close() }, '✕')),
    el('div', { class: 'jhead' }, jb && m.image ? el('img', { src: m.image, alt: '' }) : null, el('div', {},
      el('div', { class: 'pgroup' }, [m.group, m.genre, m.year].filter(Boolean).join(' · ')),
      el('h2', { class: 'ptitle' }, m.title),
      m.status === 'reading' ? el('div', { class: 'pnow' }, el('i'), 'กำลังดู' + (nowLine(m) ? ' · ' + nowLine(m) : ''))
        : el('div', { class: 'pline' }, m.cheese != null ? el('span', { class: 'pscore' }, '🧀 ' + num(m.cheese), el('small', {}, '/10')) : null, el('span', {}, (m.start && m.start !== m.date ? 'ดู ' + (Math.round((new Date(m.date + 'T00:00') - new Date(m.start + 'T00:00')) / 864e5) + 1) + ' วัน · จบ ' : 'โพสต์เมื่อ ') + fmt(m.date))))),
    m.quote ? el('blockquote', { class: 'pq' }, m.quote) : null,
    (m.pages || []).length ? [railHead('ระหว่างดู · ' + m.pages.length + ' ฉากที่ชอบ'),
      el('ol', { class: 'jr' }, m.pages.map(x => el('li', {},
        el('div', { class: 'jm' }, [x.p ? 'EP ' + x.p : '', x.d ? thDate(x.d) : ''].filter(Boolean).join(' · ')),
        el('figure', {}, el('img', { src: x.img, alt: 'ฉากจาก ' + m.title + (x.p ? ' EP ' + x.p : ''), loading: 'lazy', onclick: () => zoom(x.img, x.hl) }), hlSvg(x.hl, 'slice')),
        x.t ? el('p', {}, x.t) : null)))] : null,
    m.ending ? [el('div', { class: 'plbl' }, 'ดูจบแล้ว'), el('div', { class: 'endc' }, paras(m.ending))] : null,
    m.status === 'reading' && !m.ending ? el('p', { class: 'notyet' }, (m.pages || []).length ? 'ยังดูอยู่ ดูจบแล้วจะมาเขียนตรงนี้' : 'ยังไม่ได้เก็บฉากที่ชอบ เจอเมื่อไรจะขึ้นตรงนี้') : null,
    m.review ? [jb ? el('div', { class: 'plbl' }, 'รีวิว') : null, el('div', { class: 'rv' }, paras(m.review))] : null,
    el('span', { class: 'src' }, m.source === 'kann' ? 'จดใน KANN' : 'โพสต์ใน Facebook', m.tag ? [' ', el('b', {}, '#sheisbingewatchin')] : null)].flat(2).filter(Boolean));
  $('.sh').classList.toggle('jbook', jb);
  $('#shbody').scrollTop = 0; $('#shimg').scrollTop = 0; $('.sh').scrollTop = 0;
  if (!sheet.open) { sheet.showModal(); document.body.style.overflow = 'hidden'; }
  history.replaceState(null, '', '#' + m.id);
}
sheet.addEventListener('close', () => { document.body.style.overflow = ''; cur = -1; history.replaceState(null, '', location.pathname); });
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });
addEventListener('keydown', e => { if (!sheet.open) return; if (e.key === 'ArrowRight' && cur < order.length - 1) open(cur + 1); if (e.key === 'ArrowLeft' && cur > 0) open(cur - 1); });
new IntersectionObserver(([e]) => $('#bar').classList.toggle('stuck', !e.isIntersecting)).observe($('#sent'));
fetch('movieshelf/movies.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
  movies = d.movies || [];
  groups = d.groups || [...new Set(movies.map(m => m.group))];
  movies.forEach(m => { if (!groups.includes(m.group)) groups.push(m.group); });
  genres = d.genres || []; movies.forEach(m => { if (m.genre && !genres.includes(m.genre)) genres.push(m.genre); });
  small = new Set(genres.filter(g => movies.filter(m => m.genre === g).length < 3));
  if (d.updated) $('#upd').textContent = 'อัปเดต ' + fmt(d.updated);
  render();
  const h = location.hash.slice(1); const i = order.findIndex(m => m.id === h); if (i >= 0) open(i);
  if (!movies.length) $('#main').replaceChildren(el('p', { class: 'empty' }, 'ยังไม่มีรีวิว'));
});
})();
