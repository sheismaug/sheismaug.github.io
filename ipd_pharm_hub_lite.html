<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>IPD Pharm Hub · รพ.ห้วยผึ้ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#111111; --mute:#5f5f5f; --faint:#8b8b86; --cream:#FBF8F1; --line:#efebe2;
  --lime:#C6F135; --limed:#B5DD3C; --limec:#F1FBD0; --limee:#DCEFA0; --deep:#7FA314;
  --lav:#EFEBFC; --lavd:#D9D1F5; --lavt:#5B4BB0; --sage:#EEF3EA; --saged:#D7E2CF;
  --peach:#FCE9DE; --red:#C0202A; --bad:#B3372B; --badbg:#FDECEA;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Google Sans',sans-serif;font-size:14px}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.mont{font-family:Montserrat,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:18px 24px 60px}
.soft{border-radius:24px;box-shadow:0 5px 0 rgba(0,0,0,.06);background:#fff}
.hide{display:none!important}
/* nav */
.nav{display:flex;align-items:center;gap:16px;padding:10px 12px 10px 18px;border-radius:999px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:8px}
.brand b{font-family:Montserrat,sans-serif;font-weight:800;font-size:16px}
.brand small{display:block;font-size:11px;color:var(--mute)}
.navit{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 5px;border-radius:999px;border:none;background:transparent;color:var(--mute);font-size:14px}
.navit .c{width:32px;height:32px;border-radius:50%;background:#f4f2ec;display:flex;align-items:center;justify-content:center}
.navit.on{background:var(--lime);color:var(--ink);font-weight:700;box-shadow:0 4px 0 var(--limed)}
.navit.on .c{background:#fff}
/* hero */
.hello{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.hello i{width:8px;height:8px;border-radius:50%;background:var(--deep);display:inline-block}
h1{margin:6px 0 8px;font-size:42px;font-weight:700;line-height:1.25;letter-spacing:-.5px}
.mark{display:inline-block;background:var(--lime);padding:0 14px;border-radius:14px;box-shadow:0 5px 0 var(--limed);transform:rotate(-1.5deg)}
.prog{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.bar{width:160px;height:8px;border-radius:4px;background:#efebe2;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink);border-radius:4px}
/* layout */
.main{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;padding-top:28px}
.left{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:18px}
.right{flex:1 1 360px;max-width:400px;position:sticky;top:16px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.05);color:var(--mute);flex:1;max-width:260px}
.search input{border:none;outline:none;background:transparent;width:100%;font-size:13px}
.ghost{height:40px;padding:0 14px;border-radius:999px;border:none;background:transparent;color:var(--mute);font-size:13px}
.ghost.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.black{height:40px;padding:0 18px;border-radius:999px;border:none;background:var(--ink);color:#fff;font-size:13px;font-weight:700;box-shadow:0 4px 0 #000;display:inline-flex;align-items:center;gap:6px}
/* groups */
.grp{border-radius:28px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:10px}
.grp.todo{background:var(--limec);box-shadow:0 5px 0 var(--limee)}
.grp.wait{background:var(--lav);box-shadow:0 5px 0 var(--lavd)}
.grph{display:flex;align-items:flex-start;gap:12px;padding:0 4px}
.grph .t{font-size:20px;font-weight:700}
.grph .t span{font-family:Montserrat,sans-serif;font-weight:800;color:var(--mute);font-size:17px}
.grph .s{font-size:13px;color:var(--mute)}
.badge{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.08);flex:none;margin-left:auto}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;border-radius:18px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.07);cursor:pointer}
.row.sel{outline:2px solid var(--ink);outline-offset:-2px}
.lead{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.hn{font-family:Montserrat,sans-serif;font-size:17px;font-weight:800;min-width:64px}
.nm{color:var(--mute);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.devs{display:flex;gap:4px}
.dev{width:28px;height:28px;border-radius:10px;background:#f6f4ee;display:flex;align-items:center;justify-content:center}
.go{height:36px;padding:0 16px;border-radius:14px;border:none;background:var(--lime);font-size:13px;font-weight:700;box-shadow:0 4px 0 var(--limed);display:inline-flex;align-items:center;gap:6px}
.waittag{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:999px;background:var(--lav);color:var(--lavt);font-size:12px;font-weight:600}
.vdate{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:#f6f4ee;font-size:12px;white-space:nowrap}
.vdate.latest{background:var(--limec);font-weight:700}
.row.old{opacity:.6}
.stt{font-size:12px;color:var(--mute);white-space:nowrap}
.dc{height:32px;padding:0 11px;border-radius:12px;border:none;background:#f4f2ec;color:var(--mute);font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;box-shadow:0 3px 0 #e2ded4}
.closure{margin:-2px 6px 6px 56px;padding:14px 16px;border-radius:16px;background:#fff;outline:2px solid var(--ink);outline-offset:-2px;display:flex;flex-direction:column;gap:10px}
.closure .it{display:flex;align-items:center;gap:10px;font-size:13px}
.closure .it em{margin-left:auto;font-style:normal;font-size:12px;color:var(--mute)}
.done{display:flex;align-items:center;gap:12px;padding:12px 18px 12px 10px;border:none;border-radius:24px;background:var(--sage);box-shadow:0 5px 0 var(--saged);text-align:left;width:100%}
.empty{padding:28px;text-align:center;color:var(--mute)}
/* panel */
.panel{background:#fff;border-radius:28px;box-shadow:0 5px 0 rgba(0,0,0,.07);padding:22px;display:flex;flex-direction:column;gap:18px}
.ph{display:flex;align-items:flex-start;gap:10px}
.ph .h{font-family:Montserrat,sans-serif;font-size:28px;font-weight:800;line-height:1.05}
.ph .s{font-size:13px;color:var(--mute)}
.saved{font-size:11px;color:var(--mute);display:inline-flex;align-items:center;gap:4px;padding-top:6px;white-space:nowrap}
.saved.err{color:var(--bad);cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:18px;border:none;background:#fff;box-shadow:0 4px 0 #ebe7dd;outline:1px solid #efece5;outline-offset:-1px;text-align:left}
.tab.on{background:var(--limec);box-shadow:0 4px 0 var(--limee);outline:2px solid var(--ink);outline-offset:-2px}
.tab .ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tab b{font-size:13px}
.tab span{font-size:11px;color:var(--mute)}
.q{display:flex;flex-direction:column;gap:8px}
.q>b{font-size:15px}
.q>b small{font-weight:400;font-size:12px;color:var(--mute)}
.grid2,.grid3{display:grid;gap:10px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 4px;border-radius:18px;border:none;background:#f8f6f0;box-shadow:0 4px 0 #e9e5db;min-width:0}
.opt span{font-size:13px}
.opt small{font-size:10px}
.opt.on{background:var(--limec);box-shadow:0 4px 0 var(--limed);outline:2px solid var(--ink);outline-offset:-2px}
.opt.on span{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 4px;border-radius:999px;border:none;background:#f6f4ee;box-shadow:0 3px 0 #e6e2d8;font-size:13px}
.av{width:26px;height:26px;border-radius:50%;background:var(--lime);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.staff{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:#faf8f3}
.staff small{font-size:11px;color:var(--mute)}
.staff .l{display:flex;flex-wrap:wrap;gap:6px}
.sp{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 4px;border-radius:999px;border:none;background:#fff;font-size:12px}
.sp .av{width:24px;height:24px;background:#f1efe9}
.sp.on{background:var(--ink);color:#fff}
.sp.on .av{background:var(--lime);color:var(--ink)}
.datechip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;background:#f3f1ea;font-size:12px;position:relative}
.datechip{cursor:pointer}
.datechip b{font-weight:500}
.datechip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none;cursor:pointer}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--limec)}
.banner.bad{background:var(--badbg)}
.banner.warn{background:#FFF4D6}
.banner b{font-size:15px;display:block}
.banner span{font-size:12px;color:var(--mute)}
.lnk{border:none;background:transparent;padding:0;color:var(--mute);font-size:12px;text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px dashed #cfccc4;background:#fff;color:var(--mute);font-size:12px}
.pill.on{border-style:solid;border-color:var(--ink);color:var(--ink);font-weight:700}
.strip{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:#faf8f3}
.cells{display:flex;gap:6px}
.cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute)}
.cell span{width:100%;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#efece4}
.cell.mr span{background:var(--ink)}
.cell.md span{background:var(--lav);outline:2px solid var(--lavt);outline-offset:-2px}
.hist{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#faf8f3}
.hist span{flex:1;font-size:13px}
.hist em{font-style:normal;font-size:12px;color:var(--mute)}
.inp{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute)}
.inp input{height:46px;border:1px solid #e3e0d8;border-radius:14px;padding:0 14px;font-size:15px;color:var(--ink);background:#fff}
.inp input::placeholder{color:#c9c6bd;font-weight:400}
.inp input.big{border:2px solid var(--ink);font-family:Montserrat,sans-serif;font-size:20px;font-weight:700}
.warn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:#faf8f3;color:var(--mute);font-size:12px}
.primary{height:48px;border-radius:999px;border:none;background:var(--ink);color:#fff;font-size:15px;font-weight:700;box-shadow:0 4px 0 #000}
.err{color:var(--bad);font-size:12px}
/* report */
.rtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:28px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpi{background:#fff;border-radius:24px;box-shadow:0 5px 0 rgba(0,0,0,.06);padding:20px;display:flex;flex-direction:column;gap:14px}
.kh{display:flex;align-items:center;gap:10px}
.kh .ib{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.kh b{font-size:14px}
.kh small{display:block;font-size:11px;color:var(--mute)}
.kr{display:flex;align-items:center;gap:16px}
.kr .n{font-family:Montserrat,sans-serif;font-size:18px;font-weight:700}
.kr .n small{color:var(--mute);font-weight:600}
.minibars{display:flex;align-items:flex-end;gap:4px;height:44px}
.minibars span{flex:1;border-radius:4px;background:#e6efcf;min-height:2px}
.minibars span.last{background:var(--ink)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hb{display:grid;grid-template-columns:78px minmax(0,1fr) 40px;align-items:center;gap:8px;font-size:12px}
.hb i{height:12px;border-radius:6px;display:block}
.devgrid{display:flex;gap:8px;flex-wrap:wrap}
.devc{flex:1 1 90px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:18px;background:#f8f6f0}
.devc b{font-family:Montserrat,sans-serif;font-size:24px;font-weight:800;line-height:1}
.devc span{font-size:12px;color:var(--mute)}
table.mon{border-collapse:collapse;font-size:12px;margin-top:8px;background:#fff;border-radius:12px;overflow:hidden}
table.mon th,table.mon td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.mon th:first-child,table.mon td:first-child{text-align:left}
details summary{cursor:pointer;font-size:13px;font-weight:700}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);display:flex;align-items:center;gap:14px;height:48px;padding:0 8px 0 18px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{height:34px;padding:0 14px;border-radius:999px;border:none;background:var(--lime);color:var(--ink);font-size:13px;font-weight:700}
#toast.noact{padding-right:18px}

/* PIN */
#pin{position:fixed;inset:0;z-index:50;background:var(--cream);display:flex;align-items:center;justify-content:center}
.pinbox{width:320px;max-width:calc(100vw - 32px);background:#fff;border-radius:28px;box-shadow:0 5px 0 rgba(0,0,0,.07);padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pinbox h2{margin:0;font-size:18px}
.pslots{display:flex;gap:10px}
.pslot{width:46px;height:54px;border-radius:16px;background:#f6f4ee;box-shadow:0 4px 0 #e6e2d8;display:flex;align-items:center;justify-content:center;font-family:Montserrat,sans-serif;font-size:22px;font-weight:800}
.pslot.on{background:var(--limec);box-shadow:0 4px 0 var(--limed)}
.pslots.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:10px}
.pad button{height:56px;border-radius:18px;border:none;background:#f8f6f0;box-shadow:0 4px 0 #e9e5db;font-family:Montserrat,sans-serif;font-size:20px;font-weight:700}
.pad button:active{transform:translateY(2px);box-shadow:0 2px 0 #e9e5db}
#pinIn{position:absolute;opacity:0;width:1px;height:1px}
@media (max-width:900px){.right{position:static;max-width:none}.kpis,.row2{grid-template-columns:1fr}h1{font-size:32px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <div class="brand"><span id="logoM"></span><div><b>IPD <span style="color:var(--red)">●</span> Pharm Hub</b><small>รพ.ห้วยผึ้ง</small></div></div>
    <nav style="display:flex;gap:6px;margin:0 auto">
      <button class="navit on" id="navEntry" onclick="showView('entry')"><span class="c" data-ic="clip"></span>วันนี้</button>
      <button class="navit" id="navReport" onclick="showView('report')"><span class="c" data-ic="chart"></span>รายงาน</button>
    </nav>
    <span id="today" style="font-size:13px;color:var(--mute);padding-right:8px"></span>
  </div>

  <!-- ═══ ลงข้อมูล ═══ -->
  <section id="vEntry">
    <div class="main">
      <div class="left">
        <div id="hero"></div>
        <div class="tools">
          <label class="search"><span data-ic="search"></span><input id="qHN" placeholder="ค้น HN" inputmode="numeric" aria-label="ค้น HN"></label>
          <button class="ghost on" id="tActive" onclick="setList('active')">กำลังนอน</button>
          <button class="ghost" id="tDC" onclick="setList('dc')">D/C แล้ว</button>
          <span id="dcRange" class="hide" style="display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--mute)">D/C <input type="date" id="dcFrom"> – <input type="date" id="dcTo"></span>
          <button class="black" style="margin-left:auto" onclick="openRegister()"><span data-ic="plus"></span>ลงทะเบียน</button>
        </div>
        <div id="list"><div class="empty">กำลังโหลด…</div></div>
      </div>
      <div class="right"><div class="panel" id="panel"></div></div>
    </div>
  </section>

  <!-- ═══ รายงาน ═══ -->
  <section id="vReport" class="hide">
    <div class="rtools">
      <button class="ghost" data-rp="thism" onclick="setRp('thism')">เดือนนี้</button>
      <button class="ghost" data-rp="lastm" onclick="setRp('lastm')">เดือนที่แล้ว</button>
      <button class="ghost on" data-rp="fy" onclick="setRp('fy')">ปีงบนี้</button>
      <button class="ghost" data-rp="lastfy" onclick="setRp('lastfy')">ปีงบที่แล้ว</button>
      <span style="display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--mute)"><input type="date" id="rpFrom"> – <input type="date" id="rpTo"><button class="ghost" onclick="setRp('custom')">ดู</button></span>
      <button class="black" style="margin-left:auto" onclick="exportReport()">Export Excel</button>
    </div>
    <div id="rpBody" style="display:flex;flex-direction:column;gap:16px;padding-top:18px"><div class="empty">กำลังคำนวณ…</div></div>
  </section>
</div>
<div id="pin" class="hide">
  <div class="pinbox">
    <span id="pinM"></span>
    <h2>ใส่รหัส 4 หลัก</h2>
    <div class="pslots" id="pslots" onclick="$('pinIn').focus()"><span class="pslot"></span><span class="pslot"></span><span class="pslot"></span><span class="pslot"></span></div>
    <input id="pinIn" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="รหัส PIN">
    <span id="pinErr" class="err" style="min-height:16px"></span>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinKey('${n}')">${n}</button>`).join('')}<span></span><button onclick="pinKey('0')">0</button><button aria-label="ลบ" onclick="pinKey('del')">⌫</button></div>
  </div>
</div>
<div id="toast"><span id="toastMsg"></span><button id="toastBtn">ยกเลิก</button></div>

<script>
// ── Supabase Edge Function ─────────────────────────
const API = 'https://qvtlekphxsubuklyirlz.supabase.co/functions/v1/ipd-hub';
const KEY = 'sb_publishable_dPhW0DORMGlSTc1hzvT4Cw_9ChOlZ0H';
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const SH = { 'ดึก': 0, 'เช้า': 1, 'บ่าย': 2 };
const SH_IC = { 'ดึก': 'moon', 'เช้า': 'sun', 'บ่าย': 'sunset' };
const COUN = [['Syringe','syringe','Syringe'],['Penfill','pen','Penfill'],['Evohaler','mdi','Evohaler'],['Accuhaler','disc','Accuhaler'],['อื่นๆ','dots','อื่นๆ']];

// ── icons: line (ui) + duotone (cute) ──────────────
const K = '#2b2b2b';

// ── helpers ─────────────────────────────────────────
function api(action, data, ms) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), ms || 30000);
  return fetch(API, { method: 'POST', signal: ctrl.signal,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + KEY, 'apikey': KEY },
    body: JSON.stringify({ action, data: data || {} }) })
    .then(r => r.json()).catch(e => ({ ok: false, error: e.name === 'AbortError' ? 'timeout' : String(e.message || e) }))
    .finally(() => clearTimeout(t));
}
const $ = id => document.getElementById(id);
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayIso() { return iso(new Date()); }
function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); }
function thd(s, year) {           // "10 พ.ย." (+ ปีถ้าไม่ใช่ปีนี้ หรือขอ)
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); if (!m) return '—';
  const y = +m[1], showY = year || y !== new Date().getFullYear();
  return (+m[3]) + ' ' + TH_M[+m[2]-1] + (showY ? ' ' + String(y + 543).slice(year === 'full' ? 0 : -2) : '');
}
function sIdx(date, shift) { if (!date || SH[shift] === undefined) return null; return Math.round(new Date(date + 'T00:00:00Z').getTime() / 86400000) * 3 + SH[shift]; }
function curShift() { const h = new Date().getHours(); return h < 8 ? 'ดึก' : (h < 16 ? 'เช้า' : 'บ่าย'); }
function fillIcons(root) { (root || document).querySelectorAll('[data-ic]').forEach(el => { el.innerHTML = li(el.dataset.ic, +el.dataset.s || 16); }); }

// ── episode logic ───────────────────────────────────
function srcOf(e) { return (e.data_source === 'รพ.อื่น' || String(e.med_category || '').includes('นอก')) ? 'รพ.อื่น' : 'รพ.ห้วยผึ้ง'; }
function onTimeOf(e) {
  if (e.mr_status === 'ไม่พบรายการยาเดิม') return 'ผ่าน (ไม่พบยา)';
  if (e.mr_status !== 'มีรายการ MR') return e.mr_status ? '—' : '';
  const a = sIdx(e.admit_date, e.admit_shift), m = sIdx(e.mr_done_date, e.mr_done_shift);
  if (a === null || m === null) return '';
  const d = m - a; if (d < 0) return 'ก่อน admit';
  return (e.data_source === 'รพ.อื่น' ? d <= 3 : d === 0) ? 'ผ่าน' : 'ไม่ผ่าน';
}
function mrDone(e) { return !!e.mr_status && (e.mr_status !== 'มีรายการ MR' || (!!e.mr_done_shift && onTimeOf(e) !== 'ก่อน admit')); }
function needMR(e) { return !mrDone(e); }
function needMD(e) { return e.mr_status === 'มีรายการ MR' && mrDone(e) && !e.md_review_shift && e.md_status !== 'none'; }
function complete(e) { return mrDone(e) && !needMD(e); }
function mdGap(e) { const a = sIdx(e.mr_done_date || e.admit_date, e.mr_done_shift), b = sIdx(e.md_review_date, e.md_review_shift); return (a === null || b === null) ? null : b - a; }
function waitShifts(e) { const a = sIdx(e.mr_done_date || e.admit_date, e.mr_done_shift), n = sIdx(todayIso(), curShift()); return (a === null) ? null : Math.max(0, n - a); }
function find(id) { return EPS.find(e => e.mr_id === id); }
function adoptId(e, nid) { const old = e.mr_id; e.mr_id = nid; e._new = false; if (SEL === old) SEL = nid; if (CLOSE_ID === old) CLOSE_ID = nid; if (timers[old]) { clearTimeout(timers[old]); delete timers[old]; } }

// ── load ────────────────────────────────────────────
async function loadList() {
  const q = $('qHN').value.trim();
  const params = q ? { q } : (LISTMODE === 'dc' ? { mode: 'dc', from: $('dcFrom').value, to: $('dcTo').value } : { mode: 'active' });
  $('list').innerHTML = '<div class="empty">กำลังโหลด…</div>';
  const r = await api('listEpisodes', params, 40000);
  if (!r.ok) {
    const m = r.error || '';
    $('list').innerHTML = `<div class="empty err">โหลดไม่สำเร็จ (${esc(m)})${/Unknown action/.test(m) ? '<br>ยังไม่ได้ deploy Edge Function เวอร์ชันใหม่' : ''}${/dc_date|md_status|mr_done_date|column/.test(m) ? '<br>ยังไม่ได้รัน SQL lite_migration_20261110.sql' : ''}</div>`;
    return;
  }
  EPS = (r.episodes || []).map(e => Object.assign(e, { data_source: srcOf(e), md_status: e.md_status || '', _new: !e.mr_id, mr_id: e.mr_id || ('NEW:' + e.hn + ':' + (e.admit_date || '')) }));
  if (SEL && !find(SEL)) SEL = null;
  renderAll();
}
function setList(m) {
  LISTMODE = m; $('tActive').classList.toggle('on', m === 'active'); $('tDC').classList.toggle('on', m === 'dc');
  $('dcRange').classList.toggle('hide', m !== 'dc'); $('qHN').value = ''; SEL = null; PMODE = 'ep'; loadList();
}

// ── D/C ─────────────────────────────────────────────
function askDC(id) { const e = find(id); if (!e) return; if (complete(e)) { doDC(id); return; } CLOSE_ID = CLOSE_ID === id ? null : id; renderList(); }
async function doDC(id) {
  const e = find(id); if (!e) return;
  const snap = JSON.parse(JSON.stringify(e));
  if (needMR(e)) { e.mr_status = 'ไม่ได้ทำ MR'; e.mr_done_shift = ''; }
  if (needMD(e)) e.md_status = 'none';
  e.dc_date = todayIso(); e.on_time = onTimeOf(e);
  CLOSE_ID = null; if (SEL === id) SEL = null;
  const keep = EPS; if (LISTMODE === 'active') EPS = EPS.filter(x => x.mr_id !== id);
  renderAll();
  let r = await api('saveEpisode', payload(e));
  if (!r.ok && r.error === 'exists' && r.mrId) { adoptId(e, r.mrId); r = await api('saveEpisode', payload(e)); }
  if (r.ok && e._new && r.mrId) adoptId(e, r.mrId);
  if (!r.ok) { EPS = keep; Object.assign(e, snap); renderAll(); toast('D/C ไม่สำเร็จ — ลองใหม่', null); return; }
  snap.mr_id = e.mr_id; snap._new = false;
  REPORT = null;
  toast(`D/C ${e.hn} แล้ว`, async () => {
    Object.assign(e, snap); const r2 = await api('saveEpisode', payload(e));
    if (r2.ok) { toast(`ยกเลิก D/C ${e.hn} แล้ว`); loadList(); } else toast('ยกเลิกไม่สำเร็จ', null);
  });
}
async function undoDC(id) {
  const e = find(id); if (!e) return; e.dc_date = null;
  const r = await api('saveEpisode', payload(e));
  if (r.ok) { toast(`ยกเลิก D/C ${e.hn} แล้ว — กลับไปอยู่ในรายชื่อกำลังนอน`); REPORT = null; loadList(); } else toast('ยกเลิกไม่สำเร็จ', null);
}

// ── counseling ──────────────────────────────────────
async function addCoun(id, type) {
  const e = find(id); if (!e) return;
  let freeText = '';
  if (type === 'อื่นๆ') { freeText = (prompt('สอนยาอะไร?') || '').trim(); if (!freeText) return; }
  const date = ($('coDate') && $('coDate').value) || todayIso();
  const tmp = { id: null, date, type, freeText };
  e.counseling = e.counseling || []; e.counseling.push(tmp); renderAll(); setSaved('กำลังบันทึก…');
  const r = await api('saveCounseling', { hn: e.hn, date, type, count: 1, freeText });
  if (!r.ok || !r.id) { e.counseling = e.counseling.filter(x => x !== tmp); renderAll(); toast('บันทึกการสอนไม่สำเร็จ', null); return; }
  tmp.id = r.id; REPORT = null; setSaved('บันทึกแล้ว'); toast(`บันทึกสอน ${type} แล้ว`);
}
async function delCoun(id, cid) {
  const e = find(id); if (!e) return; const c = (e.counseling || []).find(x => String(x.id) === String(cid)); if (!c) return;
  e.counseling = e.counseling.filter(x => x !== c); renderAll();
  const r = await api('deleteCounseling', { id: cid });
  if (!r.ok) { e.counseling.push(c); renderAll(); toast('ลบไม่สำเร็จ', null); } else { REPORT = null; toast('ลบรายการสอนแล้ว'); }
}

// ── toast ───────────────────────────────────────────
let toastT;
function toast(msg, undo) {
  const t = $('toast'), b = $('toastBtn'); $('toastMsg').textContent = msg;
  if (typeof undo === 'function') { b.classList.remove('hide'); t.classList.remove('noact'); b.onclick = () => { t.classList.remove('show'); undo(); }; }
  else { b.classList.add('hide'); t.classList.add('noact'); }
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), typeof undo === 'function' ? 6000 : 2600);
}

// ── report ──────────────────────────────────────────
function showView(v) {

  $('navEntry').classList.toggle('on', v === 'entry'); $('navReport').classList.toggle('on', v === 'report');
  if (v === 'report' && !REPORT) loadReport();
}
function rpRange() {
  const t = new Date(), fy = t.getMonth() >= 9 ? t.getFullYear() : t.getFullYear() - 1;
  if (RP === 'custom') return { from: $('rpFrom').value, to: $('rpTo').value };
  if (RP === 'thism') return { from: iso(new Date(t.getFullYear(), t.getMonth(), 1)), to: iso(new Date(t.getFullYear(), t.getMonth() + 1, 0)) };
  if (RP === 'lastm') return { from: iso(new Date(t.getFullYear(), t.getMonth() - 1, 1)), to: iso(new Date(t.getFullYear(), t.getMonth(), 0)) };
  if (RP === 'lastfy') return { from: (fy - 1) + '-10-01', to: fy + '-09-30' };
  return { from: fy + '-10-01', to: (fy + 1) + '-09-30' };
}
function setRp(k) { RP = k; document.querySelectorAll('[data-rp]').forEach(b => b.classList.toggle('on', b.dataset.rp === k)); REPORT = null; loadReport(); }
async function loadReport() {
  const rg = rpRange(); $('rpFrom').value = rg.from; $('rpTo').value = rg.to;
  $('rpBody').innerHTML = '<div class="empty">กำลังคำนวณ…</div>';

  if (!r.ok) { $('rpBody').innerHTML = `<div class="empty err">โหลดรายงานไม่สำเร็จ (${esc(r.error)})</div>`; return; }

}
function ring(p, size, stroke, color, center) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, d = c * Math.max(0, Math.min(1, (p || 0) / 100));
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:none"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#efece4" stroke-width="${stroke}"></circle><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${d} ${c}" transform="rotate(-90 ${size/2} ${size/2})"></circle></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">${center}</div></div>`;
}
function pctTxt(v) { return (v === null || v === undefined) ? '—' : (Math.round(v * 10) / 10) + '%'; }
function monLab(k) { const m = /^(\d{4})-(\d{2})/.exec(k || ''); return m ? TH_M[+m[2]-1] + ' ' + String(+m[1] + 543).slice(-2) : k; }
function renderReport(r) {
  const s = r.summary, md = r.mdReview || {}, cn = r.counseling || { total: 0, byType: {} }, mon = r.monthly || [];
  const kpi = (icon, bg, title, sub, p, n, d, key) => {
    const bars = mon.map((m, i) => `<span class="${i === mon.length - 1 ? 'last' : ''}" style="height:${Math.max(4, m[key] || 0)}%" title="${monLab(m.month)} ${pctTxt(m[key])}"></span>`).join('');
    return `<div class="kpi"><div class="kh"><span class="ib" style="background:${bg}">${du(icon, 26)}</span><div><b>${title}</b><small>${sub}</small></div></div>
      <div class="kr">${ring(p, 108, 12, '#7FA314', `<span class="mont" style="font-size:24px;font-weight:800;line-height:1">${p === null || p === undefined ? '—' : Math.round(p * 10) / 10}<span style="font-size:13px">%</span></span>`)}<span class="n">${(n || 0).toLocaleString()}<small> / ${(d || 0).toLocaleString()}</small><br><small style="font-size:12px;font-weight:400">ราย</small></span></div>
      ${mon.length > 1 ? `<div class="minibars">${bars}</div>` : ''}</div>`;
  };
  const elig = md.eligible || 0, pS = elig ? md.same / elig * 100 : 0, p1 = elig ? (md.le1 - md.same) / elig * 100 : 0, pL = elig ? 100 - pS - p1 - (md.pending || 0) / elig * 100 : 0;
  const devs = COUN.map(c => `<div class="devc">${du(c[1], 30)}<b>${cn.byType[c[0]] || 0}</b><span>${c[2]}</span></div>`).join('');
  let h = `<div style="display:flex;align-items:center;gap:16px;padding:16px 22px;border-radius:24px;background:var(--limec);box-shadow:0 5px 0 var(--limee)">${mascot(60)}<div><b style="font-size:20px">ทำ MR ไปแล้ว ${(s.done + s.nomed).toLocaleString()} ราย</b><div style="font-size:13px;color:var(--mute)">admit ${thd(r.from, 'full')} – ${thd(r.to, 'full')} · สอนยา ${cn.total} ครั้ง</div></div></div>
    <div class="kpis">${kpi('clip', '#FFF6CC', 'ความครอบคลุม MR', 'ทำ MR / ผู้ป่วยที่มียาเดิม', s.coveragePct, s.done, s.need, 'coveragePct')}
      ${kpi('hosp', '#E8F0FF', 'ใน รพ. ภายใน 8 ชม.', 'รับยา รพ.ห้วยผึ้งที่เดียว', s.in8hPct, s.inPass, s.inN, 'in8hPct')}
      ${kpi('hosp2', '#FFEDE2', 'นอก รพ. ภายใน 24 ชม.', 'มีประวัติยานอก รพ.', s.out24hPct, s.outPass, s.outN, 'out24hPct')}</div>
    <div class="row2">
      <div class="kpi"><div class="kh"><span class="ib" style="background:#F1ECFF">${du('steth', 26)}</span><div><b>แพทย์สั่งยาเดิมเร็วแค่ไหน</b><small>นับจากเวรที่ MR เสร็จ · เฉพาะรายที่ลงผ่านหน้านี้</small></div></div>
        <div class="kr">${ring(md.le1Pct, 104, 12, '#5B4BB0', `<span class="mont" style="font-size:22px;font-weight:800;line-height:1">${md.le1Pct === null || md.le1Pct === undefined ? '—' : Math.round(md.le1Pct)}<span style="font-size:12px">%</span></span><span style="font-size:10px;color:var(--mute)">≤ 1 เวร</span>`)}
          <div style="flex:1;display:flex;flex-direction:column;gap:8px">
            <div class="hb"><span>เวรเดียวกัน</span><i style="background:#111;width:${pS}%"></i><b>${pctTxt(pS)}</b></div>
            <div class="hb"><span>+1 เวร</span><i style="background:#B9A6FF;width:${p1}%"></i><b>${pctTxt(p1)}</b></div>
            <div class="hb"><span>นานกว่า/ไม่สั่ง</span><i style="background:#ddd8cc;width:${Math.max(0, pL)}%"></i><b>${pctTxt(Math.max(0, pL))}</b></div>
          </div></div>
        <div style="display:flex;gap:8px;font-size:12px;color:var(--mute);border-top:1px dashed var(--line);padding-top:10px">${li('clock', 14)}ยังรอแพทย์ ${md.pending || 0} ราย · หมอไม่ได้สั่ง ${md.none || 0} ราย<span style="margin-left:auto">ตัวหาร ${elig}</span></div></div>
      <div class="kpi"><div class="kh"><span class="ib" style="background:#E3F4FF">${du('mdi', 26)}</span><div><b>สอนยาเทคนิคพิเศษ</b><small>ตามวันที่สอน</small></div><span class="mont" style="margin-left:auto;font-size:24px;font-weight:800">${cn.total}</span><span style="font-size:12px;color:var(--mute)">ครั้ง</span></div><div class="devgrid">${devs}</div></div>
    </div>`;
  if (mon.length) h += `<details><summary>รายเดือน & นิยาม</summary><table class="mon"><tr><th>เดือน</th><th>Admit</th><th>ครอบคลุม</th><th>ใน รพ. ≤8 ชม.</th><th>นอก รพ. ≤24 ชม.</th></tr>${mon.map(m => `<tr><td>${monLab(m.month)}</td><td>${m.total}</td><td title="${m.done}/${m.need}">${pctTxt(m.coveragePct)}</td><td title="${m.inPass}/${m.inN}">${pctTxt(m.in8hPct)}</td><td title="${m.outPass}/${m.outN}">${pctTxt(m.out24hPct)}</td></tr>`).join('')}</table>
    <p style="font-size:12px;color:var(--mute);line-height:1.7">ครอบคลุม = มีรายการ MR / (admit − ไม่พบยาเดิม) · ใน/นอก รพ. = ผ่านเกณฑ์เวลา / กลุ่มนั้น · ไม่ได้ทำ MR / ติดตามไม่ได้ / ไม่ได้ลงเวร = ไม่ทันเวลา · ตัด record ซ้ำ ${r.duplicatesRemoved || 0} แถว</p></details>`;
  $('rpBody').innerHTML = h;

function exportReport() {
  const r = REPORT; if (!r) { toast('รอโหลดรายงานก่อน'); return; }
  if (typeof XLSX === 'undefined') { toast('กำลังโหลดไลบรารี Excel ลองใหม่อีกครั้ง'); return; }
  const s = r.summary, md = r.mdReview || {}, cn = r.counseling || { total: 0, byType: {} };
  const sum = [['รายงาน IPD Pharm Hub — รพ.ห้วยผึ้ง'], ['ช่วง admit', thd(r.from, 'full') + ' – ' + thd(r.to, 'full')], [],
    ['ตัวชี้วัด', 'ตัวตั้ง', 'ตัวหาร', 'อัตรา (%)'],
    ['1. ความครอบคลุมของการทำ MR', s.done, s.need, s.coveragePct],
    ['2. MR ในโรงพยาบาล ภายใน 8 ชม.', s.inPass, s.inN, s.in8hPct],
    ['3. MR นอกโรงพยาบาล ภายใน 24 ชม.', s.outPass, s.outN, s.out24hPct],
    ['แพทย์สั่งยาเดิม ภายใน 1 เวร', md.le1 || 0, md.eligible || 0, md.le1Pct],
    ['แพทย์สั่งยาเดิม ภายในเวรเดียวกัน', md.same || 0, md.eligible || 0, md.samePct],
    ['แพทย์ไม่ได้สั่งยาเดิม (ราย)', md.none || 0], ['ยังรอแพทย์ (ราย)', md.pending || 0], [],
    ['สอนยาเทคนิคพิเศษ (ครั้ง)', cn.total]].concat(Object.keys(cn.byType).map(k => ['  ' + k, cn.byType[k]]));
  const mon = [['เดือน', 'Admit', 'ไม่พบยาเดิม', 'ต้องทำ MR', 'มีรายการ MR', '① %', 'ใน รพ. ผ่าน', 'ใน รพ. ทั้งหมด', '② %', 'นอก รพ. ผ่าน', 'นอก รพ. ทั้งหมด', '③ %']]
    .concat((r.monthly || []).map(m => [monLab(m.month), m.total, m.nomed, m.need, m.done, m.coveragePct, m.inPass, m.inN, m.in8hPct, m.outPass, m.outN, m.out24hPct]));
  const wb = XLSX.utils.book_new();

  const w2 = XLSX.utils.aoa_to_sheet(mon); w2['!cols'] = [{ wch: 10 }].concat(new Array(11).fill({ wch: 12 }));
  XLSX.utils.book_append_sheet(wb, w1, 'สรุป'); XLSX.utils.book_append_sheet(wb, w2, 'รายเดือน');

}


// ── PIN (เหมือน hub เดิม: 8624 · จำใน sessionStorage) ─────
const PIN_CORRECT = '8624';
function pinOk() { try { return sessionStorage.getItem('ipdLitePin') === 'ok'; } catch (e) { return false; } }
function pinRender() { const v = $('pinIn').value; document.querySelectorAll('.pslot').forEach((el, i) => { el.textContent = i < v.length ? '●' : ''; el.classList.toggle('on', i < v.length); }); }
function pinKey(k) { const el = $('pinIn'); el.value = k === 'del' ? el.value.slice(0, -1) : (el.value + k).slice(0, 4); pinInput(); }
function pinInput() {
  const el = $('pinIn'); el.value = el.value.replace(/\D/g, '').slice(0, 4); $('pinErr').textContent = ''; pinRender();
  if (el.value.length === 4) setTimeout(() => {
    if (el.value === PIN_CORRECT) { try { sessionStorage.setItem('ipdLitePin', 'ok'); } catch (e) {} $('pin').classList.add('hide'); start(); }
    else { $('pinErr').textContent = 'รหัสไม่ถูกต้อง'; el.value = ''; pinRender(); const p = $('pslots'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); }
  }, 180);
}

  if (pinOk()) start();
  else {
    $('pin').classList.remove('hide'); $('pinM').innerHTML = mascot(64);
    const box = $('pin').querySelector('.pad'); box.innerHTML = [1,2,3,4,5,6,7,8,9].map(n => `<button onclick="pinKey('${n}')">${n}</button>`).join('') + '<span></span><button onclick="pinKey(\'0\')">0</button><button aria-label="ลบ" onclick="pinKey(\'del\')">⌫</button>';
