<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คลังยา TB · sheisphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B2340; --ink2:#6B6585; --line:#ECE8F7; --card:#FFFFFF; --soft:#F6F4FD;
  --warn:#E8590C; --warn-bg:#FFE4D4; --warn-ink:#A13A06;
  --bad:#D63A5A;  --bad-bg:#FFECEF;  --bad-ink:#B21F3B;
  --exp:#7B4FD0;  --exp-bg:#F1EBFF;  --exp-ink:#5B34A8;
  --ok-bg:#DDF5E7; --ok-ink:#1B6B40;
  --font:'Google Sans','Noto Sans Thai',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(180deg,#EAF1FF 0%,#F4EEFF 55%,#FFF0F4 100%) fixed;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#3B2F8F}
.wrap{max-width:1060px;margin:0 auto;padding:32px 24px 140px;display:flex;flex-direction:column;gap:24px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 6px}
.top .date{font-size:14px;font-weight:700;color:#7A6FD0}
.top h1{margin:4px 0 0;font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.top h1 em{font-style:normal;color:var(--warn)}
.top-links{display:flex;gap:8px}
.chip-btn{height:44px;padding:0 16px;border-radius:99px;border:0;background:rgba(255,255,255,.8);box-shadow:0 1px 3px rgba(43,35,64,.08);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.card{background:var(--card);border-radius:32px;box-shadow:0 10px 30px rgba(59,47,143,.08)}
.shelf{padding:26px 30px 30px}
.shelf-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.shelf-h h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.muted{color:var(--ink2)}
.bottles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:6px;align-items:end;padding-top:12px}
.bottle{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0;border-radius:20px;transition:transform .15s}
.bottle:hover{transform:translateY(-4px)}
.bottle:focus-visible{outline:3px solid #7A6FD0;outline-offset:2px}
.badge-slot{height:30px;display:flex;align-items:flex-end}
.badge{padding:5px 11px;border-radius:99px;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 4px 10px rgba(43,35,64,.18)}
.tag{padding:4px 12px;border-radius:99px;font-size:14px;font-weight:700}
.total{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.plank{display:flex;flex-direction:column;margin-top:-2px}
.plank span:first-child{height:10px;border-radius:10px 10px 0 0;background:#EDE7FF}
.plank span:last-child{height:12px;border-radius:0 0 10px 10px;background:linear-gradient(180deg,#D6CAFA,#C4B5F2);box-shadow:0 10px 18px rgba(91,52,168,.18)}
.dock{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:7px;border-radius:999px;background:rgba(255,255,255,.75);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:.5px solid rgba(255,255,255,.9);box-shadow:0 12px 40px rgba(59,47,143,.18),inset 0 1px 0 rgba(255,255,255,.95);z-index:20}
.dock button{height:54px;padding:0 22px;border-radius:999px;border:0;background:transparent;font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.dock .primary{background:var(--ink);color:#fff;padding:0 26px}
.ov{position:fixed;inset:0;background:rgba(43,35,64,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;padding:0 16px 16px;z-index:30}
.ov.on{display:flex}
.sheet{width:100%;max-width:680px;max-height:calc(100vh - 32px);overflow:auto;background:#F7F5FF;border-radius:34px;box-shadow:0 24px 60px rgba(43,35,64,.3);padding:10px 24px 24px;animation:up .22s ease-out}
.sheet.wide{max-width:920px;background:#fff}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.grab{display:flex;justify-content:center;padding:2px 0 6px}.grab span{width:40px;height:5px;border-radius:99px;background:#DDD8EE}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sh-top h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.x{width:44px;height:44px;border-radius:50%;border:0;background:#ECE8F7;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.lbl{display:block;margin:18px 6px 8px;font-size:13px;font-weight:700;color:var(--ink2)}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:4px}
.mini{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 8px;border-radius:16px}
.mini:focus-visible{outline:3px solid #7A6FD0}
.mini span{font-size:13px;font-weight:700}
.group{background:#fff;border-radius:22px;padding:6px}
.lotbtn{all:unset;box-sizing:border-box;width:100%;display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:16px;cursor:pointer}
.lotbtn:focus-visible{outline:3px solid #7A6FD0}
.lot-row{display:flex;align-items:center;gap:10px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #C7C2DA;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.lot-bar{position:relative;height:6px;border-radius:99px;background:#EFEDF6;overflow:hidden}
.lot-bar i{position:absolute;top:0;bottom:0;border-radius:99px}
.qty-box{background:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.qty-line{display:flex;align-items:center;gap:16px}
.round{width:52px;height:52px;border-radius:50%;border:0;background:#ECE8F7;font-size:26px}
.qty-in{width:200px;border:0;outline:none;background:transparent;font-size:68px;font-weight:700;letter-spacing:-.05em;text-align:center;font-variant-numeric:tabular-nums}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.quick button{height:38px;min-width:58px;padding:0 12px;border-radius:99px;border:0;background:#ECE8F7;font-size:15px;font-weight:600}
.quick button.on{background:var(--ink);color:#fff}
.note{margin:10px 6px 0;font-size:14px;line-height:1.5}
.field{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border-bottom:.5px solid #ECE8F7}
.field:last-child{border-bottom:0}
.field label{width:110px;font-size:15px;color:var(--ink2);flex-shrink:0}
.field input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:17px;font-weight:700;text-align:right}
.field input::placeholder{color:#B9B3CF;font-weight:500}
.save{width:100%;height:58px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:17px;font-weight:700;margin-top:20px}
.save:disabled{opacity:.45;cursor:not-allowed}
.sugs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 6px 0}
.sugs button{height:36px;padding:0 14px;border-radius:99px;border:0;background:#ECE8F7;font-size:14px;font-weight:600}
.info{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.5}
.tl{position:relative;height:230px;margin:30px 34px 6px}
.tl .track{position:absolute;left:0;right:0;top:96px;height:8px;border-radius:99px;background:#EEEAFB}
.tl .tick{position:absolute;top:206px;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.tl .now{position:absolute;left:0;top:89px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--ink);border:5px solid #fff;box-shadow:0 0 0 2px var(--ink)}
.tl .now-l{position:absolute;left:0;top:116px;transform:translateX(-50%);font-size:13px;font-weight:700}
.tl .pin{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.tl .pin b{font-size:13px;white-space:nowrap}
.tl .pin small{font-size:12px;color:var(--ink2);white-space:nowrap}
.first{padding:2px 9px;border-radius:99px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:12px;color:var(--ink2);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.r{text-align:right}
.hist{display:flex;flex-direction:column;gap:8px}
.h-row{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:18px;padding:12px 14px}
.h-row.void{opacity:.45;text-decoration:line-through}
.h-qty{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.mini-btn{height:36px;padding:0 14px;border-radius:99px;border:0;font-size:14px;font-weight:700;background:var(--bad-bg);color:var(--bad-ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 16px;border-bottom:.5px solid #ECE8F7;font-size:16px;font-weight:500;cursor:pointer}
.switch:last-child{border-bottom:0}
.switch input{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:99px;background:#DCD8E8;position:relative;transition:background .15s;cursor:pointer;flex-shrink:0;margin:0}
.switch input::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .15s}
.switch input:checked{background:#5BC489}.switch input:checked::after{left:22px}
.btn2{width:100%;height:56px;border-radius:999px;border:0;background:#fff;font-size:17px;font-weight:600;margin-top:10px;box-shadow:0 1px 3px rgba(43,35,64,.08)}
.toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-80px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-size:15px;font-weight:600;box-shadow:0 10px 30px rgba(43,35,64,.3);transition:transform .25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{transform:translate(-50%,0)}
.loading{padding:60px 0;text-align:center;color:var(--ink2);font-size:16px}
.err{padding:24px;border-radius:20px;background:var(--bad-bg);color:var(--bad-ink);font-size:15px;line-height:1.5}
@media (max-width:640px){
  .wrap{padding:22px 14px 130px}
  .top h1{font-size:26px}
  .shelf{padding:20px 14px 22px}
  .bottles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .bottle svg{width:70px;height:98px}
  .badge-slot{height:auto;min-height:30px}
  .badge{font-size:11px;padding:4px 8px;white-space:normal;text-align:center;line-height:1.25;max-width:84px}
  .dock button{padding:0 14px;height:50px;font-size:15px}
  .dock .primary{padding:0 18px}
  .tl{margin:30px 26px 6px}
  .qty-in{width:150px;font-size:56px}
  .sheet{padding:8px 16px 20px}
}
@media print{.dock,.top-links{display:none}}
</style>
</head>
<body>

<main class="wrap">
  <header class="top">
    <div>
      <div class="date" id="today"></div>
      <h1 id="headline">กำลังโหลด…</h1>
    </div>
    <div class="top-links">
      <button class="chip-btn" type="button" onclick="openHistory()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>ประวัติ
      </button>
      <button class="chip-btn" type="button" onclick="load()" aria-label="โหลดข้อมูลใหม่">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
    </div>
  </header>

  <section class="card shelf" aria-labelledby="shelf-h">
    <div class="shelf-h">
      <h2 id="shelf-h">ชั้นยา TB</h2>
      <span class="muted" style="font-size:14px">แตะขวดเพื่อดู Lot</span>
    </div>
    <div id="shelf"><div class="loading">กำลังโหลดข้อมูลคลัง…</div></div>
  </section>
</main>

<nav class="dock" aria-label="งานหลัก">
  <button class="primary" type="button" onclick="openDispense()">
    <svg width="22" height="14" viewBox="0 0 60 30" aria-hidden="true"><rect x="2" y="2" width="56" height="26" rx="13" fill="#fff"/><path d="M30 2h15a13 13 0 0 1 0 26H30z" fill="#FF8A4C"/></svg>จ่ายออก
  </button>
  <button type="button" onclick="openReceive()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-4 9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/></svg>รับเข้า
  </button>
  <button type="button" onclick="openReport()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>รายงาน
  </button>
</nav>

<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ═══ CONFIG — Supabase edge function เดียวกับ tb-pharm-v3 ═══ */
const API_URL = 'https://qvtlekphxsubuklyirlz.supabase.co/functions/v1/tb-hub';
const API_KEY = 'sb_publishable_dPhW0DORMGlSTc1hzvT4Cw_9ChOlZ0H';

const COLORS = { R:'#FF8A4C', H:'#5BC489', E:'#6AA9FF', Z:'#B48CF2', Lfx:'#F5C04A' };
const TAGS   = { R:['#FFE4D4','#A13A06'], H:['#DDF5E7','#1B6B40'], E:['#E1EEFF','#1D58A8'], Z:['#EEE5FF','#5B34A8'], Lfx:['#FFF1CC','#7A5300'] };
const FALLBACK = ['#F28DB2','#7FD1C7','#C9B37E'];
const EXPIRY_WARN_DAYS = 90;   // ใกล้หมดอายุ
const COVER_WARN_MONTHS = 1;   // พอใช้ < 1 เดือน → เบิกเพิ่ม
const RATE_MONTHS = 3;         // ยอดใช้เฉลี่ยย้อนหลัง
const COUNT_TAG = 'นับสต๊อก';    // source ของรายการปรับยอดจากการนับจริง (ไม่นับเป็นยอดใช้)
const isCount = t => String(t.source||'').startsWith(COUNT_TAG);

const S = { catalog:[], ledger:[], drugs:[], loaded:false, ui:{} };

/* ═══ UTIL ═══ */
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n || 0).toLocaleString('en-US');
const pad = n => String(n).padStart(2, '0');
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
function todayISO(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isoToTH(iso){ if(!iso) return '—'; const p = String(iso).slice(0,10).split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${+p[0]+543}` : iso; }
function parseTH(s){
  const p = String(s||'').trim().split('/'); if (p.length !== 3 || p[2].length < 4) return null;
  let y = parseInt(p[2]), m = parseInt(p[1]), d = parseInt(p[0]); if (y > 2400) y -= 543;
  const dt = new Date(y, m-1, d); if (isNaN(dt) || dt.getDate() !== d || dt.getMonth() !== m-1) return null;
  return `${y}-${pad(m)}-${pad(d)}`;
}
function daysUntil(iso){ return Math.round((new Date(iso+'T00:00:00') - new Date(todayISO()+'T00:00:00')) / 86400000); }
function monthsUntil(iso){ return daysUntil(iso) / 30.44; }
function seq(t){ const m = String(t?.ledger_id||'').match(/(\d+)/); return m ? parseInt(m[1]) : 0; }
function isActive(d){ return d.active === true || d.active === 'TRUE' || d.active === 'true'; }
function toast(msg, ms=2600){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'), ms); }

async function api(action, data={}){
  const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'application/json','apikey':API_KEY,'Authorization':'Bearer '+API_KEY}, body:JSON.stringify({action, data}) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  return json.data;
}

/* ═══ CORE: VOID linkage + lot snapshot (ยกมาจาก v3 ที่แก้แล้ว) ═══ */
function getVoidedIds(ledger){
  const voided = new Set();
  const rows = [...ledger].sort((a,b) => (a.txn_date||'').localeCompare(b.txn_date||'') || seq(a)-seq(b));
  const typeTH = { 'รับเข้า':'IN', 'จ่ายออก':'OUT', 'ตั้งยอด':'ADJUST' };
  rows.forEach((v, idx) => {
    if ((v.txn_type||'').toUpperCase() !== 'VOID') return;
    const link = String(v.notes||'').match(/VOID_OF:\s*([A-Za-z]*\d+)/);
    if (link) { voided.add(link[1]); return; }
    const m = String(v.source||'').match(/ยกเลิก\s+(รับเข้า|จ่ายออก|ตั้งยอด)\s+([\d.]+)/);
    if (!m) return;
    for (let i = idx-1; i >= 0; i--) {
      const o = rows[i];
      if (voided.has(o.ledger_id) || o.drug_id !== v.drug_id) continue;
      if ((o.txn_type||'').toUpperCase() !== typeTH[m[1]]) continue;
      if ((o.lot_no||'') !== (v.lot_no||'')) continue;
      if (Math.abs(parseFloat(o.qty)||0) !== parseFloat(m[2])) continue;
      voided.add(o.ledger_id); break;
    }
  });
  return voided;
}

function computeDrugs(catalog, ledger){
  const voided = getVoidedIds(ledger);
  const rows = [...ledger]
    .filter(t => !voided.has(t.ledger_id) && (t.txn_type||'').toUpperCase() !== 'VOID')
    .sort((a,b) => (a.txn_date||'').localeCompare(b.txn_date||'') || seq(a)-seq(b));
  const lotsBy = {};
  rows.forEach(t => {
    const lots = lotsBy[t.drug_id] ||= {};
    const type = (t.txn_type||'').toUpperCase();
    const q = Math.abs(parseFloat(t.qty)||0);
    const lot = t.lot_no || '', exp = (t.exp_date||'').slice(0,10);
    if (type === 'IN') {
      const k = lot + '|' + exp;
      (lots[k] ||= { lot, exp, qty:0 }).qty += q;
    } else if (type === 'OUT') {
      let rem = q;
      if (lot) {
        const exact = lots[lot + '|' + exp];
        const target = (exact && exact.qty > 0) ? exact : Object.values(lots).find(v => v.lot === lot && v.qty > 0);
        if (target) { const take = Math.min(target.qty, rem); target.qty -= take; rem -= take; }
      }
      const fefo = Object.values(lots).filter(v => v.qty > 0).sort((a,b) => !a.exp ? 1 : !b.exp ? -1 : a.exp.localeCompare(b.exp));
      for (const v of fefo) { if (rem <= 0) break; const take = Math.min(v.qty, rem); v.qty -= take; rem -= take; }
    } else if (type === 'ADJUST') {
      for (const k in lots) delete lots[k];
      lots[(lot||'ตั้งยอด') + '|' + exp] = { lot: lot || 'ตั้งยอด', exp, qty:q };
    }
  });

  const cut = new Date(); cut.setMonth(cut.getMonth() - RATE_MONTHS);
  const cutISO = `${cut.getFullYear()}-${pad(cut.getMonth()+1)}-${pad(cut.getDate())}`;
  let fb = 0;

  return catalog.filter(isActive).map(c => {
    const lots = Object.values(lotsBy[c.drug_id] || {}).filter(l => l.qty > 0)
      .sort((a,b) => !a.exp ? 1 : !b.exp ? -1 : a.exp.localeCompare(b.exp));
    const total = lots.reduce((s,l) => s + l.qty, 0);
    const used = rows.filter(t => t.drug_id === c.drug_id && (t.txn_type||'').toUpperCase() === 'OUT' && !isCount(t) && (t.txn_date||'') >= cutISO)
      .reduce((s,t) => s + Math.abs(parseFloat(t.qty)||0), 0);
    const avg = used / RATE_MONTHS;
    const cover = avg > 0 ? total / avg : null;
    const min = parseFloat(c.min_stock) || 0, max = parseFloat(c.max_stock) || 0;
    const color = COLORS[c.abbr] || FALLBACK[fb++ % FALLBACK.length];
    const lastCount = rows.filter(t => t.drug_id === c.drug_id && isCount(t)).reduce((m,t) => (t.txn_date||'') > m ? t.txn_date : m, '');

    const alerts = [];
    const expired = lots.filter(l => l.exp && daysUntil(l.exp) < 0);
    const soon = lots.filter(l => l.exp && daysUntil(l.exp) >= 0 && daysUntil(l.exp) <= EXPIRY_WARN_DAYS);
    if (total <= 0) alerts.push({ k:'out', t:'หมดคลัง', c:'var(--bad)' });
    else if (min && total < min) alerts.push({ k:'low', t:'ต่ำกว่า min', c:'var(--bad)' });
    if (expired.length) alerts.push({ k:'expd', t:'มี Lot หมดอายุ', c:'var(--bad)' });
    if (total > 0 && cover !== null && cover < COVER_WARN_MONTHS) alerts.push({ k:'cover', t:'เบิกเพิ่ม', c:'var(--warn)' });
    if (soon.length) alerts.push({ k:'soon', t:'ใกล้หมดอายุ', c:'var(--exp)' });

    return { id:c.drug_id, name:c.name, abbr:c.abbr, strength:c.strength_mg, unit:c.unit||'เม็ด', min, max,
      color, tag: TAGS[c.abbr] || ['#F1EEFA','#4A4366'], lots, total, avg, cover, alerts, expired, soon, lastCount };
  });
}

/* ═══ LOAD ═══ */
async function load(){
  $('shelf').innerHTML = '<div class="loading">กำลังโหลดข้อมูลคลัง…</div>';
  try {
    const [catalog, ledger] = await Promise.all([ api('getDrugCatalog', {}), api('getStockLedger', {}) ]);
    S.catalog = catalog || []; S.ledger = ledger || []; S.loaded = true;

}

  const withExp = d.lots.filter(l => l.exp);

  const maxQ = Math.max(1, ...d.lots.map(l => l.qty));
  const now = new Date(); const ticks = [];
  for (let y = now.getFullYear()+1; ; y++) { const m = (new Date(y,0,1) - now) / 86400000 / 30.44; if (m > span) break; ticks.push({ l: m/span*100, t: 'ม.ค. ' + (y+543) }); }
  const pins = withExp.map((l,i) => {

  }).join('');
  const coverTone = d.cover !== null && d.cover < COVER_WARN_MONTHS ? ['var(--warn-bg)','var(--warn-ink)'] : d.cover !== null ? ['var(--ok-bg)','var(--ok-ink)'] : ['#F1EEFA','var(--ink2)'];

    ${withExp.length ? `<div class="tl" role="img" aria-label="เส้นเวลาวันหมดอายุของแต่ละ Lot">

      : '<div class="loading" style="padding:30px 0">ยังไม่มี Lot คงเหลือ — บันทึก "รับเข้า" เพื่อเพิ่ม</div>'}

/* ── จ่ายออก ── */
function openDispense(id){
  if (needData()) return;
  const first = id || (S.drugs.find(d => d.total > 0) || S.drugs[0])?.id;
  S.ui = { mode:'out', drug:first, lot:0, qty:0, note:'' };
  renderDispense();
}
function planOut(d, lotIdx, q){
  // ตัดจาก Lot ที่เลือกก่อน ส่วนที่เกินตัดตาม FEFO
  const plan = []; let rem = q;
  const order = [lotIdx, ...d.lots.map((_,i) => i).filter(i => i !== lotIdx)];
  for (const i of order) { const l = d.lots[i]; if (!l || rem <= 0) continue; const take = Math.min(l.qty, rem); if (take > 0) { plan.push({ ...l, take }); rem -= take; } }
  return { plan, short: rem };
}
function renderDispense(){
  const u = S.ui, d = S.drugs.find(x => x.id === u.drug);
  const q = Math.max(0, parseInt(u.qty) || 0);
  const { plan, short } = d ? planOut(d, u.lot, q) : { plan:[], short:q };
  const takeOf = i => (plan.find(p => p.lot === d.lots[i].lot && p.exp === d.lots[i].exp) || {}).take || 0;
  let msg = '', tone = 'var(--ink2)';
  if (!d || !d.lots.length) msg = 'ยานี้ไม่มีของในคลัง';
  else if (!q) msg = 'ใส่จำนวนที่จ่าย';
  else if (short > 0) { msg = `ในคลังมีแค่ ${fmt(d.total)} — ขาดอีก ${fmt(short)} เม็ด บันทึกไม่ได้`; tone = 'var(--bad-ink)'; }
  else if (plan.length > 1) { msg = 'Lot ที่เลือกไม่พอ — จะบันทึกแยก ' + plan.map(p => `${p.lot} ${fmt(p.take)}`).join(' + '); tone = 'var(--warn-ink)'; }
  else msg = `หลังจ่าย Lot ${plan[0].lot} จะเหลือ ${fmt(plan[0].qty - plan[0].take)}`;
  const ok = d && q > 0 && short === 0 && !u.saving;
  openSheet(`
    <div class="sh-top"><h2>จ่ายออก</h2>${xBtn}</div>
    <div class="minis" role="radiogroup" aria-label="ยา">${S.drugs.map(x => { const on = x.id === u.drug; return `<button class="mini" type="button" role="radio" aria-checked="${on}" style="background:${on?x.tag[0]:'transparent'}" onclick="S.ui.drug='${esc(x.id)}';S.ui.lot=0;renderDispense()">${miniSVG(x.color)}<span style="color:${on?x.tag[1]:'var(--ink)'}">${esc(x.abbr)} ${esc(x.strength)}</span></button>`; }).join('')}</div>
    <div class="qty-box" style="margin-top:14px">
      <span style="font-size:14px;font-weight:700;color:${d?d.tag[1]:'inherit'}">${d ? esc(d.name+' '+d.strength+' mg') : ''}</span>
      <div class="qty-line">
        <button class="round" type="button" aria-label="ลด 10" onclick="S.ui.qty=Math.max(0,(parseInt(S.ui.qty)||0)-10);renderDispense()">−</button>
        <input class="qty-in" id="qty" type="number" inputmode="numeric" min="0" value="${q || ''}" placeholder="0" aria-label="จำนวน" autofocus oninput="S.ui.qty=this.value;updateDispenseMsg()" onchange="renderDispense()">
        <button class="round" type="button" aria-label="เพิ่ม 10" onclick="S.ui.qty=(parseInt(S.ui.qty)||0)+10;renderDispense()">+</button>
      </div>
      <span class="muted" style="font-size:14px">${d ? esc(d.unit) : ''}</span>
      <div class="quick">${[30,60,90,100].map(n => `<button type="button" class="${n===q?'on':''}" onclick="S.ui.qty=${n};renderDispense()">${n}</button>`).join('')}</div>
    </div>
    <span class="lbl">ตัดจาก Lot (เลือก Lot ที่หมดก่อนไว้ให้แล้ว)</span>
    <div class="group">${d && d.lots.length ? d.lots.map((l,i) => { const on = i === u.lot, take = takeOf(i);
      return `<button class="lotbtn" type="button" aria-pressed="${on}" style="background:${on?d.tag[0]:'transparent'}" onclick="S.ui.lot=${i};renderDispense()">
        <span class="lot-row"><span class="radio" style="${on?`border-color:${d.tag[1]};background:${d.tag[1]}`:''}">${on?'<svg width="10" height="8" viewBox="0 0 10 8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4l3 3 5-6"/></svg>':''}</span>
        <span style="flex:1;display:flex;flex-direction:column;line-height:1.3"><b style="font-size:15px">${esc(l.lot||'ไม่ระบุ Lot')}</b><span class="muted" style="font-size:12px">หมด ${isoToTH(l.exp)}${i===0?' · หมดก่อน':''}${l.exp&&daysUntil(l.exp)<0?' · หมดอายุแล้ว':''}</span></span>
        <b style="font-variant-numeric:tabular-nums">${take ? fmt(l.qty)+' → '+fmt(l.qty-take) : fmt(l.qty)}</b></span>
        <span class="lot-bar" aria-hidden="true"><i style="left:0;width:${(l.qty-take)/l.qty*100}%;background:${d.color}"></i><i style="left:${(l.qty-take)/l.qty*100}%;width:${take/l.qty*100}%;background:${d.color};opacity:.28"></i></span>
      </button>`; }).join('') : '<div style="padding:14px" class="muted">ไม่มี Lot คงเหลือ</div>'}</div>
    <p class="note" id="out-msg" style="color:${tone}">${esc(msg)}</p>
    <span class="lbl">หมายเหตุ</span>
    <div class="group" style="padding:0"><div class="field"><label for="out-note">ไม่บังคับ</label><input id="out-note" type="text" placeholder="เช่น HN" value="${esc(u.note)}" oninput="S.ui.note=this.value"></div></div>
    <button class="save" id="out-save" type="button" ${ok?'':'disabled'} onclick="saveDispense()">${u.saving ? 'กำลังบันทึก…' : 'บันทึกจ่ายออก' + (q ? ' · ' + fmt(q) : '')}</button>`);
  const inp = $('qty'); if (inp && document.activeElement !== inp && u.focusQty) { inp.focus(); }
}
function updateDispenseMsg(){
  // พิมพ์ตัวเลข → re-render ตอน change; ระหว่างพิมพ์แค่เปิด/ปิดปุ่ม
  const u = S.ui, d = S.drugs.find(x => x.id === u.drug), q = parseInt(u.qty) || 0;
  const btn = $('out-save'); if (!btn || !d) return;
  const { short } = planOut(d, u.lot, q);
  btn.disabled = !(q > 0 && short === 0);
  btn.textContent = 'บันทึกจ่ายออก' + (q ? ' · ' + fmt(q) : '');
}
async function saveDispense(){
  const u = S.ui, d = S.drugs.find(x => x.id === u.drug), q = parseInt(u.qty) || 0;
  if (!d || q <= 0) return;
  const { plan, short } = planOut(d, u.lot, q);
  if (short > 0) { toast('จำนวนเกินของในคลัง'); return; }
  u.saving = true; renderDispense();
  const saved = [];
  try {
    for (const p of plan) {
      const row = { drug_id:d.id, txn_type:'OUT', qty:-p.take, lot_no:p.lot, exp_date:p.exp||null, source:u.note||'', txn_date:todayISO() };
      const res = await api('saveStockTxn', row);
      S.ledger.push({ ...row, ledger_id: res?.saved || ('tmp' + Date.now()) });
      saved.push(p);
    }
    closeSheet(); refresh();
    toast(`✓ จ่ายออก ${d.abbr} ${d.strength} · ${fmt(q)} ${d.unit}`);
  } catch (e) {
    u.saving = false; refresh(); renderDispense();
    toast('บันทึกไม่สำเร็จ' + (saved.length ? ` (บันทึกไปแล้ว ${saved.length}/${plan.length} Lot)` : '') + ': ' + (e.message||e), 6000);
  }
}

/* ── รับเข้า ── */
function openReceive(id){
  if (needData()) return;
  S.ui = { mode:'in', drug: id || S.drugs[0]?.id, lot:'', exp:'', qty:'', src:'' };
  renderReceive();
}
function knownLot(d, lot){ return lot ? d?.lots.find(l => l.lot.toLowerCase() === lot.trim().toLowerCase()) : null; }
function recentSources(){
  const seen = new Map();
  [...S.ledger].filter(t => (t.txn_type||'').toUpperCase() === 'IN' && t.source).sort((a,b) => seq(b)-seq(a))
    .forEach(t => { const s = String(t.source).trim(); if (s && !seen.has(s)) seen.set(s, 1); });
  return [...seen.keys()].slice(0, 4);
}
function onLotInput(v){
  S.ui.lot = v;
  const d = S.drugs.find(x => x.id === S.ui.drug), k = knownLot(d, v);
  if (k && k.exp) { S.ui.exp = isoToTH(k.exp); $('in-exp').value = S.ui.exp; }
  renderReceiveInfo();
}
function autoSlash(el){
  let v = el.value.replace(/[^\d]/g, '').slice(0, 8);
  if (v.length > 4) v = v.slice(0,2) + '/' + v.slice(2,4) + '/' + v.slice(4);
  else if (v.length > 2) v = v.slice(0,2) + '/' + v.slice(2);
  el.value = v; S.ui.exp = v; renderReceiveInfo();
}
function renderReceiveInfo(){
  const u = S.ui, d = S.drugs.find(x => x.id === u.drug), k = knownLot(d, u.lot), q = parseInt(u.qty) || 0;
  const iso = parseTH(u.exp);

function countPlan(){
  const u = S.ui, d = S.drugs.find(x => x.id === u.drug); const plan = []; let bad = '';
  d.lots.forEach((l,i) => { const v = u.counts[i]; if (v === '' || isNaN(+v) || +v < 0) { bad = 'ใส่จำนวนที่นับได้ให้ครบทุก Lot'; return; } const diff = Math.round(+v) - l.qty; if (diff) plan.push({ lot:l.lot, exp:l.exp, diff, from:l.qty, to:Math.round(+v) }); });
  u.extra.forEach(x => { if (!x.lot && !x.exp && !x.qty) return; const iso = parseTH(x.exp), q = parseInt(x.qty) || 0;
    if (!x.lot.trim() || !iso || q <= 0) { bad = bad || 'Lot ที่เพิ่ม ต้องมีเลข Lot วันหมดอายุ และจำนวน'; return; }
    plan.push({ lot:x.lot.trim(), exp:iso, diff:q, from:0, to:q, isNew:true }); });
  return { d, plan, bad };
}

<div class="bar"><button onclick="(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>print())">พิมพ์ / บันทึก PDF</button></div>
<div class="a4"><div class="hd"><div><h1>ยอดคงคลังยาวัณโรค</h1><div class="s">คลินิกวัณโรค · กลุ่มงานเภสัชกรรม · รพ.ห้วยผึ้ง</div></div><div class="r">ข้อมูล ณ วันที่<b>${dateTH}</b>เวลา ${time} น.</div></div>
${verdict}<table><thead><tr><th>#</th><th>รายการยา</th><th class="n">คงเหลือ</th><th class="n">Min</th>${o.cover?'<th class="n">พอใช้</th>':''}${o.lot?'<th>Lot ที่หมดก่อน</th>':''}<th>สถานะ</th></tr></thead><tbody>
${rows.map((d,i) => `<tr class="${d.alerts.length?'alert':''}"><td class="no">${i+1}</td><td><b>${esc(d.name)} ${esc(d.strength)} mg</b></td><td class="n q">${fmt(d.total)}</td><td class="n">${fmt(d.min)}</td>${o.cover?`<td class="n">${coverShort(d)}</td>`:''}${o.lot?`<td>${d.lots[0]?esc(d.lots[0].lot)+' · '+isoToTH(d.lots[0].exp):'—'}</td>`:''}<td class="st">${esc(statusOf(d))}</td></tr>`).join('')}
</tbody></table><div class="note">ยอดจากบัญชีรับ–จ่ายในระบบ ณ เวลาที่พิมพ์${o.cover?' · พอใช้ = คงเหลือ ÷ ยอดจ่ายเฉลี่ย 3 เดือน':''}</div>
${o.sign?'<div class="sg"><div>ลงชื่อ ........................................<br>(........................................)<br>เภสัชกรผู้จัดทำ</div><div>ลงชื่อ ........................................<br>(........................................)<br>หัวหน้ากลุ่มงานเภสัชกรรมฯ</div></div>':''}
</div></body></html>`;
  const w = window.open('', 'tbStockReport');
  if (!w) { toast('เบราว์เซอร์บล็อก popup — อนุญาต popup ก่อน', 5000); return; }
  w.document.open(); w.document.write(html); w.document.close();
}
function loadXLSX(){ return window.XLSX ? Promise.resolve() : new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function exportExcel(){
  try { toast('กำลังเตรียมไฟล์…'); await loadXLSX(); } catch { toast('โหลดตัวสร้าง Excel ไม่ได้', 5000); return; }
  const rows = reportRows(), X = window.XLSX, wb = X.utils.book_new();
  const s1 = [['รายการยา','คงเหลือ','หน่วย','Min','ใช้เฉลี่ย/เดือน','พอใช้ (เดือน)','สถานะ']]
    .concat(rows.map(d => [`${d.name} ${d.strength} mg`, d.total, d.unit, d.min, Math.round(d.avg), d.cover===null?'':+d.cover.toFixed(1), statusOf(d)]));
  const s2 = [['รายการยา','Lot','หมดอายุ (พ.ศ.)','เหลืออีก (วัน)','คงเหลือ']];
  rows.forEach(d => d.lots.forEach(l => s2.push([`${d.name} ${d.strength} mg`, l.lot, isoToTH(l.exp), l.exp?daysUntil(l.exp):'', l.qty])));
  const w1 = X.utils.aoa_to_sheet(s1); w1['!cols'] = [{wch:26},{wch:10},{wch:8},{wch:8},{wch:14},{wch:12},{wch:28}];
  const w2 = X.utils.aoa_to_sheet(s2); w2['!cols'] = [{wch:26},{wch:12},{wch:14},{wch:12},{wch:10}];
  X.utils.book_append_sheet(wb, w1, 'ยอดคงคลัง'); X.utils.book_append_sheet(wb, w2, 'Lot');
  const d = new Date(); X.writeFile(wb, `คลังยาTB_${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()+543}.xlsx`);
}

load();
</script>
</body>
