<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dose Check · รพ.ห้วยผึ้ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
<style>
:root{--bg:#F7F5F0;--card:#fff;--line:#ECE8DF;--field:#D6CFC2;--ink:#1C1C1E;--mute:#77756F;--soft:#4A4843;--sel:#DCE7FD;--selInk:#1D4E89;--blue:#2F6FED;--purple:#8E5CF0;--red:#E5484D;--amber:#F5A524;--green:#1F9D55;--num:Montserrat,'Google Sans',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Google Sans','IBM Plex Sans Thai',sans-serif;font-size:15px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1320px;margin:0 auto;padding:18px 24px 40px;display:flex;flex-direction:column;gap:18px}
header.top{background:#fff;border-radius:22px;box-shadow:0 4px 0 #E8E3D8;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.logo{font-family:var(--num);font-weight:700;font-size:18px;min-width:140px}
.logo small{display:block;font-family:'Google Sans','IBM Plex Sans Thai',sans-serif;font-weight:400;font-size:12px;color:var(--mute)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;flex:1}
nav.tabs button{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:14px;border:0;background:transparent;color:var(--soft);font-size:15px}
nav.tabs button.on{background:var(--sel);color:var(--selInk);font-weight:700}
.ic{width:28px;height:28px;flex-shrink:0}
.cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.card{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:18px}
.ttl{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;margin-bottom:12px}
.step{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.pt{flex:1 1 270px;max-width:310px}
.list{flex:1 1 300px;max-width:370px}
.res{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--bg);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px}
.tile .lab{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.tile .lab img{width:20px;height:20px}
.field{display:flex;align-items:center;gap:6px;height:46px;padding:0 12px;background:#fff;border:1.5px solid var(--field);border-radius:12px;box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
.field input{width:100%;min-width:0;text-align:center;border:0;outline:0;background:transparent;padding:0;font-family:Montserrat,'Google Sans',sans-serif;font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--ink)}
.field input::placeholder{color:#C9C3B6;font-weight:600}
.field span{font-size:14px;color:var(--mute);white-space:nowrap}
.field:focus-within{border-color:var(--blue)}
.seg{display:flex;gap:4px;height:46px;background:#fff;border:1.5px solid var(--field);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;border-radius:8px;background:transparent;color:var(--soft);font-size:14px}
.seg button.on{background:var(--sel);color:var(--selInk);font-weight:700}
.wide{grid-column:1/-1}
.status{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 2px 0}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.unfitbar{margin:14px 20px 0;padding:12px 14px;border-radius:14px;border:2px solid #E9A21B;background:#FFF4DC;display:flex;align-items:center;gap:12px}
.unfitbar.big{border-color:#D63B3B;background:#FDE8E8}
.unfitbar img{width:30px;height:30px;flex:none}
.unfitbar>div{flex:1;display:flex;flex-direction:column;gap:2px}
.unfitbar b{font-size:16px;color:#9A5B00}.unfitbar.big b{color:#B42323}
.unfitbar span{font-size:13px;color:var(--soft)}
.unfitbar button{flex:none;border:0;border-radius:12px;padding:8px 14px;background:var(--blue);color:#fff;font-weight:700;font-size:14px;box-shadow:0 3px 0 #1F55C4;cursor:pointer}
.answer.unfit .big,.answer.unfit .sub1{opacity:.35;text-decoration:line-through;text-decoration-thickness:2px}
.warnbox{background:#FFF8E6;border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;font-size:14px;color:#6B4600}
.warnbox img{width:22px;height:22px;flex-shrink:0}
.dangerbox{background:#FFE9E9;border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;font-size:14px;color:#7A1414}
.dangerbox img{width:22px;height:22px;flex-shrink:0}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;background:var(--bg);border-radius:14px;margin-bottom:10px}
.search img{width:22px;height:22px}
.search input{border:0;outline:0;background:transparent;font-size:15px;flex:1}
.chips{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:10px}
.chips button{flex:1;height:34px;border:0;border-radius:10px;background:transparent;color:var(--soft);font-size:13px;white-space:nowrap;padding:0 6px}
.chips button.on{background:var(--sel);color:var(--selInk);font-weight:700}
.drug{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:4px 10px;border-radius:14px;border:2px solid transparent;background:transparent;text-align:left}
.drug:hover{background:var(--bg)}
.drug.on{background:#EEF3FE}
.drug .cb{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid #C9C3B6;background:#fff;display:grid;place-items:center}
.drug.on .cb{background:var(--blue);border-color:var(--blue)}
.drug .cb svg{width:14px;height:14px;opacity:0}
.drug.on .cb svg{opacity:1}
.drug .nm{flex:1;font-weight:700}
.agepair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selbar{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:13px;color:var(--mute)}
.selbar b{color:var(--ink)}
.selbar button{margin-left:auto;border:0;background:none;color:var(--mute);text-decoration:underline;font-size:13px}
.band .x{margin-left:auto;flex:none;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.band .x:hover{background:rgba(255,255,255,.4)}
.ditem{display:flex;flex-direction:column;gap:12px}
.ordin{border-top:1.5px dashed #E6E0D4;margin:4px 20px 0;padding:14px 0 16px}
.badge{white-space:nowrap;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#F1EEE6;color:var(--soft)}
.badge.liq{background:#E5F1FF;color:#1D4E89}
.badge.had{background:#FFE9E9;color:#9B1C1C}
.rcard{background:#fff;border:1.5px solid var(--line);border-radius:24px;overflow:hidden}
.band{color:#fff;padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.band .step{background:#fff}
.band .t{font-size:17px;font-weight:700;flex:1}
.band .s{font-size:13px}
.pad{padding:16px 20px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--bg);color:var(--soft);font-size:14px}
.pills button.on{background:var(--sel);color:var(--selInk);font-weight:700}
.sublab{font-size:13px;color:var(--mute);margin-bottom:8px}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.forms button{position:relative;display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:14px;text-align:left}
.forms button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.forms button.on{background:#EEF3FE;border:2px solid var(--blue);font-weight:700}
.forms .rec{position:absolute;top:-10px;right:10px;background:var(--blue);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
.answer{display:flex;align-items:center;gap:18px;padding:20px}
.answer>img{width:68px;height:68px;flex-shrink:0}
.big{font-family:var(--num);font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.big small{font-size:20px;font-family:'Google Sans','IBM Plex Sans Thai',sans-serif;font-weight:700;letter-spacing:0}
.sub1{font-size:15px;font-weight:700;color:var(--selInk);margin-top:2px}
.sub2{font-size:16px;margin-top:8px}
.minor{font-size:13px;color:var(--mute);margin-top:4px}
.box{margin:0 20px 16px;background:var(--bg);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.box img{width:30px;height:30px}
.box .k{font-size:14px;color:var(--mute)}
.box .v{font-family:var(--num);font-size:26px;font-weight:800}
.box .calc{font-size:13px;color:var(--mute);flex:1 1 200px}
.mini{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;background:#fff;border:1.5px solid var(--field);border-radius:10px}
.mini input{width:40px;border:0;outline:0;background:transparent;font-size:17px;font-weight:700;text-align:center}
.order{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.order img{width:28px;height:28px}
.order .field{height:44px;width:120px}
.order .field input{font-size:20px;text-align:center}
.verdict{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px 18px;border-radius:16px;border:2px solid;font-size:14px;color:var(--ink)}
.verdict img{width:40px;height:40px;flex:none}
.verdict .vw{font-size:22px;font-weight:800;line-height:1.2}
.verdict>div{flex:1;min-width:0}
.vstats{display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;gap:8px 20px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);font-size:16px;font-variant-numeric:tabular-nums}
.vstats .k{font-size:13px;color:var(--mute)}
.vstats .v{color:var(--soft);white-space:nowrap}
.vstats .v b{font-weight:700;color:var(--ink);margin-right:2px}
.vstats .kg{grid-column:1/-1;font-size:13px;color:var(--mute);padding-top:2px}
.vstats .kg b{color:var(--soft);font-weight:700}
.verdict{align-items:flex-start}
.verdict.ok{background:#E7F7EC;border-color:#2FA35A}.verdict.ok .vw{color:#1D7A40}
.verdict.warn{background:#FFF4DC;border-color:#E9A21B}.verdict.warn .vw{color:#9A5B00}
.verdict.bad{background:#FDE8E8;border-color:#D63B3B}.verdict.bad .vw{color:#B42323}
.empty{color:var(--mute);text-align:center;padding:40px 10px;font-size:15px}
.empty img{width:56px;height:56px;display:block;margin:0 auto 10px;opacity:.9}
.foot{font-size:12px;color:#9A978F;text-align:center}
.footrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.signoff{display:flex;align-items:center;justify-content:center;gap:18px;margin:28px 0 8px}
.signoff .ln{height:1px;width:80px;background:linear-gradient(90deg,transparent,#D6CFC2)}
.signoff .ln:last-child{background:linear-gradient(90deg,#D6CFC2,transparent)}
.sigbox{position:relative;display:block;flex:none;padding-bottom:4px}
.est{position:absolute;right:2px;top:62%;font-family:Montserrat,'Google Sans',sans-serif;font-size:7.5px;font-weight:600;letter-spacing:.32em;color:#3A3833;white-space:nowrap}

/* renal */
.rtop{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.rtop>img{width:52px;height:52px}
.bands{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.bands span{padding:8px 12px;border-radius:12px;font-size:14px;color:var(--mute);background:var(--bg)}
.bands span.on{background:var(--amber);color:#fff;font-weight:700}
.sec{background:#fff;border:1.5px solid var(--line);border-radius:24px;overflow:hidden;flex:1 1 360px;min-width:0}
.sec .hd{color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.sec .hd .n{margin-left:auto}
.sec .bd{padding:14px;display:flex;flex-direction:column;gap:8px}
.rbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rtbl{width:100%;border-collapse:collapse;font-size:15px}
.rtbl th{text-align:left;font-size:12px;font-weight:500;color:var(--mute);padding:10px 16px 6px}
.rtbl td{padding:9px 14px;border-top:1px solid var(--line);vertical-align:top}
.rtbl.rlist td:first-child{width:38%}
.rtbl.rlist{table-layout:fixed}
.rgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:18px;align-items:start}
.rside{display:flex;flex-direction:column;gap:14px}
.okl{display:flex;flex-wrap:wrap;gap:6px}.okl span{font-size:13px;background:var(--bg);border-radius:8px;padding:3px 9px;color:var(--soft)}
@media (max-width:900px){.rgrid{grid-template-columns:1fr}}
.rtbl tr.sub td{border-top:0;padding-top:0}
.cell{display:inline-block;padding:4px 9px;border-radius:9px}
.cell .v{font-size:15px;color:var(--mute);white-space:nowrap}
.cell.chg{background:#FFE9B0}
.cell.chg .v{color:var(--ink);font-weight:600}
.cell .was{font-size:11.5px;color:#9A7A3A;margin-top:1px;white-space:nowrap}
.cell.same .v{color:var(--mute)}
.cell.bad{background:#FDE0E0}.cell.bad .v{color:#B42323;font-weight:700}
.cond{font-size:12.5px;color:var(--soft);padding:0 9px}
.stbl .pv{font-size:15px;color:var(--soft)}
.stbl .pv.ch{color:var(--ink)}
.stbl .pv.bad{color:#B42323;font-weight:700}
.stbl .nl{font-size:11px;color:var(--mute)}
.stbl tr.pt td{background:#EAF1FE}
.stbl tr.pt td:first-child{box-shadow:inset 4px 0 0 var(--blue)}
.stbl tr.pt .pv{font-weight:700;color:var(--ink);font-size:16px}
.stbl tr.pt + tr.sub td{background:#EAF1FE}
.rtbl.stbl .now{color:#fff;background:var(--blue)}
.legend{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:0 4px 10px}
.okall{display:flex;align-items:center;gap:14px;background:#E7F7EC;border:2px solid #2FA35A}.okall img{width:40px;height:40px}.okall b{font-size:18px;color:#1D7A40}
.legend .sw{width:16px;height:16px;border-radius:5px;background:#FFE9B0}
.rtbl .rn{font-weight:700;font-size:15px}
.rtbl .rr{font-size:12px;color:var(--mute);margin-top:1px}
.rtbl tr.on td{background:#FFF4DC}
.rtbl .now{font-size:11px;font-weight:700;color:#9A5B00;background:#FFE3A3;border-radius:6px;padding:1px 6px;margin-left:4px}
.rsearch{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
.rdrug{padding:16px 6px 6px}
.rdrug .rname{display:flex;align-items:center;gap:10px;padding:0 10px 4px;flex-wrap:wrap}
.rdrug .rname img{width:28px;height:28px}
.rdrug .rname b{font-size:18px}
.hdic{width:30px;height:30px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center}
.hdic img{width:22px;height:22px}
/* HAD */
.hadside{flex:1 1 220px;max-width:250px;background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:10px;display:flex;flex-direction:column;gap:4px}
.hadside button{display:flex;align-items:center;gap:10px;height:52px;padding:0 8px;border-radius:14px;border:0;background:transparent;text-align:left;font-size:15px}
.hadside button.on{background:var(--bg);font-weight:700}
.hadside img{width:40px;height:40px;object-fit:cover;border-radius:12px;background:var(--bg)}
.hadmain{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:14px}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero>img{width:140px;height:140px;object-fit:cover;border-radius:22px;background:var(--bg)}
.hero h2{margin:6px 0 4px;font-size:30px;letter-spacing:-.5px}
.subtabs{display:flex;gap:4px;background:#ECE8DF;border-radius:16px;padding:4px}
.subtabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--mute);font-size:15px}
.subtabs button img{width:22px;height:22px}
.subtabs button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stp{background:var(--bg);border-radius:16px;padding:14px;display:flex;gap:10px;align-items:flex-start}
.stp .n{width:28px;height:28px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.stp .sx{font-size:13px;color:var(--mute);margin-top:2px}
.lst{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.li img{width:22px;height:22px;flex-shrink:0;margin-top:1px}
.li .sx{font-size:13px;color:var(--mute)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--mute);font-weight:500}
.urgent{background:#FDE8E8;color:#B4232A}
.prewrap{white-space:pre-line;font-size:15px;line-height:1.6}
@media (max-width:760px){.wrap{padding:12px}.pt,.list,.hadside{max-width:none}.big{font-size:36px}}
</style>

<script>
/* ================= helpers ================= */
const $ = s => document.querySelector(s);

/* ================= state ================= */
const S = {
  tab: load('tab', 'oral'),
  pt: { y: '', m: '', sex: 'M', wt: '', ht: '', g6pd: 'normal' },
  oral: { g: 'abx', q: '', sel: [], ds: {} },
  inj: { g: 'emerg', q: '', sel: [], ds: {} },
  neb: { g: 'neb', q: '', sel: [], ds: {} },
  renal: { mode: 'egfr', egfr: '', scr: '', age: '', sex: 'M', wt: '', route: 'all', q: '' },
  had: { d: 'ne', sub: 'mix', w: '', dose: '' }
};
const TABS = [['oral', 'ยากินเด็ก', 'baby'], ['neb', 'ยาพ่น', 'lungs'], ['inj', 'ยาฉีดเด็ก', 'syringe'], ['renal', 'ปรับตามไต', 'testtube'], ['had', 'HAD Handbook', 'alembic']];

/* ================= patient ================= */
function ageY() { const y = parseFloat(S.pt.y) || 0, m = parseFloat(S.pt.m) || 0; return (S.pt.y === '' && S.pt.m === '') ? null : y + m / 12; }

function ptStatus() {
  const w = num(S.pt.wt), b = ibw(), h = num(S.pt.ht);

  if (w && b && w > 1.2 * b) out.obese = true;

}
function doseWeight(row) {

/* ================= dosing engine ================= */
function bandFor(bands, x) { return bands ? bands.find(b => x >= b[0] && x < b[1]) : null; }
function target(drug, row, divSel) {
  const a = ageY(), dw = doseWeight(row), w = dw ? dw.w : null;
  const T = { perDay: null, lo: null, hi: null, max1: Infinity, notes: [], warn: [], danger: [], why: dw ? dw.why : '', unit: drug.unitName || 'mg' };

    else { T.lo = b[2]; T.hi = b[3]; T.rangeTxt = 'อายุ ' + b[0] + (b[1] >= 99 ? '+ ปี' : ' – ' + b[1] + ' ปี') + ': ' + fmt(b[2]) + (b[3] !== b[2] ? ' – ' + fmt(b[3]) : '') + ' ' + T.unit + '/ครั้ง'; }

  }

}
function roundStep(f, ml) { if (f.k === 'amp' || f.k === 'neb') return ml < 1 ? 0.01 : 0.1; return ml < 2 ? 0.1 : 0.5; }

const tspTxt = ml => { const t = ml / 5, q = Math.round(t * 4) / 4, w = Math.floor(q), r = q - w, fr = { 0: '', 0.25: '¼', 0.5: '½', 0.75: '¾' }[r]; return q === 0 ? '' : '≈ ' + (w ? w : '') + (fr || '') + ' ช้อนชา'; };

/* ================= render: shell ================= */

/* ================= render: patient + list ================= */

  </section>`;
}
function ptStatusHTML() {

      <tr class="${normOn ? 'pt' : ''}"><td>${x.a.length ? '≥ ' + Math.max(...x.a.map(a => a[1])) : 'ทุกระดับ'}${normOn ? tag : ''}<div class="nl">ขนาดปกติ</div></td><td><span class="pv">${esc(x.n[0])}</span></td><td><span class="pv">${esc(x.n[1] || '–')}</span></td></tr>
      ${x.a.map(a => `<tr class="${a === cur ? 'pt' : ''}"><td>${rangeLbl(a)}${a === cur ? tag : ''}</td>${plainCells(x, a[2])}</tr>`).join('')}</table></div>`;
    }).join('')}
      ${noadj.map(n => `<div class="card rdrug"><div class="rname"><img src="${I('check')}" alt=""><b>${esc(n)}</b></div><div class="minor" style="margin:4px 10px 10px 48px">ไม่ต้องปรับขนาดตามไต</div></div>`).join('')}</div>`;
  }
  if (val == null) return `<div class="card empty"><img src="${I('testtube')}" alt="">ใส่ค่าไต หรือค้นชื่อยาเพื่อดูขนาดทุกระดับ</div>`;
  const withAdj = rows.map(x => ({ x, v: adjFor(x, val) }));
  const stop = withAdj.filter(o => o.v && o.v.avoid), adj = withAdj.filter(o => o.v && !o.v.avoid), ok = withAdj.filter(o => !o.v);
  const nm = x => `<td><div class="rn">${esc(x.name)}</div><div class="rr">${esc(x.rt)}</div></td>`;
  const sec = (col, ic, t, arr, empty, rf, head) => `<section class="sec rsec"><div class="hd" style="background:${col}"><span class="hdic"><img src="${I(ic)}" alt=""></span>${t}<span class="n">${arr.length}</span></div>${arr.length ? `<table class="rtbl rlist">${head}${arr.map(rf).join('')}</table>` : `<div class="bd"><div class="minor">${empty}</div></div>`}</section>`;
  const head = `<tr><th>ยา</th><th>ขนาด/ครั้ง</th><th>ความถี่</th></tr>`;
  const okNames = ok.map(o => o.x.name).concat(RENAL_NOADJ.split(' · '));
  return `<div class="legend"><span class="sw"></span>ช่องสีเหลือง = ส่วนที่ต้องปรับจากขนาดปกติ · คำนวณที่ CrCl ${fmt(val, 0)} mL/min (ผู้ใหญ่)</div>
  <div class="rgrid"><div>${adj.length ? sec('var(--amber)', 'warning', 'ปรับขนาด', adj, '', o => `<tr>${nm(o.x)}${adjCells(o.x, o.v)}</tr>`, head) : (stop.length ? '' : `<div class="card okall"><img src="${I('check')}" alt=""><div><b>ไม่มียาที่ต้องปรับขนาด</b><div class="minor" style="margin:2px 0 0">ที่ CrCl ${fmt(val, 0)} mL/min ใช้ขนาดปกติได้ทุกตัวในรายการ</div></div></div>`)}</div>
  <div class="rside">${stop.length ? sec('var(--red)', 'prohibited', 'ห้ามใช้ / หลีกเลี่ยง', stop, '', o => `<tr>${nm(o.x)}<td colspan="2"><div class="cell bad"><div class="v">${esc(o.v.avoid)}</div></div></td></tr>`, '') : ''}
  <div class="card"><div class="ttl" style="font-size:15px;margin-bottom:8px"><img src="${I('check')}" alt="" style="width:22px;height:22px">ใช้ขนาดปกติ</div><div class="okl">${okNames.map(n => `<span>${esc(n)}</span>`).join('')}</div></div></div></div>`;
}

/* ================= HAD ================= */
function hadImg(d) { return d.image ? HAD_IMG_BASE + d.image : I('pill'); }
function hadHTML() {
  const keys = Object.keys(HAD_DB).sort((a, b) => HAD_DB[a].name.localeCompare(HAD_DB[b].name));
  return `<div class="cols"><nav class="hadside" aria-label="ยา HAD">${keys.map(k => `<button data-had="${k}" class="${S.had.d === k ? 'on' : ''}"><img src="${hadImg(HAD_DB[k])}" alt="" onerror="this.src='${I('pill')}'">${esc(HAD_DB[k].name)}</button>`).join('')}</nav>
  <div class="hadmain" id="hadBody"></div></div>`;
}
function hadBody() {
  const d = HAD_DB[S.had.d], qr = d.quickRef, ps = d.prepStruct, sub = S.had.sub;
  const mix = ps && ps.standardMix ? ps.standardMix : null;
  let h = `<section class="card"><div class="hero"><img src="${hadImg(d)}" alt="${esc(d.name)}" onerror="this.src='${I('pill')}'"><div style="flex:1 1 220px">
    <span class="badge had">High alert</span> <span class="badge">${esc(d.badge || '')}</span><h2>${esc(d.name)}</h2>
    <div style="color:var(--mute)">${ps && ps.form ? esc(ps.form.detail || '') : ''}</div></div>
    ${mix ? `<div class="rcard" style="min-width:200px"><div class="band" style="background:var(--red);padding:8px 14px"><span class="t" style="font-size:14px">ความเข้มข้นมาตรฐาน</span></div><div class="pad"><div class="big" style="font-size:30px">${esc(mix.result || '')}</div><div class="minor">${esc(mix.recipe || '')}</div></div></div>` : ''}
  </div></section>
  <div class="subtabs" role="tablist">${[['mix', 'ผสม & rate', 'alembic'], ['dose', 'Dose', 'syringe'], ['mon', 'Monitor', 'stopwatch'], ['emer', 'แก้ไขฉุกเฉิน', 'warning']].map(t => `<button data-hsub="${t[0]}" class="${sub === t[0] ? 'on' : ''}"><img src="${I(t[2])}" alt="">${t[1]}</button>`).join('')}</div>`;
  if (sub === 'mix') h += hadMix(d); else if (sub === 'dose') h += hadDose(d); else if (sub === 'mon') h += hadMon(d); else h += hadEmer(d);
  return h;
}
function txtList(arr, ic) { return `<div class="lst">${arr.map(x => { const t = typeof x === 'string' ? x : (x.text || ''); const s = typeof x === 'string' ? '' : (x.reason || x.detail || x.sub || ''); return `<div class="li"><img src="${I(ic)}" alt=""><div>${esc(t)}${s ? `<div class="sx">${esc(s)}</div>` : ''}</div></div>`; }).join('')}</div>`; }
function hadMix(d) {
  const ps = d.prepStruct, qr = d.quickRef; let h = '<div class="cols">';
  h += `<div style="flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px">`;
  if (ps) {
    if (ps.readyToUse) h += `<div class="card"><div class="li"><img src="${I('check')}" alt=""><b>${esc(ps.readyToUse)}</b></div></div>`;
    if (ps.steps) h += `<div class="card"><div class="ttl">วิธีผสม</div><div class="steps">${ps.steps.map((s, i) => `<div class="stp"><span class="n">${i + 1}</span><div>${esc(s.text)}${s.sub ? `<div class="sx">${esc(s.sub)}</div>` : ''}</div></div>`).join('')}</div></div>`;
    if (ps.indicationPreps) h += `<div class="card"><div class="ttl">${esc(ps.indicationPrepsLabel || 'สำหรับ indication อื่น')}</div>${ps.indicationPreps.map(p => `<div style="margin-bottom:10px"><b>${esc(p.label || p.indication || '')}</b>${p.standardMix ? `<div class="minor">${esc(p.standardMix.recipe || '')} → ${esc(p.standardMix.result || '')}</div>` : ''}${p.steps ? txtList(p.steps, 'syringe') : ''}</div>`).join('')}</div>`;
    const W = ps.warnings || [], R = ps.requirements || [];
    if (W.length || R.length) h += `<div class="cols">${W.length ? `<div class="card" style="flex:1 1 260px"><div class="ttl" style="color:#B4232A"><img class="ic" src="${I('prohibited')}" alt="">ห้าม</div>${txtList(W, 'cross')}</div>` : ''}${R.length ? `<div class="card" style="flex:1 1 260px"><div class="ttl" style="color:var(--green)"><img class="ic" src="${I('check')}" alt="">ต้องทำ</div>${txtList(R, 'check')}</div>` : ''}</div>`;
  } else if (d.info && d.info.prep) h += `<div class="card"><div class="ttl">วิธีเตรียม/ผสม</div><div class="prewrap">${esc(d.info.prep.split(' · ').join('\n'))}</div></div>`;
  h += `</div>`;
  if (qr && qr.conc) h += hadCalc(d);
  return h + '</div>';
}
function rateUnits(d) { const qr = d.quickRef, u = [...new Set((qr.doses || []).map(x => x.unit).filter(Boolean))]; return u.length ? u : [qr.rateUnit || '']; }
function rateUnit(d) { const us = rateUnits(d); return us.includes(S.had.u) ? S.had.u : us[0]; }
function hadCalc(d) {
  const qr = d.quickRef, u = rateUnit(d), perKg = /\/kg/.test(u), perMin = /\/min/.test(u);
  const w = num(S.had.w), dose = num(S.had.dose);
  let out = '—';
  if (dose && (!perKg || w)) { let perHr = dose * (perKg ? w : 1) * (perMin ? 60 : 1); out = fmt(perHr / qr.conc, 1); }
  return `<div class="rcard" style="flex:1 1 300px;align-self:flex-start"><div class="band" style="background:var(--blue)"><span class="hdic"><img src="${I('stopwatch')}" alt=""></span><span class="t">ตั้ง pump</span></div><div class="pad" style="display:flex;flex-direction:column;gap:10px">
   ${perKg ? `<label style="font-size:13px;color:var(--mute)">น้ำหนัก<span class="field"><input inputmode="decimal" data-hw="1" value="${esc(S.had.w)}" placeholder="—"><span>kg</span></span></label>` : ''}
   ${rateUnits(d).length > 1 ? `<div class="pills">${rateUnits(d).map(x => `<button data-hu="${esc(x)}" class="${x === u ? 'on' : ''}">${esc(x)}</button>`).join('')}</div>` : ''}
   <label style="font-size:13px;color:var(--mute)">ขนาดที่สั่ง<span class="field"><input inputmode="decimal" data-hd="1" value="${esc(S.had.dose)}" placeholder="—"><span>${esc(u)}</span></span></label>
   <div><span class="big" style="color:var(--blue)">${out}</span> <span style="color:var(--mute)">mL/hr</span></div>
   <div class="minor">ความเข้มข้น ${esc(qr.concLabel || qr.conc)}</div>
   ${qr.doses ? `<table class="tbl"><tr><th>ข้อบ่งใช้</th><th>ช่วง</th></tr>${qr.doses.map(x => `<tr><td>${esc(x.label)}</td><td>${fmt(x.range[0])}${x.range[1] !== x.range[0] ? ' – ' + fmt(x.range[1]) : ''} ${esc(x.unit)}</td></tr>`).join('')}</table>` : ''}
  </div></div>`;
}
function hadDose(d) {
  const ds = (d.info && d.info.doses) || [];
  return `<div class="card"><div class="ttl">Dose ตาม indication</div><table class="tbl"><tr><th>Indication</th><th>Dose</th></tr>${ds.map(x => `<tr><td>${esc(x.ind)}</td><td><b>${esc(x.dose)}</b></td></tr>`).join('')}</table>${d.info && d.info.source ? `<div class="minor" style="margin-top:10px">${esc(d.info.source)}</div>` : ''}</div>`;
}
function hadMon(d) {
  const m = d.monitoringStruct; let h = '';
  if (m) {
    if (m.schedule) h += `<div class="card"><div class="ttl"><img class="ic" src="${I('stopwatch')}" alt="">ตารางติดตาม</div><table class="tbl"><tr><th>ติดตาม</th><th>ความถี่</th><th>เมื่อ</th></tr>${m.schedule.map(s => `<tr><td><b>${esc(s.what)}</b></td><td>${esc(s.when)}</td><td>${esc(s.cond || '')}</td></tr>`).join('')}</table></div>`;
    h += '<div class="cols">';
    if (m.observe) h += `<div class="card" style="flex:1 1 260px"><div class="ttl">สังเกต</div>${txtList(m.observe, 'check')}</div>`;
    if (m.redFlags) h += `<div class="card" style="flex:1 1 260px"><div class="ttl" style="color:#B4232A">Red flags · แจ้งแพทย์</div>${txtList(m.redFlags, 'warning')}</div>`;
    h += '</div>';
    if (m.protocol) h += `<div class="card"><div class="ttl">Protocol</div>${txtList(m.protocol, 'clipboard')}</div>`;
  } else if (d.info && d.info.monitoring) h += `<div class="card"><div class="ttl">Monitoring</div><div class="prewrap">${esc(d.info.monitoring.split(' · ').join('\n'))}</div></div>`;
  return h;
}
function hadEmer(d) {
  const a = d.antidoteStruct; let h = '';
  if (a) {
    h += `<div class="rcard"><div class="band" style="background:var(--red)"><span class="hdic"><img src="${I('warning')}" alt=""></span><span class="t">${esc(a.trigger)}</span><span class="s">${esc(a.subtitle || '')}</span></div><div class="pad lst">${(a.steps || []).map((s, i) => `<div class="li"><span class="step ${s.urgent ? 'urgent' : ''}" style="${s.urgent ? '' : 'background:var(--bg);color:var(--ink)'}">${i + 1}</span><div><b>${esc(s.text)}</b>${s.detail ? `<div class="sx">${esc(s.detail)}</div>` : ''}</div></div>`).join('')}</div></div>`;
    if (a.related) h += `<div class="card"><div class="ttl">สถานการณ์อื่น</div><table class="tbl">${a.related.map(r => `<tr><td><b>${esc(r.trigger)}</b></td><td>${esc(r.action)}</td></tr>`).join('')}</table></div>`;
  }
  if (d.info && (d.info.alarm || d.info.antidote)) h += `<div class="card">${d.info.antidote ? `<div class="ttl">ยาแก้พิษ</div><div class="prewrap" style="margin-bottom:12px">${esc(d.info.antidote)}</div>` : ''}${d.info.alarm ? `<div class="ttl">อาการไม่พึงประสงค์ที่ต้องเฝ้าระวัง</div><div class="prewrap">${esc(d.info.alarm.split(' · ').join('\n'))}</div>` : ''}</div>`;
  return h || `<div class="card empty">ไม่มีข้อมูล</div>`;
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const D = b.dataset, tab = S.tab, st = S[tab];
  if (D.tab) { S.tab = D.tab; render(); return; }
  if (D.ptset) { const [k, v] = D.ptset.split(':'); S.pt[k] = v; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); refresh(); return; }
  if (D.act === 'clearpt') { S.pt = { y: '', m: '', sex: 'M', wt: '', ht: '', g6pd: 'normal' }; render(); return; }
  if (D.grp) { st.g = D.grp; st.q = ''; const q = $('[data-q]'); if (q) q.value = ''; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); refresh(); return; }
  if (D.drug != null) { const i = +D.drug, k = st.sel.indexOf(i); if (k >= 0) st.sel.splice(k, 1); else { st.sel.push(i); delete st.ds[i]; } refresh(); return; }
  if (D.unsel != null) { const k = st.sel.indexOf(+D.unsel); if (k >= 0) st.sel.splice(k, 1); refresh(); return; }
  if (D.act === 'clearsel') { st.sel = []; st.ds = {}; refresh(); return; }
  const card = b.closest('[data-di]'), ds = card && dstate(tab, +card.dataset.di);
  if (ds && D.row != null) { ds.r = +D.row; ds.div = null; refresh(); return; }
  if (ds && D.form != null) { ds.f = +D.form; ds.oAmt = ''; refresh(); return; }
  if (ds && D.div != null) { ds.div = +D.div; refresh(); return; }
  if (D.rmode) { S.renal.mode = D.rmode; render(); return; }
  if (D.rsex) { S.renal.sex = D.rsex; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); refresh(); return; }
  if (D.route) { S.renal.route = D.route; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); refresh(); return; }
  if (D.had) { S.had.d = D.had; S.had.dose = ''; S.had.u = null; document.querySelectorAll('[data-had]').forEach(x => x.classList.toggle('on', x === b)); refresh(); return; }
  if (D.hsub) { S.had.sub = D.hsub; refresh(); return; }
  if (D.hu) { S.had.u = D.hu; refresh(); return; }
});
document.addEventListener('input', e => {
  const t = e.target, D = t.dataset, st = S[S.tab];
  if (D.pt) { S.pt[D.pt] = t.value; partial(); return; }
  if (D.q) { st.q = t.value; const l = $('#drugList'); if (l) l.innerHTML = drugListHTML(S.tab); return; }
  const card = t.closest('[data-di]');
  if (card && (D.days || D.oamt || D.ofreq)) { const di = +card.dataset.di, ds = dstate(S.tab, di); if (D.days) ds.days = t.value; else if (D.oamt) ds.oAmt = t.value; else { ds.oFreq = t.value; const n = num(t.value), dr = DB[S.tab][di], rw = dr.rows[Math.min(ds.r, dr.rows.length - 1)], o = rw.div || rw.perDay || [1]; if (n && o.includes(n)) ds.div = n; } keepFocus(t, () => { $('#result').innerHTML = resultHTML(S.tab); }); return; }
  if (D.rn) { S.renal[D.rn] = t.value; $('#renalOut').innerHTML = renalOut(); return; }
  if (D.rq) { S.renal.q = t.value; $('#renalList').innerHTML = renalList(bandIdx(renalVal())); return; }
  if (D.hw || D.hd) { if (D.hw) S.had.w = t.value; else S.had.dose = t.value; keepFocus(t, () => { $('#hadBody').innerHTML = hadBody(); }); return; }
});
function partial() { const p = $('#ptStatus'); if (p) p.innerHTML = ptStatusHTML(); const r = $('#result'); if (r) r.innerHTML = resultHTML(S.tab); }
function keepFocus(t, fn) {
  const c = t.closest('[data-di]'), pre = c ? '[data-di="' + c.dataset.di + '"] ' : '';
  const sel = pre + Object.keys(t.dataset).map(k => '[data-' + k.replace(/[A-Z]/g, m => '-' + m.toLowerCase()) + ']').join(''), pos = t.selectionStart;
  fn(); const n = sel && document.querySelector(sel); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
}
render();
</script>
</body>
</html>
