<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>รถยา ER v2</title>
<!-- ER Med Cart v2 · build 2026-10-26 05:06 UTC · แหล่งข้อมูล: Supabase ermedcart-hub (เดียวกับ v1) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ER Med Cart v2 — styles */
:root{
  --ink:#0d1535; --muted:#5b6280; --hint:#6a7090; --line:rgba(13,21,53,.09); --line2:rgba(13,21,53,.18);
  --bg:#eef2f7; --card:#fff; --soft:#f7f8fb; --chipbg:#eef0f5;
  --red:#b01030; --red-bg:#ffe8ee; --red-b:#f5b0c0;
  --amb:#7a5200; --amb-bg:#fef3da; --amb-dot:#d49a1c;
  --grn:#1a6e40; --grn-bg:#e6f4ed; --grn-soft:#f6faf7;
  --blu:#1a3a8a; --blu-bg:#e8eeff; --bar:#3a5aa8; --bar2:#9db4e6; --org:#d9661f;
  --nav-h:64px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Google Sans','Noto Sans Thai',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
[hidden]{display:none!important}
b{font-weight:700}

/* layout */
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px}
.ttl{font-size:18px;font-weight:700}
.sub{font-size:12px;color:var(--muted);margin-top:1px}
.wrap{max-width:600px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 96px);display:flex;flex-direction:column;gap:12px}
.wrap.wide{max-width:960px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.h{font-size:15px;font-weight:700}
.h2{font-size:14px;font-weight:700}
.lbl{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* controls */
.btn{min-height:48px;border-radius:14px;border:0;background:var(--ink);color:#fff;font-size:15px;font-weight:600;padding:0 18px;width:100%}
.btn:disabled{background:#d5d9e3;color:#4a5170}
.btn.sm{min-height:44px;font-size:14px;width:auto}
.btn.green{background:var(--grn)}
.btn2{min-height:44px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--ink);font-size:14px;font-weight:600;padding:0 14px}
.btn2.danger{color:var(--red);border-color:var(--red-b)}
.lnk{min-height:32px;border:0;background:none;font-size:13px;font-weight:600;color:var(--blu);padding:0;text-decoration:underline;text-align:left}
.lnk.red{color:var(--red)} .lnk.muted{color:var(--muted)}
.chip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:#fff;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.add{border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block}
.inp{min-height:44px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;font-size:15px;background:#fff;width:100%}
textarea.inp{padding:10px 12px;min-height:64px;resize:vertical}
.inp:focus,.btn:focus-visible,.btn2:focus-visible,.chip:focus-visible,.qb:focus-visible{outline:3px solid #9db4e6;outline-offset:1px}
.inp.big{min-height:48px;font-size:17px;letter-spacing:.02em}
.fl{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.seg{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;background:var(--chipbg);border-radius:12px;padding:4px;gap:4px}
.sg{min-height:40px;border:0;border-radius:9px;background:none;font-size:14px;color:#4a5170;line-height:1.2;padding:4px 6px}
.sg.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(13,21,53,.14)}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qb{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:#fff;font-size:20px;line-height:1;flex:none}
.qb:disabled{opacity:.35}
.qv{min-width:34px;text-align:center;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.check input{width:20px;height:20px;flex:none}

/* status */
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px;white-space:nowrap;display:inline-block}
.p-red{background:var(--red-bg);color:var(--red)} .p-amb{background:var(--amb-bg);color:var(--amb)} .p-grn{background:var(--grn-bg);color:var(--grn)} .p-blu{background:var(--blu-bg);color:var(--blu)} .p-gry{background:var(--chipbg);color:#4a5170}
.loc{font-size:12px;font-weight:700;background:var(--chipbg);border-radius:8px;padding:4px 8px;font-variant-numeric:tabular-nums;flex:none;white-space:nowrap}
.had{font-size:11px;font-weight:700;color:var(--red);border:1px solid var(--red-b);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.nm{font-size:14px;font-weight:600}
.note{border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.note.ok{background:var(--grn-bg);color:var(--grn)} .note.warn{background:var(--amb-bg);color:var(--amb)} .note.err{background:var(--red-bg);color:var(--red)} .note.info{background:var(--blu-bg);color:var(--blu)}
.prog{height:8px;border-radius:4px;background:#e3e7ef;overflow:hidden;display:flex}
.prog>i{display:block;height:100%}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:20px 8px}
.skel{background:linear-gradient(90deg,#e6eaf1 0,#f2f4f8 50%,#e6eaf1 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px;height:64px}
@keyframes sk{to{background-position:-200% 0}}

/* list items */
.it{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.it.done{background:var(--grn-soft)}
.it.alert{border-color:var(--red-b)}
.shelf{font-size:13px;font-weight:700;color:#4a5170;padding:8px 2px 0;display:flex;justify-content:space-between}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.kn{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}

/* cart card */
.cc{background:#fff;border:2px solid var(--ink);border-radius:16px;overflow:hidden}
.cc-hd{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--soft);width:100%;border:0;text-align:left}
.cc-in{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.lot{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(13,21,53,.08)}
.sum{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:10px;padding:10px 12px}

/* hub */
.step{display:flex;align-items:center;gap:12px;padding:12px 0;border:0;background:none;width:100%;text-align:left;border-top:1px solid rgba(13,21,53,.08)}
.sdot{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;background:var(--chipbg);color:#4a5170}
.sdot.cur{background:var(--ink);color:#fff} .sdot.ok{background:var(--grn-bg);color:var(--grn)}
.alertbox{background:#fafbfd;border:1px solid rgba(13,21,53,.08);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.feed{display:flex;flex-direction:column;gap:6px}
.feed-it{display:flex;gap:10px;font-size:13px}
.feed-it .t{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;width:42px}

/* record */
.calc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--soft)}
.ent{border:1px solid rgba(13,21,53,.1);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fcfcfe}
.x{width:36px;height:36px;border-radius:18px;border:0;background:var(--chipbg);color:#4a5170;font-size:16px;flex:none}
.sev{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.sv{min-height:40px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-size:14px;font-weight:700}
.sv.on{color:#fff;border-color:transparent}
.tog{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line2);background:#fff;font-size:13px;color:#4a5170;align-self:flex-start}
.tog.on{background:var(--red-bg);border-color:var(--red-b);color:var(--red);font-weight:600}

/* nurse */
.shelfbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.shelfbox{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.nrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.nrow.ok{background:var(--grn-soft)} .nrow.miss{background:#fff7f9;border-color:var(--red-b)}
.okb,.msb{min-height:44px;min-width:58px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-size:14px;font-weight:600}
.okb{color:var(--grn)} .msb{color:var(--red)}
.okb.on{background:var(--grn);color:#fff;border-color:var(--grn)} .msb.on{background:var(--red);color:#fff;border-color:var(--red)}

/* stock */
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:10px;border-top:1px solid rgba(13,21,53,.08)}
.dv{font-size:14px;font-weight:600;margin-top:2px}
.qtxt{font-size:14px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* reports */
.hb{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px}
.hb>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;background:var(--chipbg);border-radius:5px;overflow:hidden}
.track>i{display:block;height:100%;background:var(--bar)}
.vbars{height:120px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid rgba(13,21,53,.15)}
.vbars>i{flex:1;background:var(--bar);border-radius:3px 3px 0 0}
.seg.tabs .sg{font-size:13px;padding:4px 2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid rgba(13,21,53,.12);white-space:nowrap}
.tbl td{padding:8px 4px;border-bottom:1px solid rgba(13,21,53,.06);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
.tbl th:first-child,.tbl td:first-child,.tbl .l{text-align:left}
.scrollx{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal>div{height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media(min-width:820px){.rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.rgrid .span2{grid-column:1/-1}.kpis4{grid-template-columns:repeat(4,minmax(0,1fr))!important}}

/* bars: sticky + nav */
.sticky{position:fixed;left:0;right:0;bottom:var(--nav-h);z-index:15;background:#fff;border-top:1px solid rgba(13,21,53,.1);padding:10px 16px}
.sticky-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px}
.sticky-in.col{flex-direction:column;align-items:stretch;gap:8px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;height:var(--nav-h);background:#fff;border-top:1px solid rgba(13,21,53,.1);padding-bottom:env(safe-area-inset-bottom,0)}
.nav-in{max-width:600px;margin:0 auto;height:100%;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted);background:none;border:0;position:relative}
.nb.on{color:var(--ink);font-weight:700}
.nb svg{width:22px;height:22px}
.nb .bdg{position:absolute;top:6px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:0 5px;min-width:18px;line-height:18px}

/* sheet + toast */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(13,21,53,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:600px;max-height:92vh;overflow:auto;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:2px;background:#d5d9e3;align-self:center}
.sheet-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-ttl{font-size:19px;font-weight:700}
.sheet-act{display:flex;gap:8px;margin-top:4px}
.ck{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid rgba(13,21,53,.08)}
.ck .ic{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
#toast-root{position:fixed;left:0;right:0;top:12px;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;max-width:560px;width:100%;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 8px 24px rgba(13,21,53,.25)}
.toast.err{background:var(--red)}
.toast button{background:none;border:0;color:#cfd6ff;font-weight:600;min-height:32px}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px 20px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.pw{position:relative}
.pw .lnk{position:absolute;right:10px;top:6px}
.err-txt{color:var(--red);font-size:13px}

.print-only{display:none}
@media print{
  .print-only{display:block!important}
  .top,.nav,.sticky,.no-print,#toast-root{display:none!important}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .card{break-inside:avoid;border-color:#ccc}
}

/* cart: lot rows — highlight only */
.lotr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;margin:0 -10px}
.lotr.miss{background:#ffe8ee}
.lotr.wd{background:#fef3da}
.refill{display:flex;align-items:center;gap:10px;background:var(--blu-bg);border-radius:10px;padding:10px 12px}
.refill-n{display:block;font-size:16px;font-weight:700;color:var(--blu)}

/* =========================================================
   CALM THEME (v2.1) — แดงสีเดียว = ต้องทำ · ที่เหลือขาวดำ
   ========================================================= */
:root{
  --ink:#14171f; --muted:#6b7080; --hint:#6b7080; --line:#e6e8ec; --line2:#d9dce3;
  --bg:#f4f5f7; --soft:#f7f8fa; --chipbg:#f0f1f4; --sub:#3d4250;
  --red:#c4122f; --red-bg:#fdecef; --red-b:#f2b8c2;
  --amb:#3d4250; --amb-bg:#f0f1f4; --amb-dot:#c4122f;
  --grn:#3d4250; --grn-bg:#f0f1f4; --grn-soft:#fff;
  --blu:#3d4250; --blu-bg:#f0f1f4; --bar:#3d4250; --bar2:#b8bcc6; --org:#c4122f;
}
body{color:var(--ink)}
.card{border-radius:14px}
.pill{font-weight:600}
.p-amb,.p-blu,.p-grn,.p-gry{background:var(--chipbg);color:var(--sub)}
.p-red{background:var(--red-bg);color:var(--red)}
.note.ok,.note.info,.note.warn{background:var(--chipbg);color:var(--sub)}
.note.warn{box-shadow:inset 3px 0 0 var(--red)}
.note.err{background:var(--red-bg);color:var(--red)}
.had{border:0;padding:0;margin-left:6px;font-size:11px;color:var(--red)}
.loc{background:none;padding:0;color:var(--muted);font-weight:500}
.locp{display:inline-block;font-size:12px;color:#5b6070;background:var(--chipbg);border-radius:10px;padding:1px 8px;margin-top:4px;white-space:nowrap}
.missp{display:inline-block;font-size:12px;font-weight:600;color:var(--red);background:var(--red-bg);border-radius:10px;padding:1px 8px}
.st{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}
.st.act{color:var(--red);font-weight:600}
.st.act::before{content:'';display:inline-block;width:6px;height:6px;border-radius:3px;background:currentColor;margin-right:6px;vertical-align:2px}
.kdot{display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--red);margin-left:6px;vertical-align:5px}
/* grouped lists (หนึ่งกล่องต่อชั้น · คั่นเส้นบาง) */
.group{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gr{display:flex;align-items:center;gap:12px;padding:10px 14px;border:0;border-top:1px solid #eef0f3;background:none;width:100%;text-align:left;color:var(--ink)}
.gr:first-child{border-top:0}
.gr.done .nm{color:#8a8f9c}
.shelf{color:var(--muted);font-size:12px;letter-spacing:.02em;padding:6px 4px 0}
/* cart card */
.cc{border:1.5px solid var(--ink);border-radius:14px}
.cc-hd{background:#fff;border-bottom:1px solid #eef0f3}
.lotr{position:relative;margin:0;padding:10px 0;border-radius:0;border-top:1px solid #eef0f3}
.lotr:first-child{border-top:0}
.lotr.miss,.lotr.wd{background:none}
.lotr.miss::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--red)}
.lotr.miss .qv{color:var(--red)}
.lotr.wd .expd{color:#a0a4af;text-decoration:line-through}
.lotr.wd .qv{color:#a0a4af}
.refill{background:none;border:0;padding:4px 0;color:var(--sub);font-size:14px}
.qb{border-color:var(--line2)}
.it.done{background:#fff}
.it.alert{border-color:var(--line)}
/* hub */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kc{padding:12px 14px;border:0;border-left:1px solid #eef0f3;background:none;text-align:left;color:var(--ink)}
.kc:first-child{border-left:0}
.sdot{background:none;border:1.5px solid #c9ccd4;color:var(--muted)}
.sdot.cur{border-color:var(--ink);color:var(--ink);background:none}
.sdot.ok{background:var(--ink);border-color:var(--ink);color:#fff}
.go{border:1px solid var(--ink);background:#fff;border-radius:10px;min-height:38px;padding:0 12px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.go2{border:1px solid var(--line2);background:#fff;border-radius:10px;min-height:38px;padding:0 10px;font-size:13px;color:var(--sub);white-space:nowrap}
/* nurse */

<script>
/* ============================================================
   ER Med Cart v2 — core (config, API, utils, UI kit, router, login)
   ใช้ Supabase Edge Function เดิม (ermedcart-hub) · action + payload เดิม
   ============================================================ */
'use strict';
const EDGE_FUNCTION_URL = 'https://qvtlekphxsubuklyirlz.supabase.co/functions/v1/ermedcart-hub';
const SUPABASE_ANON_KEY = 'sb_publishable_dPhW0DORMGlSTc1hzvT4Cw_9ChOlZ0H';

const PHARMACISTS = ['ภญ.นัยนา', 'ภญ.วนิดา', 'ภญ.อัญชลี', 'ภญ.ยุพิน', 'ภญ.กรรณิกา'];
const TECHS = ['จพ.วิภารัตน์', 'จพ.ปุญญพัฒน์', 'จพ.ธนารักษ์', 'จพ.สรัล'];
const FRIDGE = 'ตู้เย็น ER';
const READ_ACTIONS = { getStockSummary: 1, getStockByDrug: 1, getTodayShiftState: 1, getPendingNurseMisses: 1, getRecentActivity: 1, getDashboardData: 1 };

/* ---------- API ---------- */
async function api(action, payload) {
  const body = JSON.stringify(Object.assign({ action: action }, payload || {}));
  const attempt = async () => {
    const res = await fetch(EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY },
      body: body,
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    // edge function ส่ง error กลับเป็น HTTP 200 + { success:false, message, where } — ต้องโยนเป็น error
    if (j && j.success === false && Object.prototype.hasOwnProperty.call(j, 'where')) { const er = new Error(j.message || 'เซิร์ฟเวอร์ผิดพลาด'); er.server = true; throw er; }
    return j;
  };
  try { return await attempt(); }
  catch (e) {
    if (e.server || !READ_ACTIONS[action]) throw netErr(e);
    await new Promise(r => setTimeout(r, 700));        // อ่านข้อมูล: ลองซ้ำ 1 ครั้ง
    try { return await attempt(); } catch (e2) { throw netErr(e2); }
  }
}
function netErr(e) {
  if (e && e.server) return e;
  const m = (e && e.message) || String(e);
  return new Error(/fetch|network|Failed/i.test(m) ? 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจอินเทอร์เน็ตแล้วลองใหม่' : m);
}

/* ---------- utils ---------- */
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function escB(s) { return esc(s).replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>'); } // อนุญาตเฉพาะ <b>
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function num(v) { const n = Number(v); return isFinite(n) ? n : 0; }
function sum(a, f) { return a.reduce((s, x) => s + (f ? f(x) : x), 0); }
function plural(n, unit) { return n + ' ' + (unit || ''); }

/* ---------- dates (เวลาไทยเสมอ) ---------- */
const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TH_D = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
function bkkToday() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date()); }
function bkkTime() { return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date()); }
function isoParts(iso) { const p = String(iso || '').slice(0, 10).split('-').map(Number); return { y: p[0], m: p[1], d: p[2] }; }
function addDays(iso, n) { const d = new Date(String(iso).slice(0, 10) + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((Date.parse(String(b).slice(0, 10) + 'T00:00:00Z') - Date.parse(String(a).slice(0, 10) + 'T00:00:00Z')) / 864e5); }
function lastDay(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function pad2(n) { return String(n).padStart(2, '0'); }
/* วันที่เหตุการณ์ → พ.ศ. */
function thDate(iso) { const p = isoParts(iso); if (!p.m) return '—'; return p.d + ' ' + TH_M[p.m - 1] + ' ' + (p.y + 543); }
function thDateShort(iso) { const p = isoParts(iso); if (!p.m) return '—'; return p.d + ' ' + TH_M[p.m - 1]; }
function thDow(iso) { return TH_D[new Date(String(iso).slice(0, 10) + 'T00:00:00Z').getUTCDay()]; }
/* EXP → ค.ศ. (ตรงกับกล่องยา) */
function expMonth(iso) { const p = isoParts(iso); if (!p.m) return '—'; return TH_M[p.m - 1] + ' ' + p.y; }
function expFull(iso) { const p = isoParts(iso); if (!p.m) return '—'; return p.d + ' ' + TH_M[p.m - 1] + ' ' + p.y; }
function expShort(iso) { const p = isoParts(iso); if (!p.m) return '—'; return p.d + ' ' + TH_M[p.m - 1]; }
function tsTime(ts) { const s = String(ts || ''); const m = s.match(/(\d{2}):(\d{2})/); return m ? m[1] + ':' + m[2] : '--:--'; }
function tsDate(ts) { return String(ts || '').slice(0, 10); }

/* ---------- EXP input: รับทั้ง ค.ศ./พ.ศ. ----------
   วว/ดด/ปปปป · ดด/ปปปป · ดด/ปป · ปปปป-ดด(-วว) · ตัวเลขล้วน 8/6/4 หลัก
   ปี ≥ 2400 = พ.ศ. (−543) · ปี 2 หลัก: ≤ 50 → 20xx (ค.ศ.), > 50 → 25xx (พ.ศ.)
   ระบุแค่เดือน → วันสิ้นเดือน */
function parseExpInput(raw, todayIso) {
  const s = String(raw || '').trim().replace(/\s+/g, '');
  if (!s) return { ok: false, empty: true, msg: '' };
  let d = null, m = null, y = null, mm;
  if ((mm = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/))) { d = +mm[1]; m = +mm[2]; y = mm[3]; }
  else if ((mm = s.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/))) { y = mm[1]; m = +mm[2]; d = +mm[3]; }
  else if ((mm = s.match(/^(\d{1,2})[\/.\-](\d{2}|\d{4})$/))) { m = +mm[1]; y = mm[2]; }
  else if ((mm = s.match(/^(\d{4})[\/.\-](\d{1,2})$/))) { y = mm[1]; m = +mm[2]; }
  else if (/^\d{8}$/.test(s)) { d = +s.slice(0, 2); m = +s.slice(2, 4); y = s.slice(4); }
  else if (/^\d{6}$/.test(s)) { m = +s.slice(0, 2); y = s.slice(2); }
  else if (/^\d{4}$/.test(s)) { m = +s.slice(0, 2); y = s.slice(2); }
  else return { ok: false, msg: 'อ่านไม่ออก — ลองพิมพ์แบบ 31/08/2027 หรือ 08/2027' };
  let yr = +y;
  if (String(y).length === 2) yr = yr <= 50 ? 2000 + yr : 2500 + yr;
  const wasBE = yr >= 2400;
  if (wasBE) yr -= 543;
  if (!(m >= 1 && m <= 12)) return { ok: false, msg: 'เดือนต้องอยู่ระหว่าง 1–12' };
  if (yr < 2000 || yr > 2100) return { ok: false, msg: 'ปีไม่ถูกต้อง' };
  const monthOnly = d == null;
  const ld = lastDay(yr, m);
  if (monthOnly) d = ld;
  if (!(d >= 1 && d <= ld)) return { ok: false, msg: 'วันที่ไม่ถูกต้องสำหรับเดือนนี้' };
  const iso = yr + '-' + pad2(m) + '-' + pad2(d);
  const days = daysBetween(todayIso || bkkToday(), iso);
  const r = { ok: true, iso: iso, be: yr + 543, monthOnly: monthOnly, wasBE: wasBE, days: days, level: 'ok', msg: '' };
  if (days < 0) { r.level = 'block'; r.msg = 'วันนี้เลยวันหมดอายุแล้ว — ห้ามเติมเข้ารถ'; }
  else if (days < 7) { r.level = 'warn'; r.msg = 'หมดอายุภายใน 7 วัน — ยืนยันว่าถูกต้อง'; }
  else if (days > 3650) { r.level = 'warn'; r.msg = 'ไกลเกิน 10 ปี — อาจพิมพ์ปี ค.ศ./พ.ศ. ผิด'; }
  return r;
}
function expReadout(r) {
  if (!r || !r.ok) return '';
  const left = r.days < 0 ? 'หมดอายุแล้ว' : leftText(r.days);
  return '<b>' + expFull(r.iso) + '</b> (พ.ศ. ' + r.be + ') · ' + left + (r.monthOnly ? ' · นับเป็นสิ้นเดือน' : '');
}

/* ---------- icons ---------- */
const ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  check: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 13l2 2 4-4"/>',

  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  tick: '<path d="M5 12l5 5 9-10"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
};
function svg(name, size, color, sw) {
  return '<svg width="' + (size || 22) + '" height="' + (size || 22) + '" viewBox="0 0 24 24" fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="' + (sw || 1.8) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>';
}

/* ---------- UI kit: toast / sheet ---------- */
function toast(msg, kind, actLabel, actFn) {
  const root = $('toast-root');
  root.innerHTML = '';   // แสดงทีละอัน ไม่ซ้อนกัน
  const el = document.createElement('div');
  el.className = 'toast' + (kind === 'err' ? ' err' : '');
  el.setAttribute('role', kind === 'err' ? 'alert' : 'status');
  el.innerHTML = (kind === 'err' ? '' : svg('tick', 18, '#7fd6a4', 2.4)) + '<span class="grow">' + esc(msg) + '</span>' + (actLabel ? '<button type="button">' + esc(actLabel) + '</button>' : '');
  if (actLabel) el.querySelector('button').onclick = () => { el.remove(); actFn && actFn(); };
  root.appendChild(el);
  setTimeout(() => el.remove(), kind === 'err' ? 5000 : 2800);
}
let _sheetClose = null;
function openSheet(o) {
  closeSheet();
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = '<section class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(o.title || '') + '">' +
    '<div class="grab"></div>' +
    '<div class="sheet-hd"><div><div class="sheet-ttl">' + esc(o.title || '') + '</div>' + (o.sub ? '<div class="lbl">' + esc(o.sub) + '</div>' : '') + '</div>' +
    '<button class="x" type="button" aria-label="ปิด" data-close>' + svg('x', 16) + '</button></div>' +
    '<div class="sheet-body" style="display:flex;flex-direction:column;gap:12px">' + (o.body || '') + '</div>' +
    (o.actions ? '<div class="sheet-act">' + o.actions + '</div>' : '') +
    '</section>';
  scrim.addEventListener('click', (e) => { if (e.target === scrim || e.target.closest('[data-close]')) closeSheet(); });
  document.body.appendChild(scrim);
  const prev = document.activeElement;
  _sheetClose = () => { scrim.remove(); _sheetClose = null; if (o.onClose) o.onClose(); if (prev && prev.focus) prev.focus(); };
  setTimeout(() => { const f = scrim.querySelector('input,select,textarea,.btn'); if (f) f.focus(); }, 30);
  return scrim;
}
function closeSheet() { if (_sheetClose) _sheetClose(); }
function confirmSheet(o) {
  return new Promise((resolve) => {
    let done = false;
    const sc = openSheet({
      title: o.title, sub: o.sub, body: o.body || '',
      actions: '<button class="btn2" type="button" data-no>' + esc(o.cancel || 'ยกเลิก') + '</button>' +
               '<button class="btn" type="button" data-yes style="flex:1' + (o.danger ? ';background:var(--red)' : '') + '">' + esc(o.ok || 'ยืนยัน') + '</button>',
      onClose: () => { if (!done) resolve(false); },
    });
    sc.querySelector('[data-yes]').onclick = () => { done = true; closeSheet(); resolve(true); };
    sc.querySelector('[data-no]').onclick = () => { done = true; closeSheet(); resolve(false); };
  });
}
function qtyCtl(val, minusFn, plusFn, opts) {
  opts = opts || {};
  return '<span class="qty"><button class="qb" type="button" aria-label="ลด" onclick="' + minusFn + '"' + (opts.min != null && val <= opts.min ? ' disabled' : '') + '>−</button>' +
    '<span class="qv"' + (opts.id ? ' id="' + opts.id + '"' : '') + '>' + val + '</span>' +
    '<button class="qb" type="button" aria-label="เพิ่ม" onclick="' + plusFn + '"' + (opts.max != null && val >= opts.max ? ' disabled' : '') + '>+</button>' +
    (opts.unit ? '<span class="lbl">' + esc(opts.unit) + '</span>' : '') + '</span>';
}
function setBusy(btn, busy, label) {
  if (!btn) return;
  if (busy) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = label || 'กำลังบันทึก…'; }
  else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
}

/* ---------- state ---------- */
const APP = {
  role: null, user: null, tech: '',
  drugs: [], pending: [],
  shift: { saved: false, id: null, rxTotal: null, savedAt: null, cartSubmitted: false, cartSummary: null },
  page: null,
};
function drugById(id) { return APP.drugs.find(d => d.id === id); }
function mapDrug(d) {
  return {
    id: d.drug_id, name: d.name, location: d.location || 'รถยา', type: d.type || 'inject',
    cart_pos: d.cart_pos || '', unit: d.unit || 'amp', pack_size: num(d.pack_size),
    cur: num(d.current_qty), target: num(d.target_qty), lot: d.lot, exp: d.exp_date || '',
    status: d.exp_status || 'ok',
    had: d.had_alert === true || d.had_alert === 'TRUE' || d.had_alert === 1 || d.had_alert === 'true' || d.had_alert === 'Yes',
  };
}
async function loadDrugs() { const s = await api('getStockSummary'); APP.drugs = (s || []).map(mapDrug); return APP.drugs; }
async function loadPending() {
  try { APP.pending = (await api('getPendingNurseMisses', {})) || []; } catch (e) { /* แสดงต่อด้วยค่าเดิม */ }
  return APP.pending;
}
function pendingFor(id) { return APP.pending.filter(p => p.drug_id === id); }
function posParts(pos) { const p = String(pos || '').split('-').map(x => parseInt(x, 10)); return [isNaN(p[0]) ? 99 : p[0], isNaN(p[1]) ? 99 : p[1], isNaN(p[2]) ? 99 : p[2]]; }
function byPos(a, b) {
  const fa = a.location === FRIDGE ? 1 : 0, fb = b.location === FRIDGE ? 1 : 0;
  if (fa !== fb) return fa - fb;
  const A = posParts(a.cart_pos), B = posParts(b.cart_pos);
  return A[0] - B[0] || A[1] - B[1] || A[2] - B[2] || String(a.name).localeCompare(String(b.name));
}
function shelfKey(d) { return d.location === FRIDGE ? 'fridge' : String(posParts(d.cart_pos)[0]); }
function shelfName(k) { return k === 'fridge' ? 'ตู้เย็น ER' : k === '99' ? 'ยังไม่ระบุตำแหน่ง' : 'ชั้น ' + k; }
function locLabel(d) { return d.location === FRIDGE ? 'ตู้เย็น' : (d.cart_pos || '—'); }
/* ตำแหน่งเป็นคำ: full = มีชั้น (ใช้นอกรายการที่จัดกลุ่มตามชั้น) */
function locText(d, full) {
  if (d.location === FRIDGE) return 'ตู้เย็น ER';
  const p = posParts(d.cart_pos);
  if (p[0] >= 99) return 'ยังไม่ระบุตำแหน่ง';
  return (full ? 'ชั้น ' + p[0] + ' · ' : '') + 'กล่อง ' + p[1] + ' · ช่อง ' + p[2];
}
function locPill(d, full) { return '<span class="locp">' + esc(locText(d, full)) + '</span>'; }
/* ช่อง EXP: พิมพ์ (ค.ศ./พ.ศ.) หรือแตะปฏิทิน · onInput = ชื่อฟังก์ชัน global รับ (value) */
function expField(id, value, onInput, placeholder) {
  return '<div class="expf"><input id="' + id + '" class="inp big" inputmode="numeric" autocomplete="off" placeholder="' + esc(placeholder || 'EXP เช่น 31/08/2027 (ค.ศ./พ.ศ.)') + '" value="' + esc(value || '') + '" oninput="' + onInput + '(this.value)">' +
    '<span class="calb" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>' +
    '<input type="date" class="calp" aria-label="เลือกวันหมดอายุจากปฏิทิน" onclick="try{this.showPicker()}catch(e){}" onchange="expPicked(\'' + id + '\',this.value)"></div>';
}
function expPicked(id, iso) {
  if (!iso) return;
  const p = isoParts(iso), el = $(id); if (!el) return;
  el.value = pad2(p.d) + '/' + pad2(p.m) + '/' + p.y;
  el.dispatchEvent(new Event('input', { bubbles: true }));
}
function hadTag(d) { return d.had ? '<span class="had">HAD</span>' : ''; }

/* สถานะยา — ที่เดียวทั้งระบบ (ใช้ exp_status จาก backend: <7 วัน warn, <1 วัน critical, หมดแล้ว danger) */
function flags(d) {
  return {
    done: !!(CC.done[d.id]),
    nurse: pendingFor(d.id).length > 0,
    empty: d.target > 0 && d.cur <= 0,
    expired: d.status === 'danger' || d.status === 'critical',
    near: d.status === 'warn',
    low: d.cur < d.target,
  };
}
function needsAction(d) { const f = flags(d); return f.nurse || f.empty || f.expired || f.near || f.low; }
/* สถานะ: แดง+จุด = ต้องทำ · เทา = ข้อมูล */
function statusPill(d, opts) {
  const f = flags(d);
  const act = (t) => '<span class="st act">' + t + '</span>';
  if (f.done && !(opts && opts.ignoreDone)) return '<span class="st">✓ บันทึกแล้ว</span>';
  if (f.nurse) return act('พยาบาลแจ้งขาด');
  if (f.empty) return act('ยาหมด ' + d.cur + '/' + d.target);
  if (d.status === 'danger') return act('หมดอายุแล้ว');
  if (d.status === 'critical') return act('หมดอายุวันนี้');
  if (f.near) return act('EXP ' + esc(expShort(d.exp)));
  if (f.low) return act('ขาด ' + (d.target - d.cur));
  return '';
}
function cartStats() {
  let expired = 0, near = 0, low = 0;
  APP.drugs.forEach(d => { const f = flags(d); if (f.expired) expired++; else if (f.near) near++; if (f.low) low++; });
  return { expired: expired, near: near, low: low, total: APP.drugs.length, pending: APP.pending.length };
}

/* ---------- router / nav ---------- */
const NAV = {
  pharm: [['hub', 'เวรนี้', 'home'], ['cart', 'ตรวจ/เติม', 'check'], ['record', 'บันทึกเวร', 'pen'], ['stock', 'Stock', 'box'], ['report', 'รายงาน', 'chart']],
  nurse: [['nurse', 'รับรถยา', 'check'], ['stock', 'Stock', 'box']],
};
const PAGES = {};   // name → { title, sub(), render() }
function go(name, opts) {
  if (!PAGES[name]) return;
  APP.page = name;
  document.querySelectorAll('.page').forEach(p => { p.hidden = true; });
  const el = $('pg-' + name); el.hidden = false;
  renderNav();
  setTop(name);
  $('sticky-root').innerHTML = '';
  window.scrollTo(0, 0);
  PAGES[name].render(opts || {});
}
function setTop(name) {
  const p = PAGES[name] || {};
  $('top-title').textContent = p.title || '';
  $('top-sub').textContent = p.sub ? p.sub() : '';
  $('top-act').innerHTML = p.topAction ? p.topAction() : '';
}
function renderNav() {
  const items = NAV[APP.role] || [];
  const s = APP.role === 'pharm' ? cartStats() : null;
  $('nav-in').innerHTML = items.map(([k, label, ic]) => {
    const bdg = (k === 'hub' && s && s.pending) ? '<span class="bdg">' + s.pending + '</span>' : '';
    return '<button class="nb' + (APP.page === k ? ' on' : '') + '" type="button" onclick="go(\'' + k + '\')"' + (APP.page === k ? ' aria-current="page"' : '') + '>' + svg(ic) + label + bdg + '</button>';
  }).join('');
}
function setSticky(html, col) { $('sticky-root').innerHTML = html ? '<div class="sticky no-print"><div class="sticky-in' + (col ? ' col' : '') + '">' + html + '</div></div>' : ''; }
function skeleton(n) { let h = ''; for (let i = 0; i < (n || 3); i++) h += '<div class="skel"></div>'; return h; }
function errorBox(msg, retryFn) { return '<div class="card"><div class="note err">' + esc(msg) + '</div>' + (retryFn ? '<button class="btn2" type="button" onclick="' + retryFn + '">ลองใหม่</button>' : '') + '</div>'; }

/* ---------- login ---------- */
const LOGIN = { role: 'pharm' };
function renderLogin() {
  let lastNurse = '';
  try { lastNurse = localStorage.getItem('ermc_v2_last_nurse') || ''; } catch (e) {}
  const r = LOGIN.role;
  $('pg-login').innerHTML =
    '<div class="login"><form class="login-box" onsubmit="event.preventDefault();doLogin()">' +
      '<div style="text-align:center"><div style="font-size:20px;font-weight:700">รถยาห้องฉุกเฉิน</div><div class="lbl">เข้าสู่ระบบเพื่อดำเนินการ · v2</div></div>' +
      '<div class="seg" role="group" aria-label="บทบาท">' +
        '<button type="button" class="sg' + (r === 'pharm' ? ' on' : '') + '" onclick="LOGIN.role=\'pharm\';renderLogin()">เภสัชกร</button>' +
        '<button type="button" class="sg' + (r === 'nurse' ? ' on' : '') + '" onclick="LOGIN.role=\'nurse\';renderLogin()">พยาบาล ER</button>' +
      '</div>' +
      (r === 'pharm'
        ? '<div><label class="fl" for="lg-name">ชื่อเภสัชกร</label><select id="lg-name" class="inp" oninput="loginReady()"><option value="">— เลือกชื่อ —</option>' + PHARMACISTS.map(n => '<option>' + esc(n) + '</option>').join('') + '</select></div>'
        : '<div><label class="fl" for="lg-name">ชื่อพยาบาลผู้ตรวจรถยา</label><input id="lg-name" class="inp" autocomplete="name" value="' + esc(lastNurse) + '" oninput="loginReady()" placeholder="ชื่อ-นามสกุล"></div>') +
      '<div><label class="fl" for="lg-pw">รหัสผ่านฝั่ง' + (r === 'pharm' ? 'เภสัช' : 'พยาบาล') + '</label>' +
        '<div class="pw"><input id="lg-pw" class="inp" type="password" autocomplete="current-password" oninput="loginReady()">' +
        '<button type="button" class="lnk muted" onclick="const i=$(\'lg-pw\');i.type=i.type===\'password\'?\'text\':\'password\';this.textContent=i.type===\'password\'?\'แสดง\':\'ซ่อน\'">แสดง</button></div></div>' +
      '<div id="lg-err" class="err-txt" role="alert"></div>' +
      '<button id="lg-btn" class="btn" type="submit" disabled>เข้าสู่ระบบ</button>' +
      '<div class="lbl" style="text-align:center">ไม่มีการเก็บรหัสในอุปกรณ์ · ระบบบันทึกเวลาอัตโนมัติ</div>' +
    '</form></div>';
  loginReady();
}
function loginReady() { const ok = $('lg-pw').value.length > 0 && $('lg-name').value.trim().length > 0; $('lg-btn').disabled = !ok; }
async function doLogin() {
  const btn = $('lg-btn'), err = $('lg-err');
  const name = $('lg-name').value.trim(), pw = $('lg-pw').value, role = LOGIN.role;
  err.textContent = '';
  setBusy(btn, true, 'กำลังตรวจสอบ…');
  try {
    const res = await api('checkPassword', { role: role, password: pw });
    if (!(res && res.success)) { setBusy(btn, false); err.textContent = 'รหัสผ่านไม่ถูกต้อง'; $('lg-pw').value = ''; loginReady(); return; }
    btn.innerHTML = 'กำลังโหลดข้อมูล…';
    APP.role = role; APP.user = name;
    if (role === 'nurse') { try { localStorage.setItem('ermc_v2_last_nurse', name); } catch (e) {} }
    const stP = role === 'pharm' ? api('getTodayShiftState', { pharmacist: name }).catch(() => null) : null;
    const pdP = role === 'pharm' ? loadPending() : null;
    await loadDrugs();
    if (role === 'pharm') {
      const st = await stP; await pdP;
      rehydrate(st);
    }
  } catch (e) {
    APP.role = null;
    setBusy(btn, false); err.textContent = e.message; return;
  }
  $('pg-login').hidden = true;
  $('top').hidden = false; $('nav').hidden = false;
  go(role === 'pharm' ? 'hub' : 'nurse');
}
async function doLogout(skipConfirm) {
  if (!skipConfirm && !(await confirmSheet({ title: 'ออกจากระบบ?', sub: 'ข้อมูลที่ยังไม่บันทึกในหน้าบันทึกเวรเก็บเป็นร่างไว้ในเครื่องนี้', ok: 'ออกจากระบบ' }))) return;
  location.reload();
}

/* ============================================================
   เวรนี้ (shift hub)
   ============================================================ */
const HUB = { feedOpen: false, feed: null };

PAGES.hub = {
  title: 'เวรนี้',
  sub: () => APP.user + ' · ' + thDow(bkkToday()) + ' ' + thDate(bkkToday()) + ' · ' + bkkTime(),
  topAction: () => '<button class="chip" type="button" onclick="doLogout()">ออกจากระบบ</button>',
  render: () => { renderHub(); loadPending().then(() => { if (APP.page === 'hub') { renderHub(); renderNav(); } }); },
};

function setTech(v) { APP.tech = v; saveDraft(); }

function hubGate() {
  const s = cartStats(), left = [];
  if (s.pending) left.push('แจ้งขาดจากพยาบาล ' + s.pending + ' รายการ');
  if (s.low) left.push('เติมไม่ครบ ' + s.low + ' รายการ');
  if (!APP.shift.cartSubmitted) left.push('ยังไม่ยืนยันการตรวจรถ');
  if (!APP.shift.saved) left.push('ยังไม่บันทึกเวร');
  return left;
}

function renderHub() {
  const s = cartStats();
  const doneN = Object.keys(CC.done).length;
  const left = hubGate();
  const pend = APP.pending;

  let h = '';
  h += '<section class="card" style="gap:6px"><label class="lbl" for="hub-tech">จพ.เภสัชประจำเวร — เลือกครั้งเดียว ใช้ทั้งเวร</label>' +
       '<select id="hub-tech" class="inp" onchange="setTech(this.value)"><option value="">— ไม่ระบุ —</option>' +
       TECHS.map(t => '<option' + (APP.tech === t ? ' selected' : '') + '>' + esc(t) + '</option>').join('') + '</select></section>';

  h += '<div class="kpis">' +
    kpiBtn('หมดอายุ', s.expired, "go('stock',{filter:'expired'})") +
    kpiBtn('ใกล้ EXP', s.near, "go('stock',{filter:'near'})") +
    kpiBtn('เติมไม่ครบ', s.low, "go('cart',{filter:'need'})") + '</div>';

  if (pend.length) {
    h += '<section class="card" style="padding:0;gap:0"><div style="padding:12px 14px 4px"><span class="h">พยาบาลแจ้งขาด · ' + pend.length + '</span> <span class="lbl">ต้องเคลียร์ก่อนปิดเวร</span></div>' +
      pend.map((p, i) => {
        const d = drugById(p.drug_id) || { name: p.drug_name, cart_pos: '', location: p.location, unit: p.unit };
        return '<div class="gr" style="align-items:flex-start;border-top:1px solid #eef0f3"><span class="grow"><span class="nm">' + esc(d.name || p.drug_name) + '</span>' + hadTag(d) +
          '<br>' + locPill(d, true) +
          '<span style="display:block;margin-top:4px"><span class="missp">ขาด ' + esc(p.miss_qty || '?') + '</span> <span class="lbl">' + esc(p.nurse_name || '—') + ' ' + tsTime(p.timestamp) + (p.miss_note ? ' · ' + esc(p.miss_note) : '') + '</span></span></span>' +
          '<span style="display:flex;flex-direction:column;gap:6px;flex:none"><button class="go" type="button" onclick="go(\'cart\',{open:\'' + esc(p.drug_id) + '\'})">ไปเติม</button>' +
          '<button class="go2" type="button" onclick="ackVerified(' + i + ',this)">ยาครบ ไม่ต้องเติม</button></span></div>';
      }).join('') + '</section>';
  }

  const step1 = APP.shift.cartSubmitted ? 'ok' : (doneN > 0 ? 'cur' : '');
  const step2 = APP.shift.saved ? 'ok' : '';
  h += '<section class="card" style="padding-bottom:4px"><div class="h">งานในเวร</div>' +
    stepRow(1, step1, 'ตรวจ / เติมรถยา',
      APP.shift.cartSubmitted ? 'ยืนยันแล้ว' + (APP.shift.cartSummary && APP.shift.cartSummary.time ? ' ' + APP.shift.cartSummary.time : '') + (s.low ? ' · ยังเติมไม่ครบ ' + s.low : ' · เติมครบ')
        : (doneN ? 'บันทึกแล้ว ' + doneN + ' รายการ' : 'ตรวจของในรถตามชั้น') + (s.low ? ' · เติมไม่ครบ ' + s.low : '') + ' · แล้วกดยืนยัน',
      "go('cart')") +
    stepRow(2, step2, 'บันทึกเวร',
      APP.shift.saved ? 'บันทึกแล้ว' + (APP.shift.savedAt ? ' ' + APP.shift.savedAt : '') + ' · ใบสั่ง ' + (APP.shift.rxTotal != null ? APP.shift.rxTotal : '?') + ' · แก้ไขได้' : 'ใบสั่งยา · ยาหาย · ความเสี่ยง · Med error',
      "go('record')") +
    '<div class="step"><span class="sdot' + (left.length ? '' : ' cur') + '">3</span><span class="grow"><span style="display:block;font-size:15px;font-weight:600">ปิดเวร</span><span class="lbl">' + (left.length ? 'เหลือ: ' + esc(left.join(' · ')) : 'พร้อมปิดเวร') + '</span></span></div>' +
  '</section>';

  h += '<button class="btn" type="button" onclick="closeShift()"' + (left.length ? ' disabled' : '') + '>ปิดเวร</button>';

  h += '<section class="card" style="padding:4px 16px"><button class="step" type="button" style="border:0;justify-content:space-between" onclick="toggleFeed()" aria-expanded="' + HUB.feedOpen + '">' +
       '<span style="font-size:14px;font-weight:600">กิจกรรมล่าสุดวันนี้</span><span class="lbl">' + (HUB.feedOpen ? 'ซ่อน' : 'แสดง') + ' ›</span></button>' +
       (HUB.feedOpen ? '<div id="hub-feed" class="feed" style="padding-bottom:12px">' + feedHtml() + '</div>' : '') + '</section>';

  $('pg-hub').innerHTML = '<div class="wrap">' + h + '</div>';
}
function kpiBtn(label, n, onclick) {
  return '<button class="kc" type="button" onclick="' + onclick + '"><span class="lbl" style="display:block">' + label + '</span><span class="kn">' + n + (n ? '<span class="kdot"></span>' : '') + '</span></button>';
}
function stepRow(n, state, title, line, onclick) {
  return '<button class="step" type="button" onclick="' + onclick + '"><span class="sdot ' + state + '">' + (state === 'ok' ? svg('tick', 16, 'currentColor', 2.4) : n) + '</span>' +
    '<span class="grow"><span style="display:block;font-size:15px;font-weight:600">' + title + '</span><span class="lbl">' + esc(line) + '</span></span><span class="lbl">›</span></button>';
}
async function ackVerified(i, btn) {
  const p = APP.pending[i]; if (!p) return;
  const ok = await confirmSheet({ title: 'ยืนยันว่ายาครบ ไม่ต้องเติม?', sub: (p.drug_name || '') + ' — พยาบาลแจ้งขาด ' + (p.miss_qty || '?') + ' แต่ตรวจแล้วยาในรถครบ', ok: 'ยาครบ ไม่ต้องเติม' });
  if (!ok) return;
  setBusy(btn, true, '…');
  try {
    const r = await api('ackNurseAlert', { drug_id: p.drug_id, nurse_shift_id: p.shift_id, pharmacist_name: APP.user, resolution: 'verified', note: '' });
    if (r && r.success === false) throw new Error(r.message || 'บันทึกไม่สำเร็จ');
    toast('ปิดรายการแจ้งขาดแล้ว');
    await loadPending(); renderHub(); renderNav();
  } catch (e) { setBusy(btn, false); toast(e.message, 'err'); }
}
function toggleFeed() {
  HUB.feedOpen = !HUB.feedOpen; renderHub();
  if (HUB.feedOpen) {
    api('getRecentActivity', { limit: 8 }).then(items => { HUB.feed = (items || []).filter(it => tsDate(it.timestamp) === bkkToday() || !it.timestamp); if (APP.page === 'hub' && HUB.feedOpen) $('hub-feed').innerHTML = feedHtml(); })
      .catch(() => { HUB.feed = []; if ($('hub-feed')) $('hub-feed').innerHTML = '<div class="lbl">โหลดกิจกรรมไม่ได้</div>'; });
  }
}
function feedHtml() {
  if (HUB.feed == null) return '<div class="lbl">กำลังโหลด…</div>';
  if (!HUB.feed.length) return '<div class="lbl">ยังไม่มีกิจกรรมวันนี้</div>';
  return HUB.feed.map(it => '<div class="feed-it"><span class="t">' + tsTime(it.timestamp) + '</span><span>' + escB(it.text) + '</span></div>').join('');
}
async function closeShift() {
  if (hubGate().length) return;
  const s = APP.shift.cartSummary || {};
  const body = ckRow('ตรวจ / เติมรถยา', 'ยืนยันแล้ว' + (s.time ? ' ' + s.time : '') + ' · เติมครบ') +
    ckRow('บันทึกเวร', 'บันทึกแล้ว' + (APP.shift.savedAt ? ' ' + APP.shift.savedAt : '') + ' · ใบสั่ง ' + (APP.shift.rxTotal != null ? APP.shift.rxTotal : '?')) +
    ckRow('แจ้งขาดจากพยาบาล', 'เคลียร์ครบ');
  if (await confirmSheet({ title: 'ปิดเวรและออกจากระบบ?', sub: 'ตรวจสรุปก่อนส่งต่อเวร', body: body, ok: 'ปิดเวร' })) doLogout(true);
}
function ckRow(t, l) { return '<div class="ck"><span class="ic" style="background:var(--ink);color:#fff">' + svg('tick', 16, 'currentColor', 2.4) + '</span><span><span style="display:block;font-size:15px;font-weight:600">' + esc(t) + '</span><span class="lbl">' + esc(l) + '</span></span></div>'; }


/* ============================================================
   ตรวจ / เติมรถยา — ห้องยาเป็นคนเติม
   ① นับยาที่เห็นในรถ (ค่าเริ่ม = ในระบบ) → ระบบคิดที่ขาด (ยังไม่ตัดสินว่ามีใบสั่งหรือไม่ — ทำที่บันทึกเวร)
   ② เติมกลับ = ให้ครบเป้าหมาย · default ล็อตที่ RESTOCK ล่าสุด · หรือกรอก EXP ล็อตอื่น
   ============================================================ */
const CC = { lots: {}, st: {}, done: {}, log: [], filter: 'all', q: '', open: null, inflight: {}, logOpen: false };

PAGES.cart = {
  title: 'ตรวจ / เติมรถยา',
  sub: () => 'แตะเฉพาะยาที่ขาดหรือใกล้หมดอายุ · ที่ไม่แตะ = ครบ',
  render: (o) => {
    if (o.filter) CC.filter = o.filter;
    if (o.open) { CC.open = o.open; if (!ccVisible(drugById(o.open))) { CC.filter = 'all'; CC.q = ''; } ccLoad(o.open); }
    renderCart();
    loadTodayLog();
    if (o.open) setTimeout(() => { const el = $('cc-' + o.open); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, 60);
  },
};

function ccNeedList() { return APP.drugs.filter(d => needsAction(d) || CC.done[d.id]); }
function ccVisible(d) {
  if (!d) return false;
  const f = flags(d);
  if (CC.q && !String(d.name).toLowerCase().includes(CC.q.toLowerCase())) return false;
  switch (CC.filter) {
    case 'need': return needsAction(d);
    case 'nurse': return f.nurse;
    case 'exp': return f.expired || f.near;
    case 'done': return f.done;
    default: return true;
  }
}
function renderCart() {
  const cnt = {
    need: APP.drugs.filter(needsAction).length, nurse: APP.drugs.filter(d => flags(d).nurse).length,
    exp: APP.drugs.filter(d => { const f = flags(d); return f.expired || f.near; }).length,
    done: Object.keys(CC.done).length, all: APP.drugs.length,
  };
  const s = cartStats();
  const flagged = APP.drugs.filter(needsAction).length;
  let h = '<section class="card" style="gap:6px"><div class="lbl" style="font-size:13px">' + (flagged ? 'ระบบแจ้งให้ดู ' + flagged + ' รายการ (ยาหมด ' + APP.drugs.filter(d => flags(d).empty).length + ' · ใกล้ EXP/หมดอายุ ' + cnt.exp + ' · พยาบาลแจ้ง ' + cnt.nurse + ' · ไม่ครบ ' + s.low + ') — กดตัวกรอง "ระบบแจ้ง" เพื่อดูเฉพาะรายการนี้' : 'ระบบไม่พบรายการที่ต้องดูเป็นพิเศษ — ตรวจของจริงตามชั้นได้เลย') + '</div></section>';

  h += '<div style="position:relative"><label for="cc-q" class="sr">ค้นหาชื่อยา</label>' +
    '<input id="cc-q" class="inp" placeholder="ค้นหาชื่อยา" value="' + esc(CC.q) + '" oninput="CC.q=this.value;renderCartList()" style="padding-left:38px">' +
    '<span style="position:absolute;left:12px;top:12px">' + svg('search', 18, '#5b6280', 2) + '</span></div>';

  h += '<div class="chips" role="group" aria-label="ตัวกรอง">' +
    [['all', 'ทั้งหมด'], ['need', 'ระบบแจ้ง'], ['nurse', 'พยาบาลแจ้ง'], ['exp', 'ใกล้ EXP'], ['done', 'บันทึกแล้ว']]
      .map(([k, l]) => '<button type="button" class="chip' + (CC.filter === k ? ' on' : '') + '" aria-pressed="' + (CC.filter === k) + '" onclick="CC.filter=\'' + k + '\';renderCart()">' + l + ' <b>' + cnt[k] + '</b></button>').join('') + '</div>';

  h += '<div id="cc-list" style="display:flex;flex-direction:column;gap:10px"></div>';
  h += '<div id="cc-log"></div>';
  $('pg-cart').innerHTML = '<div class="wrap">' + h + '</div>';
  renderCartList();
  renderCartLog();
  setSticky('<div class="grow"><div style="font-size:14px;font-weight:700">บันทึกแล้ว ' + cnt.done + ' รายการ</div><div class="lbl">' +
    (APP.shift.cartSubmitted ? 'ยืนยันแล้ว · ยืนยันซ้ำได้' : s.low ? 'ยังเติมไม่ครบ ' + s.low + ' รายการ' : 'พร้อมยืนยัน') + '</div></div>' +
    '<button class="btn sm" type="button" onclick="confirmCartCheck(this)">ยืนยันการตรวจรถ</button>');
}
function renderCartList() {
  const list = APP.drugs.slice().sort(byPos).filter(ccVisible);
  if (CC.open && !list.find(d => d.id === CC.open)) { const od = drugById(CC.open); if (od) list.unshift(od); }
  if (!list.length) { $('cc-list').innerHTML = '<div class="empty">— ไม่มีรายการในตัวกรองนี้ —' + (CC.filter === 'need' ? '<br>ระบบไม่พบรายการที่ต้องดู — กด "ทั้งหมด" เพื่อตรวจตามชั้น' : '') + '</div>'; return; }
  let h = '', last = null, inGroup = false;
  const closeG = () => { if (inGroup) { h += '</div>'; inGroup = false; } };
  list.forEach(d => {
    const k = shelfKey(d);
    if (k !== last) { closeG(); h += '<div class="shelf">' + esc(shelfName(k)) + '</div>'; last = k; }
    if (CC.open === d.id) { closeG(); h += ccCardOpen(d); }
    else { if (!inGroup) { h += '<div class="group">'; inGroup = true; } h += ccCardClosed(d); }
  });
  closeG();
  $('cc-list').innerHTML = h;
}
function ccCardClosed(d) {
  const f = flags(d);
  return '<button id="cc-' + d.id + '" class="gr' + (f.done ? ' done' : '') + '" type="button" onclick="ccToggle(\'' + d.id + '\')">' +
    '<span class="grow"><span class="nm">' + esc(d.name) + '</span>' + hadTag(d) + '<br>' + locPill(d, false) +
    (f.done && CC.done[d.id].line ? '<span class="lbl" style="display:block;margin-top:2px">' + esc(CC.done[d.id].line) + '</span>' : '') + '</span>' +
    statusPill(d) + '</button>';
}
function ccToggle(id) {
  CC.open = CC.open === id ? null : id;
  if (CC.open) ccLoad(id);
  renderCartList();
  if (CC.open) setTimeout(() => { const el = $('cc-' + id); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, 40);
}
async function ccLoad(id) {
  if (!CC.st[id]) CC.st[id] = { counts: {}, wd: {}, refill: null, mode: 'latest', expRaw: '', loaded: false, err: null };
  const st = CC.st[id];
  if (st.loaded) return;
  try {
    const res = await api('getStockByDrug', { drug_id: id });
    const lots = (Array.isArray(res) ? res : (res && res.data) || []).filter(l => num(l.available_qty) > 0)
      .map(l => ({ exp: String(l.exp_date || '').slice(0, 10), avail: num(l.available_qty), lastRestock: String(l.last_restock_at || '') }));
    CC.lots[id] = lots;
    lots.forEach(l => { if (st.counts[l.exp] == null) st.counts[l.exp] = l.avail; });
    st.loaded = true; st.err = null;
  } catch (e) { st.err = e.message; }
  if (APP.page === 'cart' && CC.open === id) renderCartList();
}
/* ล็อตที่ RESTOCK เข้ารถครั้งล่าสุด (ไม่นับล็อตที่กำลังถอน) · ไม่มีข้อมูลเวลา → EXP ไกลสุด */
function ccLatestLot(id) {
  const today = bkkToday();
  const st = CC.st[id], lots = (CC.lots[id] || []).filter(l => !st.wd[l.exp] && daysBetween(today, l.exp) >= 0);   // ไม่เติมเข้าล็อตที่ถอนหรือหมดอายุแล้ว
  if (!lots.length) return null;
  return lots.slice().sort((a, b) => (b.lastRestock || '').localeCompare(a.lastRestock || '') || b.exp.localeCompare(a.exp))[0];
}
function ccCalc(id) {
  const d = drugById(id), st = CC.st[id], lots = CC.lots[id] || [];
  let disp = 0, wd = 0;
  const dispItems = [], wdItems = [];
  lots.forEach(l => {
    const c = Math.min(l.avail, Math.max(0, num(st.counts[l.exp])));
    const miss = l.avail - c;
    if (miss > 0) { disp += miss; dispItems.push({ exp: l.exp, qty: miss }); }
    if (st.wd[l.exp] && c > 0) { wd += c; wdItems.push({ exp: l.exp, qty: c }); }
  });
  const out = disp + wd;
  const after = Math.max(0, d.cur - out);
  const suggested = Math.max(0, d.target - after);
  const refill = st.refill == null ? suggested : st.refill;
  const latest = ccLatestLot(id);
  const mode = latest ? st.mode : 'other';
  const parsed = mode === 'other' ? parseExpInput(st.expRaw, bkkToday()) : null;
  const refillExp = mode === 'latest' ? (latest && latest.exp) : (parsed && parsed.ok ? parsed.iso : '');
  return { d: d, disp: disp, wd: wd, out: out, after: after, suggested: suggested, refill: refill, latest: latest, mode: mode, parsed: parsed, refillExp: refillExp, dispItems: dispItems, wdItems: wdItems };
}
function ccCardOpen(d) {
  const st = CC.st[d.id] || {};
  const head = '<button class="cc-hd" type="button" onclick="ccToggle(\'' + d.id + '\')" aria-expanded="true">' +
    '<span class="grow"><span class="nm" style="font-size:15px">' + esc(d.name) + '</span>' + hadTag(d) + '<br>' + locPill(d, true) + '<span class="lbl" style="display:block;margin-top:2px">เป้า ' + d.target + ' ' + esc(d.unit) + ' · ในระบบ ' + d.cur +
    pendingFor(d.id).map(p => ' · <span style="color:var(--red);font-weight:600">พยาบาลแจ้งขาด ' + esc(p.miss_qty) + '</span>').join('') + '</span></span></button>';
  if (st.err) return '<section id="cc-' + d.id + '" class="cc">' + head + '<div class="cc-in"><div class="note err">โหลดข้อมูลล็อตไม่ได้: ' + esc(st.err) + '</div><button class="btn2" type="button" onclick="CC.st[\'' + d.id + '\'].err=null;ccLoad(\'' + d.id + '\');renderCartList()">ลองใหม่</button></div></section>';
  if (!st.loaded) return '<section id="cc-' + d.id + '" class="cc">' + head + '<div class="cc-in"><div class="skel" style="height:96px"></div></div></section>';
  const c = ccCalc(d.id), lots = CC.lots[d.id] || [];
  const id = d.id;
  let h = '<section id="cc-' + id + '" class="cc">' + head + '<div class="cc-in" style="gap:8px">';

  /* ล็อต: วันหมดอายุ + จำนวนที่เห็น (ค่าเริ่ม = ในระบบ) · แถวแดง = ขาด · แถวเหลือง = ถอน */
  if (!lots.length) h += '<div class="lbl">ยังไม่มียานี้ในระบบ — กรอก EXP ของยาที่เติมด้านล่าง</div>';
  h += '<div>';
  lots.forEach((l) => {
    const cnt = Math.min(l.avail, Math.max(0, num(st.counts[l.exp])));
    const miss = l.avail - cnt;
    const days = daysBetween(bkkToday(), l.exp);
    const wdOn = !!st.wd[l.exp];
    const expTag = days < 0 ? ' <span class="lbl" style="color:var(--red);font-weight:600">หมดอายุแล้ว</span>' : days < 7 ? ' <span class="lbl" style="color:var(--red);font-weight:600">อีก ' + days + ' วัน</span>' : '';
    const tag = expTag + (wdOn ? '<br><span style="font-size:13px;color:var(--sub)">ถอนออก ' + cnt + '</span>'
      : miss > 0 ? '<br><span style="font-size:13px;color:var(--red);font-weight:600">ขาด ' + miss + '</span>' : '');
    const canWd = wdOn || days < 30;
    h += '<div class="lotr' + (wdOn ? ' wd' : miss > 0 ? ' miss' : '') + '"><span class="grow"><span class="nm expd" style="font-size:15px">EXP ' + esc(expFull(l.exp)) + '</span>' + tag +
      (canWd ? (wdOn ? ' · ' : '<br>') + '<button class="lnk muted" type="button" style="font-size:12px;min-height:28px" onclick="ccWd(\'' + id + '\',\'' + l.exp + '\')">' + (wdOn ? 'ยกเลิก' : 'ถอนล็อตนี้') + '</button>' : '') + '</span>' +
      qtyCtl(cnt, "ccCount('" + id + "','" + l.exp + "',-1)", "ccCount('" + id + "','" + l.exp + "',1)", { min: 0, max: l.avail, unit: '/ ' + l.avail }) + '</div>';
  });
  h += '</div>';

  /* เติมกลับ: แสดงเฉพาะเมื่อมีของออก/ต้องเติม */
  const editing = !!st.editRefill;
  if (c.refill > 0 || c.out > 0 || st.refill != null) {
    const afterN = c.after + c.refill;
    const lotTxt = c.mode === 'latest' && c.latest ? 'ล็อต ' + expFull(c.latest.exp) : 'ล็อตใหม่';
    h += '<div class="refill row" style="border-top:1px solid #eef0f3;padding-top:10px"><span class="grow">เติม <b>' + c.refill + ' ' + esc(d.unit) + '</b> → ' + esc(lotTxt) +
      (afterN < d.target ? '<span class="lbl" style="display:block;color:var(--red)">หลังเติม ' + afterN + '/' + d.target + ' ยังไม่ครบ</span>' : '') + '</span>' +
      (editing ? '' : '<button class="lnk" type="button" onclick="ccEditRefill(\'' + id + '\')">แก้</button>') + '</div>';
    if (editing) {
      h += '<div class="row"><span class="lbl grow">จำนวนที่เติม</span>' + qtyCtl(c.refill, "ccRefill('" + id + "',-1)", "ccRefill('" + id + "',1)", { min: 0, unit: d.unit }) + '</div>';
      if (c.latest) h += '<div class="seg" role="group" aria-label="ล็อตที่เติม">' +
        '<button class="sg' + (c.mode === 'latest' ? ' on' : '') + '" type="button" onclick="ccMode(\'' + id + '\',\'latest\')">ล็อตล่าสุด</button>' +
        '<button class="sg' + (c.mode === 'other' ? ' on' : '') + '" type="button" onclick="ccMode(\'' + id + '\',\'other\')">ล็อตอื่น</button></div>';
    }
    if (c.mode === 'other' && c.refill > 0) {
        h += '<div><label class="lbl" for="cc-exp-' + id + '">EXP ล็อตที่เติม (ค.ศ. หรือ พ.ศ.)</label><div style="margin-top:6px">' +
          expField('cc-exp-' + id, st.expRaw, "ccExp.bind(null,'" + id + "')") + '</div>' +
          '<div id="cc-expout-' + id + '">' + ccExpOut(c.parsed) + '</div></div>';
    }
  }

  const blocked = ccBlocked(c);
  h += '<button id="cc-save-' + id + '" class="btn" type="button" style="margin-top:4px" onclick="ccSave(\'' + id + '\',this)"' + (blocked ? ' disabled' : '') + '>' + esc(ccSaveLabel(c)) + '</button>';
  h += '</div></section>';
  return h;
}
function ccEditRefill(id) { CC.st[id].editRefill = true; renderCartList(); }
function leftText(days) {
  if (days < 60) return 'อีก ' + days + ' วัน';
  const m = Math.round(days / 30.44), y = Math.floor(m / 12), mm = m % 12;
  return 'อีก ' + (y ? y + ' ปี' + (mm ? ' ' : '') : '') + (mm ? mm + ' เดือน' : '');
}
function ccExpOut(p) {
  if (!p || p.empty) return '';
  if (!p.ok) return '<div class="note err" style="margin-top:8px">' + esc(p.msg) + '</div>';
  if (p.level === 'ok') return '<div style="font-size:13px;color:var(--sub);margin-top:6px">✓ อ่านว่า ' + expReadout(p) + '</div>';
  return '<div class="note ' + (p.level === 'block' ? 'err' : 'warn') + '" style="margin-top:8px"><span>' + expReadout(p) + '<br>' + esc(p.msg) + '</span></div>';
}
function ccBlocked(c) {
  if (c.refill > 0 && c.mode === 'other') return !(c.parsed && c.parsed.ok && c.parsed.level !== 'block');
  if (c.refill > 0 && c.mode === 'latest' && !c.refillExp) return true;
  return false;
}
function ccSaveLabel(c) {
  if (!c.out && !c.refill) return pendingFor(c.d.id).length ? 'ตรวจแล้ว ของครบ' : 'ตรวจแล้ว ครบ';
  const parts = [];
  if (c.disp) parts.push('ขาด ' + c.disp);
  if (c.wd) parts.push('ถอน ' + c.wd);
  if (c.refill) parts.push('เติม ' + c.refill);

}
function ccCount(id, exp, delta) { const st = CC.st[id]; const l = (CC.lots[id] || []).find(x => x.exp === exp); if (!l) return; st.counts[exp] = Math.min(l.avail, Math.max(0, num(st.counts[exp]) + delta)); st.refill = null; renderCartList(); }
function ccWd(id, exp) { const st = CC.st[id]; st.wd[exp] = !st.wd[exp]; st.refill = null; renderCartList(); }
function ccRefill(id, delta) { const st = CC.st[id]; const c = ccCalc(id); st.refill = Math.max(0, c.refill + delta); renderCartList(); }
function ccMode(id, m) { CC.st[id].mode = m; renderCartList(); if (m === 'other') setTimeout(() => { const i = $('cc-exp-' + id); if (i) i.focus(); }, 30); }
function ccExp(id, v) {
  CC.st[id].expRaw = v;
  const c = ccCalc(id);
  $('cc-expout-' + id).innerHTML = ccExpOut(c.parsed);
  const b = $('cc-save-' + id); if (b) { b.disabled = ccBlocked(c); b.textContent = ccSaveLabel(c); }
}
async function ccSave(id, btn) {
  if (CC.inflight[id]) return;
  const c = ccCalc(id), d = c.d;
  if (ccBlocked(c)) return;
  if (c.mode === 'other' && c.refill > 0 && c.parsed.level === 'warn') {
    if (!(await confirmSheet({ title: 'ยืนยัน EXP นี้?', body: '<div class="note warn"><span>' + expReadout(c.parsed) + '<br>' + esc(c.parsed.msg) + '</span></div>', ok: 'ถูกต้อง บันทึก' }))) return;
  }
  CC.inflight[id] = true;
  setBusy(btn, true);
  const who = APP.user, log = (action, qty, exp, r) => CC.log.unshift({ id: uid(), drug_id: id, name: d.name, unit: d.unit, action: action, qty: qty, exp: exp, ts: r && r.timestamp, row: r && r.row_num, voided: false });
  let wrote = 0;
  try {
    for (const it of c.dispItems) { const r = await api('saveDispense', { pharmacistName: who, drug_id: id, qty_dispensed: it.qty, exp_date: it.exp, purpose: '', rx_number: '' }); log('DISPENSE', it.qty, it.exp, r); wrote++; }
    for (const it of c.wdItems) { const r = await api('saveWithdraw', { pharmacistName: who, drug_id: id, qty_withdrawn: it.qty, exp_date: it.exp }); log('WITHDRAW', it.qty, it.exp, r); wrote++; }
    if (c.refill > 0) { const r = await api('saveRestock', { pharmacistName: who, drug_id: id, qty_added: c.refill, lot_number: '', exp_date: c.refillExp }); log('RESTOCK', c.refill, c.refillExp, r); wrote++; }
    if (!wrote) {   // ไม่มีการเคลื่อนไหว — ถ้ามีแจ้งขาดค้าง ปิดเป็น "ตรวจแล้ว ของครบ"
      for (const p of pendingFor(id)) await api('ackNurseAlert', { drug_id: id, nurse_shift_id: p.shift_id, pharmacist_name: who, resolution: 'verified', note: 'ตรวจในหน้าตรวจ/เติม v2' });
    }
    const parts = [];
    if (c.disp) parts.push('ขาด ' + c.disp); if (c.wd) parts.push('ถอน ' + c.wd); if (c.refill) parts.push('เติม ' + c.refill + (c.refillExp ? ' (EXP ' + expFull(c.refillExp) + ')' : ''));
    CC.done[id] = { line: parts.length ? parts.join(' · ') : 'ตรวจแล้ว ครบ', at: bkkTime() };
    delete CC.st[id]; delete CC.lots[id];
    CC.open = null;
    toast('บันทึก ' + d.name + ' แล้ว');
  } catch (e) {
    toast('บันทึกไม่สำเร็จ: ' + e.message + (wrote ? ' — บางรายการบันทึกไปแล้ว ดูใน "บันทึกวันนี้"' : ''), 'err');
    if (wrote) { delete CC.st[id]; delete CC.lots[id]; CC.open = null; }
    else setBusy(btn, false);
  } finally { CC.inflight[id] = false; }
  try { await Promise.all([loadDrugs(), loadPending()]); } catch (e) {}
  if (APP.page === 'cart') renderCart();
  renderNav();
  loadTodayLog();
}

/* ---------- บันทึกวันนี้ — ดึงจากฐานข้อมูล (getTodayStockLog) · แก้/ลบได้แม้รีเฟรชหรือเปลี่ยนเครื่อง ---------- */
const ACT_ORDER = { DISPENSE: 0, WITHDRAW: 1, RESTOCK: 2 };
const TL = { rows: null, err: null, unavailable: false, scope: 'mine', voided: [] };
async function loadTodayLog() {
  try {
    const r = await api('getTodayStockLog', {});
    if (Array.isArray(r)) { TL.rows = r; TL.unavailable = false; } else { TL.rows = []; TL.unavailable = true; }   // edge ยังไม่ deploy → ใช้รายการในหน้าเว็บแทน
    TL.err = null;
  } catch (e) { TL.err = e.message; }
  if (APP.page === 'cart') renderCartLog();
}
function tlGroups() {
  const rows = (TL.rows || []).filter(r => TL.scope === 'all' || r.pharmacist_name === APP.user);
  const g = [];
  rows.forEach(r => {
    const t = Date.parse(String(r.timestamp).replace(' ', 'T')) || 0, last = g[g.length - 1];
    if (last && last.drug_id === r.drug_id && last.by === r.pharmacist_name && Math.abs(t - last.t) <= 120000) { last.rows.push(r); last.t = t; }
    else g.push({ key: 'g' + r.row_num, drug_id: r.drug_id, by: r.pharmacist_name, t: t, time: tsTime(r.timestamp), rows: [r] });
  });
  g.forEach(x => x.rows.sort((a, b) => ACT_ORDER[a.action] - ACT_ORDER[b.action]));
  return g.reverse();
}
function tlLine(r) { return ACT_TH[r.action] + ' ' + r.qty + (r.exp_date ? ' · ล็อต ' + expFull(r.exp_date) : ''); }
function renderCartLog() {
  const el = $('cc-log'); if (!el) return;
  if (TL.unavailable) { renderSessionLog(); return; }
  if (TL.rows == null && !TL.err) { el.innerHTML = ''; return; }
  const groups = tlGroups();
  let h = '<section class="card" style="padding:0;gap:0"><div class="row" style="padding:12px 14px 8px"><span class="h grow">บันทึกวันนี้</span><span class="lbl">' + groups.length + ' รายการ</span></div>' +
    '<div class="row" style="padding:0 14px 10px;gap:6px;flex-wrap:wrap">' +
    '<button class="chip' + (TL.scope === 'mine' ? ' on' : '') + '" type="button" onclick="TL.scope=\'mine\';renderCartLog()">ของฉัน</button>' +
    '<button class="chip' + (TL.scope === 'all' ? ' on' : '') + '" type="button" onclick="TL.scope=\'all\';renderCartLog()">ทุกคนวันนี้</button>' +
    '<span class="lbl" style="margin-left:auto">ดึงจากระบบ · รีเฟรชไม่หาย</span></div>';
  if (TL.err) h += '<div style="padding:0 14px 12px"><div class="note err">โหลดไม่ได้: ' + esc(TL.err) + '</div></div>';
  else if (!groups.length && !TL.voided.length) h += '<div class="lbl" style="padding:4px 14px 14px">ยังไม่มีรายการวันนี้</div>';
  groups.forEach(g => {
    const d = drugById(g.drug_id) || { name: g.drug_id, location: '', cart_pos: '' };
    const mine = g.by === APP.user;
    h += '<div class="gr" style="align-items:flex-start;border-top:1px solid #eef0f3"><span class="lbl" style="width:40px;flex:none;font-size:13px;padding-top:1px">' + g.time + '</span>' +
      '<span class="grow"><span class="nm">' + esc(d.name) + '</span>' + hadTag(d) + (d.cart_pos || d.location ? '<br>' + locPill(d, true) : '') +
      g.rows.map(r => '<span style="display:block;font-size:13px;color:var(--sub);margin-top:4px">' + esc(tlLine(r)) + '</span>').join('') +
      (TL.scope === 'all' && !mine ? '<span class="lbl" style="display:block;margin-top:2px">โดย ' + esc(g.by || '—') + '</span>' : '') + '</span>' +
      (mine ? '<button class="go2" type="button" onclick="tlEdit(\'' + g.key + '\')">แก้</button>' : '') + '</div>';
  });
  TL.voided.forEach(v => {
    h += '<div class="gr" style="align-items:flex-start;border-top:1px solid #eef0f3;color:#a0a4af"><span style="width:40px;flex:none;font-size:13px">' + v.time + '</span><span class="grow"><span style="text-decoration:line-through">' + esc(v.name) + '</span>' +
      v.lines.map(l => '<span style="display:block;font-size:13px;margin-top:4px;text-decoration:line-through">' + esc(l) + '</span>').join('') + '<span class="lbl" style="display:block;margin-top:2px">ลบแล้ว ' + v.at + '</span></span></div>';
  });
  el.innerHTML = h + '</section>';
}

/* แก้รายการ (sheet) */
let ED = null;
function tlEdit(key) {

  const d = drugById(g.drug_id) || { name: g.drug_id, unit: '', location: '', cart_pos: '' };
  ED = { g: g, d: d, rows: g.rows.map(r => { const p = isoParts(r.exp_date); return { r: r, qty: r.qty, expRaw: p.m ? pad2(p.d) + '/' + pad2(p.m) + '/' + p.y : '', del: false }; }) };
  openSheet({ title: 'แก้รายการ ' + g.time, sub: d.name, body: '<div id="ed-body" style="display:flex;flex-direction:column;gap:12px"></div>',
    actions: '<div style="display:flex;flex-direction:column;gap:6px;width:100%"><button class="btn" type="button" id="ed-save" onclick="tlSave(this)">บันทึกการแก้ไข</button>' +
      '<button class="lnk red" type="button" style="align-self:center" onclick="tlDeleteAll()">ลบทั้งรายการ</button></div>' });
  renderEd();
}
function renderEd() {

    h += '<div class="ent" style="' + (x.del ? 'opacity:.5' : '') + '"><div class="row"><b class="grow" style="font-size:14px">' + ACT_TH[x.r.action] + '</b>' +
      '<button class="lnk muted" type="button" onclick="ED.rows[' + i + '].del=!ED.rows[' + i + '].del;renderEd()">' + (x.del ? 'เลิกลบ' : 'ลบส่วนนี้') + '</button></div>' +
      (x.del ? '<div class="lbl">จะลบส่วนนี้เมื่อกดบันทึก</div>' :
      '<div class="row"><span class="lbl grow">จำนวน</span>' + qtyCtl(x.qty, 'ED.rows[' + i + '].qty=Math.max(1,ED.rows[' + i + '].qty-1);renderEd()', 'ED.rows[' + i + '].qty++;renderEd()', { min: 1, unit: d.unit }) + '</div>' +
      '<div><label class="lbl" for="ed-exp-' + i + '">EXP (ค.ศ. หรือ พ.ศ.)</label><div style="margin-top:6px">' + expField('ed-exp-' + i, x.expRaw, 'edExp.bind(null,' + i + ')') + '</div><div id="ed-out-' + i + '">' + ccExpOut(pr) + '</div></div>') + '</div>';
  });
  h += '<div class="lbl">บันทึกผิดตัวยา? กด "ลบทั้งรายการ" แล้วไปบันทึกใหม่ที่การ์ดยาที่ถูก</div>';
  $('ed-body').innerHTML = h;

}
function edExp(i, v) { ED.rows[i].expRaw = v; $('ed-out-' + i).innerHTML = ccExpOut(parseExpInput(v, bkkToday())); edValid(); }
function edValid() {
  const ok = ED.rows.every(x => x.del || (x.qty >= 1 && (function () { const p = parseExpInput(x.expRaw, bkkToday()); return p.ok || (p.empty && !x.r.exp_date); })()));
  const b = $('ed-save'); if (b) b.disabled = !ok;
  return ok;
}
function tlVoidedEntry(rows) { return { time: ED.g.time, name: ED.d.name, lines: rows.map(x => tlLine(x.r)), at: bkkTime() }; }
async function tlApply(btn, all) {
  const who = APP.user;
  setBusy(btn, true);
  const removed = [];
  try {
    for (const x of ED.rows) {
      const r = x.r;
      if (all || x.del) {
        const res = await api('voidStockLog', { timestamp: r.timestamp, drug_id: r.drug_id, row_num: r.row_num });
        if (res && res.ok === false) throw new Error(res.error || 'ไม่พบรายการ');
        removed.push(x);
        continue;
      }
      const pr = parseExpInput(x.expRaw, bkkToday());
      const exp = pr.ok ? pr.iso : r.exp_date;
      if (x.qty !== r.qty || exp !== r.exp_date) {
        const res = await api('editStockLog', { timestamp: r.timestamp, drug_id: r.drug_id, row_num: r.row_num, qty: x.qty, exp: exp, pharmacistName: who });
        if (res && res.ok === false) throw new Error(res.error || 'ไม่พบรายการ');
      }
    }
    if (removed.length) TL.voided.unshift(tlVoidedEntry(removed));
    closeSheet(); toast(all ? 'ลบรายการแล้ว' : 'บันทึกการแก้ไขแล้ว');
  } catch (e) {
    if (removed.length) TL.voided.unshift(tlVoidedEntry(removed));
    setBusy(btn, false); toast('ไม่สำเร็จ: ' + e.message, 'err');
  }
  try { await Promise.all([loadDrugs(), loadPending()]); } catch (e) {}
  CC.lots = {}; CC.st = {};
  if (APP.page === 'cart') renderCart();
  loadTodayLog();
}
function tlSave(btn) { if (edValid()) tlApply(btn, false); }
async function tlDeleteAll() {
  const keep = ED;
  closeSheet();
  if (!(await confirmSheet({ title: 'ลบทั้งรายการ?', sub: keep.d.name + ' · ' + keep.rows.map(x => tlLine(x.r)).join(' / '), ok: 'ลบทั้งรายการ', danger: true }))) return;
  ED = keep;
  const b = document.createElement('button');
  await tlApply(b, true);
}

/* ---------- draft (key/รูปแบบเดียวกับ v1 — เปิดสลับ v1/v2 ได้) ---------- */
function draftKey() { return 'ermc_draft_v2_' + (APP.user || 'anon') + '_' + bkkToday(); }
function saveDraft() {
  if (APP.role !== 'pharm') return;
  try {
    localStorage.setItem(draftKey(), JSON.stringify({
      riskList: REC.risks.map(r => ({ id: r.id, type: r.type, drug: r.drug, drug_id: r.drug_id || '', note: r.note, had: !!r.had, qty: r.qty || 1, countMiss: r.type === MISS })),
      errList: REC.errs, rx: REC.rx, match: REC.match, miss: missingTotal(), tech: APP.tech, noDrug: REC.noDrug, ts: Date.now(),
    }));
  } catch (e) {}
}
function loadDraft() {
  try {
    const raw = localStorage.getItem(draftKey()); if (!raw) return false;
    const d = JSON.parse(raw); if (!d) return false;
    REC.risks = (d.riskList || []).map(r => ({ id: r.id || uid(), type: r.type || '', drug: r.drug || '', drug_id: r.drug_id || drugIdByName(r.drug), note: r.note || '', had: !!r.had, qty: Math.max(1, num(r.qty) || 1) }));
    REC.errs = (d.errList || []).map(e => ({ id: e.id || uid(), type: e.type, subtypes: Array.isArray(e.subtypes) ? e.subtypes : [], severity: e.severity || '', note: e.note || '', had: !!e.had }));
    REC.rx = num(d.rx); REC.match = num(d.match); REC.noDrug = !!d.noDrug;
    if (d.tech) APP.tech = d.tech;
    return true;
  } catch (e) { return false; }
}
function cleanOldDrafts() {
  try { const t = bkkToday(); for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.indexOf('ermc_draft_') === 0 && k.indexOf(t) === -1) localStorage.removeItem(k); } } catch (e) {}
}
function drugIdByName(n) { const d = APP.drugs.find(x => x.name === n); return d ? d.id : ''; }
/* note ที่ backend ประกอบ: "ชื่อยา · จำนวน n · รายละเอียด" */
function parseRiskNote(type, note) {
  const parts = String(note || '').split(' · ').map(s => s.trim()).filter(Boolean);
  let qty = 1, drug = '', rest = [];
  const qi = parts.findIndex(p => /^จำนวน\s*\d+$/.test(p));
  if (qi >= 0) { qty = parseInt(parts[qi].replace(/\D/g, ''), 10) || 1; drug = parts.slice(0, qi).join(' · '); rest = parts.slice(qi + 1); }
  else if (parts.length > 1) { drug = parts[0]; rest = parts.slice(1); }
  else if (parts.length === 1 && (type === MISS || drugIdByName(parts[0]))) { drug = parts[0]; }
  else rest = parts;
  return { drug: drug, qty: qty, note: rest.join(' · ') };
}

/* ---------- เข้าระบบ: ดึงสถานะเวรวันนี้ ---------- */
function rehydrate(st) {
  cleanOldDrafts();
  const hasDraft = loadDraft();
  if (!st) return;
  if (st.shiftSaved) {
    APP.shift.saved = true; APP.shift.id = st.shiftId || null; APP.shift.rxTotal = st.rxTotal;
    if (!hasDraft) {
      REC.risks = (st.riskList || []).map(r => { const p = parseRiskNote(r.type, r.note); return { id: uid(), type: r.type, drug: p.drug, drug_id: drugIdByName(p.drug), qty: p.qty, note: p.note, had: !!r.had }; });
      REC.errs = (st.errList || []).map(e => ({ id: uid(), type: e.type, subtypes: e.subtypes || [], severity: e.severity || '', note: e.note || '', had: !!e.had }));
      REC.rx = num(st.rxTotal); REC.match = REC.rx; REC.matchUnknown = true;
    }
  }
  if (st.cartCheckSubmitted) { APP.shift.cartSubmitted = true; APP.shift.cartSummary = st.cartCheckSummary || {}; }
  (st.restockedDrugIds || []).forEach(id => { CC.done[id] = { line: 'มีการเติม/จ่ายวันนี้แล้ว', at: '' }; });
}

/* ---------- คำนวณ ---------- */
function missingTotal() { return sum(REC.risks.filter(r => r.type === MISS), r => Math.max(1, num(r.qty))); }
function rxMismatch() { return REC.noDrug ? 0 : Math.max(0, REC.rx - REC.match); }
function errIncomplete(e) { return !(e.subtypes && e.subtypes.length && e.severity); }
function recIssues() {
  const out = { block: [], warn: [] };
  if (!REC.noDrug && REC.match > REC.rx) out.block.push('ใบสั่งที่ตรงครบมากกว่าใบสั่งทั้งหมด');
  const inc = REC.errs.filter(errIncomplete).length;
  if (inc) out.block.push('Med error ' + inc + ' รายการยังเลือกลักษณะหรือความรุนแรงไม่ครบ');
  const noDrugName = REC.risks.filter(r => r.type === MISS && !r.drug).length;
  if (noDrugName) out.block.push('ยาหาย ' + noDrugName + ' รายการยังไม่ได้เลือกชื่อยา');
  if (rxMismatch() > 0 && !REC.errs.length) out.warn.push('มีใบสั่งไม่ตรง ' + rxMismatch() + ' ใบ แต่ยังไม่ได้บันทึก Med error');
  if (REC.matchUnknown && !REC.noDrug) out.warn.push('โหลดค่า "ตรงครบ" ของบันทึกเดิมไม่ได้ — ตรวจตัวเลขก่อนบันทึกซ้ำ');
  return out;
}

function drugOptions(sel) {
  return APP.drugs.slice().sort((a, b) => String(a.name).localeCompare(String(b.name))).map(d => '<option value="' + esc(d.id) + '"' + (d.id === sel ? ' selected' : '') + '>' + esc(d.name) + '</option>').join('');
