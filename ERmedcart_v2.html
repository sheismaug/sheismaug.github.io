function recChanged() { saveDraft(); renderRecord(); setTop('record'); }
function recAdj(k, dlt) {
  REC[k] = Math.max(0, REC[k] + dlt);
  if (k === 'rx' && REC.match > REC.rx) REC.match = REC.rx;
  if (k === 'match') REC.match = Math.min(REC.match, REC.rx);
  REC.matchUnknown = false;
  recChanged();
}
function recAddMiss() { REC.risks.push({ id: uid(), type: MISS, drug: '', drug_id: '', qty: 1, note: '', had: false }); recChanged(); }
function recAddRisk(t) { REC.risks.push({ id: uid(), type: t, drug: '', drug_id: '', qty: 1, note: '', had: false }); recChanged(); }
function recMissDrug(id, v) {
  const r = REC.risks.find(x => x.id === id); if (!r || v === '__keep') return;
  const d = drugById(v); r.drug_id = v; r.drug = d ? d.name : ''; r.had = !!(d && d.had); recChanged();
}
function recQty(id, dlt) { const r = REC.risks.find(x => x.id === id); if (!r) return; r.qty = Math.max(1, num(r.qty) + dlt); recChanged(); }
function recField(id, f, v) { const r = REC.risks.find(x => x.id === id); if (r) { r[f] = v; saveDraft(); } }
function recHad(id) { const r = REC.risks.find(x => x.id === id); if (r) { r.had = !r.had; recChanged(); } }
function recDel(id) { REC.risks = REC.risks.filter(x => x.id !== id); recChanged(); }
function recAddErr(t) { REC.errs.push({ id: uid(), type: t, subtypes: [], severity: '', note: '', had: false }); recChanged(); }
function recDelErr(id) { REC.errs = REC.errs.filter(x => x.id !== id); recChanged(); }
function recSub(id, i) { const e = REC.errs.find(x => x.id === id); if (!e) return; const s = (SUBTYPES[e.type] || [])[i]; const k = e.subtypes.indexOf(s); if (k >= 0) e.subtypes.splice(k, 1); else e.subtypes.push(s); recChanged(); }
function recSev(id, k) { const e = REC.errs.find(x => x.id === id); if (e) { e.severity = e.severity === k ? '' : k; recChanged(); } }
function recErrNote(id, v) { const e = REC.errs.find(x => x.id === id); if (e) { e.note = v; saveDraft(); } }
function recErrHad(id) { const e = REC.errs.find(x => x.id === id); if (e) { e.had = !e.had; recChanged(); } }

async function submitRecord(btn) {
  REC.tried = true;
  const issues = recIssues();
  if (issues.block.length) { renderRecord(); toast(issues.block[0], 'err'); return; }
  if (!APP.shift.id) APP.shift.id = 'SH-' + Date.now();
  const risks = REC.risks.map(r => ({ type: r.type, drug: r.drug || '', note: r.note || '', had: !!r.had, qty: Math.max(1, num(r.qty) || 1) }));
  const data = {
    pharmacistName: APP.user, techName: APP.tech || '', noDrug: REC.noDrug, shiftDate: bkkToday(), shift_id: APP.shift.id,
    rx_total: REC.noDrug ? 0 : REC.rx, rx_matched: REC.noDrug ? 0 : REC.match, drug_missing: missingTotal(),
    risks: risks, risk_had: risks.some(r => r.had), risk_note: '',
    med_errors: REC.errs.map(e => ({ type: e.type, subtypes: e.subtypes, severity: e.severity, note: e.note || '', had: !!e.had })),
    is_update: !!APP.shift.saved,
  };
  setBusy(btn, true);
  try {
    const res = await api('saveRecord', data);
    if (res && res.success === false) throw new Error(res.message || 'บันทึกไม่สำเร็จ');
    APP.shift.saved = true; APP.shift.id = (res && res.shift_id) || APP.shift.id; APP.shift.rxTotal = data.rx_total; APP.shift.savedAt = bkkTime();
    REC.matchUnknown = false; saveDraft();
    toast(data.is_update ? 'อัปเดตบันทึกเวรแล้ว' : 'บันทึกเวรแล้ว');
    go('hub');
  } catch (e) { setBusy(btn, false); toast('บันทึกไม่สำเร็จ: ' + e.message, 'err'); }
}

    '<div><span class="fl">ที่เก็บ</span>' + seg('location', [['รถยา', 'รถยา'], [FRIDGE, 'ตู้เย็น ER']]) + '</div>' +

    '<div><span class="fl">จำนวนเป้าหมาย</span>' + qtyCtl(s.target, 'DS.target=Math.max(1,DS.target-1);renderDrugSheet()', 'DS.target++;renderDrugSheet()', { min: 1 }) + '</div></div>' +
    (s.type === 'oral' ? '<div><label class="fl" for="ds-pack">เม็ดต่อซอง <span class="lbl" style="font-weight:400">(ถ้ามี · ยาน้ำเว้นว่าง)</span></label><input id="ds-pack" class="inp" inputmode="numeric" value="' + (s.pack || '') + '" oninput="DS.pack=parseInt(this.value,10)||0"></div>' : '') +
    (cart ? '<div><span class="fl">ตำแหน่งในรถ <span class="lbl" style="font-weight:400">· แสดงเป็น <b id="ds-pos" style="color:var(--ink)">' + esc(dsPos()) + '</b></span></span><div class="grid3">' +
      [['shelf', 'ชั้น'], ['box', 'กล่อง'], ['slot', 'ช่อง']].map(([f, l]) => '<div><label class="lbl" for="ds-' + f + '">' + l + '</label><input id="ds-' + f + '" class="inp" inputmode="numeric" value="' + esc(s[f]) + '" oninput="DS.' + f + '=parseInt(this.value,10)||\'\';$(\'ds-pos\').textContent=dsPos();dsValid()"></div>').join('') + '</div></div>' : '') +
    '<label class="check" style="background:#fff5f7;border:1px solid var(--red-b)"><input type="checkbox"' + (s.had ? ' checked' : '') + ' onchange="DS.had=this.checked"><span><b style="font-size:14px">High Alert Drug (HAD)</b><br><span class="lbl">แสดงป้าย HAD ทุกหน้า</span></span></label>' +
    '<div id="ds-err" class="err-txt" role="alert"></div>';
  dsValid();

function dsPos() { return DS.shelf && DS.box && DS.slot ? DS.shelf + '-' + DS.box + '-' + DS.slot : '—'; }
function dsValid() {
  const s = DS, cart = s.location !== FRIDGE;
  const ok = s.name.trim() && s.unit && s.target >= 1 && (!cart || (s.shelf >= 1 && s.box >= 1 && s.slot >= 1));
  const b = $('ds-save'); if (b) b.disabled = !ok;
  return ok;
}
async function saveDrugSheet(btn) {
  if (!dsValid()) return;
  const s = DS, cart = s.location !== FRIDGE;
  const data = {
    name: s.name.trim(), location: s.location, type: s.type, unit: s.unit, target_qty: s.target,
    pack_size: s.type === 'oral' ? (s.pack || 0) : 0, had_alert: !!s.had,
    shelf: cart ? s.shelf : '', box: cart ? s.box : '', slot: cart ? s.slot : '',
  };
  setBusy(btn, true);
  try {
    const res = s.id ? await api('updateDrug', Object.assign({ drug_id: s.id }, data)) : await api('addDrug', data);
    if (!(res && res.success)) throw new Error((res && res.message) || 'บันทึกไม่สำเร็จ');
    closeSheet(); toast(s.id ? 'บันทึกการแก้ไขแล้ว' : 'เพิ่ม ' + data.name + ' แล้ว');
    await loadDrugs(); if (APP.page === 'stock') renderStock();
  } catch (e) { setBusy(btn, false); $('ds-err').textContent = e.message; }
}
async function deactivateDrugSheet() {
  const s = DS; closeSheet();
  if (!(await confirmSheet({ title: 'นำ "' + s.name + '" ออกจากรถ?', sub: 'ยาจะถูกซ่อนจากทุกรายการ · ประวัติใน stock log ยังอยู่', ok: 'นำออก', danger: true }))) return;
  try {
    const r = await api('deactivateDrug', { drug_id: s.id });
    if (r && r.success === false) throw new Error(r.message || 'ไม่สำเร็จ');
    toast('นำออกแล้ว'); STK.open = null;
    await loadDrugs(); if (APP.page === 'stock') renderStock();
  } catch (e) { toast(e.message, 'err'); }
}

/* ============================================================
   พยาบาล — รับรถยา (ครบ/ขาด ทีละตัว ตามชั้น) · payload saveNurseCheck เดิม
   ============================================================ */
const NC = { status: {}, qty: {}, note: {}, open: null, gnote: '', savedAt: null, startedAt: null };

PAGES.nurse = {
  title: 'รับรถยา',
  sub: () => APP.user + (NC.startedAt ? ' · เริ่มตรวจ ' + NC.startedAt : ''),
  topAction: () => '<button class="chip" type="button" onclick="doLogout()">ออกจากระบบ</button>',
  render: () => renderNurse(),
};
function ncShelves() {
  const g = {};
  APP.drugs.slice().sort(byPos).forEach(d => { const k = shelfKey(d); (g[k] = g[k] || []).push(d); });
  return Object.keys(g).sort((a, b) => (a === 'fridge') - (b === 'fridge') || num(a) - num(b)).map(k => ({ key: k, drugs: g[k] }));
}
function ncShelfDone(s) { return s.drugs.every(d => NC.status[d.id]); }
function renderNurse() {
  if (NC.savedAt) {
    $('pg-nurse').innerHTML = '<div class="wrap"><section class="card" style="align-items:center;text-align:center;padding:28px 16px">' +
      '<span class="sdot ok" style="width:56px;height:56px;border-radius:28px">' + svg('tick', 28, 'currentColor', 2.4) + '</span>' +
      '<div class="h" style="font-size:18px">บันทึกรับรถยาแล้ว ' + NC.savedAt + '</div>' +
      '<div class="lbl">' + (NC.lastMiss ? 'แจ้งขาด ' + NC.lastMiss + ' รายการถึงเภสัชแล้ว' : 'ยาครบทุกรายการ') + '</div>' +
      '<div class="row" style="gap:8px;margin-top:8px"><button class="btn2" type="button" onclick="go(\'stock\')">ดู Stock</button><button class="btn sm" type="button" onclick="ncReset()">ตรวจรอบใหม่</button></div></section></div>';
    setSticky('');
    return;
  }
  const shelves = ncShelves();
  if (NC.open == null) { const f = shelves.find(s => !ncShelfDone(s)); NC.open = f ? f.key : null; }
  const total = APP.drugs.length, vals = Object.values(NC.status), ok = vals.filter(v => v === 'ok').length, miss = vals.length - ok;
  let h = '<section class="card" style="gap:8px"><div class="row" style="align-items:baseline"><span class="h grow">ความคืบหน้า</span><span style="font-size:16px;font-weight:700">' + vals.length + '<span class="lbl"> / ' + total + '</span></span></div>' +
    '<div class="prog"><i style="width:' + (total ? ok / total * 100 : 0) + '%;background:var(--grn)"></i><i style="width:' + (total ? miss / total * 100 : 0) + '%;background:var(--red)"></i></div>' +
    '<div class="row" style="gap:14px;font-size:13px"><span style="color:var(--grn)">ครบ <b>' + ok + '</b></span><span style="color:var(--red)">ขาด <b>' + miss + '</b></span><span style="color:#4a5170">รอตรวจ <b>' + (total - vals.length) + '</b></span></div></section>' +
    '<div class="lbl" style="padding:0 2px">ตรวจตามชั้นจากบนลงล่าง · ชั้นที่ตรวจครบจะพับเก็บอัตโนมัติ</div>';

  shelves.forEach(s => {
    const done = s.drugs.filter(d => NC.status[d.id]).length, m = s.drugs.filter(d => NC.status[d.id] === 'miss').length;
    if (NC.open !== s.key) {
      const all = done === s.drugs.length;
      h += '<button class="shelfbar" type="button" onclick="NC.open=\'' + s.key + '\';renderNurse()" aria-expanded="false"><span class="pill ' + (all ? 'p-grn' : 'p-gry') + '">' + (all ? '✓' : done + '/' + s.drugs.length) + '</span>' +
        '<span class="grow" style="font-size:14px;font-weight:700">' + esc(shelfName(s.key)) + '</span><span class="lbl">' + (all ? 'ครบ ' + (done - m) + (m ? ' · ขาด ' + m : '') : '') + ' ›</span></button>';
      return;
    }
    h += '<div class="shelfbox"><div class="row"><span class="grow" style="font-size:14px;font-weight:700">' + esc(shelfName(s.key)) + '</span><span class="lbl">' + done + ' / ' + s.drugs.length + '</span></div>';
    s.drugs.forEach(d => {
      const st = NC.status[d.id];
      h += '<div class="nrow' + (st ? ' ' + st : '') + '"><div class="row">' +
        '<span class="grow"><span class="nm">' + esc(d.name) + '</span>' + hadTag(d) + '<br>' + locPill(d, false) + '<span class="lbl" style="display:block;margin-top:2px">ควรมี ' + d.target + ' ' + esc(d.unit) + (d.pack_size ? ' (' + d.target * d.pack_size + ' เม็ด)' : '') + '</span></span>' +
        '<button class="okb' + (st === 'ok' ? ' on' : '') + '" type="button" aria-pressed="' + (st === 'ok') + '" onclick="ncSet(\'' + d.id + '\',\'ok\')">ครบ</button>' +
        '<button class="msb' + (st === 'miss' ? ' on' : '') + '" type="button" aria-pressed="' + (st === 'miss') + '" onclick="ncSet(\'' + d.id + '\',\'miss\')">ขาด</button></div>' +
        (st === 'miss' ? '<div class="row"><span class="lbl grow">ขาดกี่ ' + esc(d.unit) + '</span>' + qtyCtl(NC.qty[d.id] || 1, "ncQty('" + d.id + "',-1)", "ncQty('" + d.id + "',1)", { min: 1, max: Math.max(1, d.target) }) + '</div>' +
          '<input class="inp" placeholder="หมายเหตุ (ไม่บังคับ)" aria-label="หมายเหตุ ' + esc(d.name) + '" value="' + esc(NC.note[d.id] || '') + '" oninput="NC.note[\'' + d.id + '\']=this.value">' : '') + '</div>';
    });
    h += '</div>';
  });

  const misses = APP.drugs.filter(d => NC.status[d.id] === 'miss');
  h += '<section class="card"' + (misses.length ? ' style="border-color:var(--red-b)"' : '') + '><div class="h">รายการที่แจ้งขาด (' + misses.length + ') <span class="lbl" style="font-weight:400">· ส่งถึงเภสัชเมื่อยืนยัน</span></div>' +
    (misses.length ? misses.map(d => '<div style="font-size:14px">• ' + esc(d.name) + hadTag(d) +  ' <span class="lbl">' + esc(locText(d, true)) + ' · ขาด ' + (NC.qty[d.id] || 1) + ' ' + esc(d.unit) + '</span></div>').join('') : '<div class="lbl">ยังไม่มี</div>') +
    '<label class="lbl" for="nc-note">หมายเหตุรวม (ถ้ามี)</label><textarea id="nc-note" class="inp" rows="2" placeholder="เช่น บรรจุภัณฑ์ชำรุด, อุณหภูมิตู้เย็นผิดปกติ" oninput="NC.gnote=this.value">' + esc(NC.gnote) + '</textarea></section>';

  const y = window.scrollY;
  $('pg-nurse').innerHTML = '<div class="wrap">' + h + '</div>';
  window.scrollTo(0, y);
  const left = total - vals.length;
  setSticky('<div class="grow"><div style="font-size:14px;font-weight:700">' + (left ? 'เหลือรอตรวจ ' + left + ' รายการ' : 'ตรวจครบแล้ว') + '</div><div class="lbl">' + (miss ? 'มีขาด ' + miss + ' รายการ' : 'ยังไม่พบยาขาด') + '</div></div>' +
    '<button class="btn sm" type="button" onclick="submitNurse(this)"' + (left || !total ? ' disabled' : '') + '>ยืนยันรับรถยา</button>');
}
function ncSet(id, s) {
  if (!NC.startedAt) { NC.startedAt = bkkTime(); setTop('nurse'); }
  if (NC.status[id] === s) delete NC.status[id]; else NC.status[id] = s;
  if (s === 'miss' && NC.status[id] && !NC.qty[id]) NC.qty[id] = 1;
  const sh = ncShelves().find(x => x.key === NC.open);
  if (sh && ncShelfDone(sh)) {           // ชั้นนี้ครบ → พับ ไปชั้นถัดไปที่ยังไม่ครบ
    const next = ncShelves().find(x => !ncShelfDone(x));
    NC.open = next ? next.key : '';
    renderNurse();
    if (next) setTimeout(() => window.scrollTo({ top: Math.max(0, window.scrollY - 80), behavior: 'smooth' }), 30);
    return;
  }
  renderNurse();
}
function ncQty(id, dlt) { const d = drugById(id); NC.qty[id] = Math.min(Math.max(1, d ? d.target : 1), Math.max(1, (NC.qty[id] || 1) + dlt)); renderNurse(); }
function ncReset() { NC.status = {}; NC.qty = {}; NC.note = {}; NC.open = null; NC.gnote = ''; NC.savedAt = null; NC.startedAt = null; loadDrugs().then(() => go('nurse')).catch(() => go('nurse')); }
async function submitNurse(btn) {
  const items = Object.keys(NC.status).map(id => {
    const it = { drug_id: id, status: NC.status[id] };
    if (it.status === 'miss') { it.miss_qty = NC.qty[id] || 1; it.miss_note = (NC.note[id] || '').trim(); }
    return it;
  });
  const miss = items.filter(i => i.status === 'miss').length;
  if (!(await confirmSheet({ title: 'ยืนยันรับรถยา?', sub: 'ตรวจ ' + items.length + ' รายการ · ' + (miss ? 'ขาด ' + miss + ' รายการ' : 'ครบทุกรายการ'), ok: 'ยืนยัน' }))) return;
  setBusy(btn, true);
  try {
    await api('saveNurseCheck', { nurseName: APP.user, items: items, note: NC.gnote, raw_json: JSON.stringify(items) });
    NC.savedAt = bkkTime(); NC.lastMiss = miss;
    toast('บันทึกรับรถยาแล้ว');
    renderNurse(); window.scrollTo(0, 0);
  } catch (e) { setBusy(btn, false); toast('บันทึกไม่สำเร็จ: ' + e.message, 'err'); }
}

/* ============================================================
   รายงาน: ภาพรวม · ความปลอดภัย · ภาระงาน · ประวัติเวร
   ข้อมูลจาก getDashboardData เดิม · ช่วงวันที่ชุดเดียวทุกแท็บ
   ยาหาย: ไม่นับซ้ำ — shift source = max(0, drug_missing_cnt − Σ qty ยาหายใน risk ของ shift เดียวกัน)
   ============================================================ */
const RPT = { preset: 'month', from: null, to: null, tab: 'overview', data: null, loading: false, err: null, filter: 'all', openShift: null };

PAGES.report = {
  title: 'รายงาน',
  sub: () => RPT.from ? thDate(RPT.from) + ' – ' + thDate(RPT.to) : '',
  render: () => { if (!RPT.from) rptPreset('month', true); renderReport(); if (!RPT.data && !RPT.loading) rptLoad(); },
};
function rptPreset(p, silent) {
  const t = bkkToday();
  RPT.preset = p;
  if (p === '7') { RPT.from = addDays(t, -6); RPT.to = t; }
  else if (p === 'month') { RPT.from = t.slice(0, 8) + '01'; RPT.to = t; }
  else if (p === '90') { RPT.from = addDays(t, -89); RPT.to = t; }
  if (!silent) { RPT.data = null; setTop('report'); rptLoad(); }
}
function rptCustom() {
  const sc = openSheet({ title: 'เลือกช่วงวันที่', body: '<div class="grid2"><div><label class="fl" for="rc-f">ตั้งแต่</label><input id="rc-f" type="date" class="inp" value="' + RPT.from + '"></div><div><label class="fl" for="rc-t">ถึง</label><input id="rc-t" type="date" class="inp" value="' + RPT.to + '" max="' + bkkToday() + '"></div></div>',
    actions: '<button class="btn" type="button" id="rc-ok">ดูรายงาน</button>' });
  sc.querySelector('#rc-ok').onclick = () => {
    const f = $('rc-f').value, t = $('rc-t').value;
    if (!f || !t || f > t) { toast('ช่วงวันที่ไม่ถูกต้อง', 'err'); return; }
    RPT.preset = 'custom'; RPT.from = f; RPT.to = t; RPT.data = null; closeSheet(); setTop('report'); rptLoad();
  };
}
async function rptLoad() {
  RPT.loading = true; RPT.err = null; renderReport();
  const want = RPT.from + RPT.to;
  try { const d = await api('getDashboardData', { from: RPT.from, to: RPT.to }); if (want === RPT.from + RPT.to) RPT.data = d; }
  catch (e) { RPT.err = e.message; }
  RPT.loading = false;
  if (APP.page === 'report') renderReport();
}
function renderReport() {
  let h = '<div class="card no-print" style="gap:10px"><div class="chips">' +
    [['7', '7 วัน'], ['month', 'เดือนนี้'], ['90', '3 เดือน']].map(([k, l]) => '<button class="chip' + (RPT.preset === k ? ' on' : '') + '" type="button" onclick="rptPreset(\'' + k + '\')">' + l + '</button>').join('') +
    '<button class="chip' + (RPT.preset === 'custom' ? ' on' : '') + '" type="button" onclick="rptCustom()">' + (RPT.preset === 'custom' ? esc(thDateShort(RPT.from) + ' – ' + thDateShort(RPT.to)) : 'กำหนดเอง') + '</button></div>' +
    '<div class="seg tabs" role="tablist">' + [['overview', 'ภาพรวม'], ['safety', 'ความปลอดภัย'], ['work', 'ภาระงาน'], ['history', 'ประวัติเวร']]
      .map(([k, l]) => '<button class="sg' + (RPT.tab === k ? ' on' : '') + '" type="button" role="tab" aria-selected="' + (RPT.tab === k) + '" onclick="RPT.tab=\'' + k + '\';renderReport()">' + l + '</button>').join('') + '</div></div>';
  if (RPT.err) h += errorBox('โหลดรายงานไม่ได้: ' + RPT.err, 'rptLoad()');
  else if (RPT.loading || !RPT.data) h += skeleton(4);
  else {
    const m = rptDerive(RPT.data);
    h += RPT.tab === 'overview' ? rptOverview(m) : RPT.tab === 'safety' ? rptSafety(m) : RPT.tab === 'work' ? rptWork(m) : rptHistory(m);
  }
  $('pg-report').innerHTML = '<div class="wrap wide">' + h + '</div>';
}

/* ---------- derive ---------- */
function rptDerive(D) {
  const S = D.shifts || [], R = D.risks || [], E = D.med_errors || [], N = D.nurse_checks || [], DD = D.drug_daily || [];
  const m = { S: S, R: R, E: E, N: N, DD: DD, D: D };
  m.rxTotal = sum(S, s => num(s.rx_total)); m.rxMis = sum(S, s => num(s.rx_missing));
  m.dispRows = DD.length; m.dispQty = sum(DD, x => num(x.qty)); m.hadRows = DD.filter(x => x.had).length;
  m.missPharm = []; m.otherRisks = [];
  const missQtyByShift = {};
  R.forEach(r => {
    if (String(r.risk_type || '').trim() === MISS) {
      const p = parseRiskNote(MISS, r.note);
      m.missPharm.push({ date: r.shift_date, shift_id: r.shift_id, drug: p.drug || '(ไม่ระบุยา)', qty: p.qty, note: p.note, had: r.had, by: r.pharmacist_name, source: 'pharm' });
      missQtyByShift[r.shift_id] = (missQtyByShift[r.shift_id] || 0) + p.qty;
    } else m.otherRisks.push(r);
  });
  S.forEach(s => {   // ข้อมูลเก่าที่กดตัวนับเองโดยไม่มีรายการยา — นับส่วนเกินเท่านั้น
    const extra = Math.max(0, num(s.drug_missing_cnt) - (missQtyByShift[s.shift_id] || 0));
    if (extra) m.missPharm.push({ date: s.shift_date, shift_id: s.shift_id, drug: '(ไม่ระบุยา — ข้อมูลเดิม)', qty: extra, note: '', had: false, by: s.pharmacist_name, source: 'pharm' });
  });
  m.missPharmQty = sum(m.missPharm, x => x.qty);
  m.missNurse = [];
  N.forEach(c => { let items = []; try { items = JSON.parse(c.raw_json || '[]'); } catch (e) {} items.forEach(it => m.missNurse.push({ date: c.shift_date, drug: it.name || it.drug_id || '(ไม่ระบุ)', qty: num(it.miss_qty) || 1, note: it.miss_note || '', by: c.nurse_name, source: 'nurse' })); });
  m.missNurseQty = sum(m.missNurse, x => x.qty);
  m.errEplus = E.filter(e => 'EFGHI'.indexOf(String(e.severity || '').trim()) >= 0 && e.severity).length;
  m.errHad = E.filter(e => e.had).length;
  const to = RPT.to > bkkToday() ? bkkToday() : RPT.to;
  m.days = []; for (let d = RPT.from; d <= to; d = addDays(d, 1)) m.days.push(d);
  m.checkedDays = new Set(N.map(c => c.shift_date));
  m.nurseRate = m.days.length ? Math.round(m.days.filter(d => m.checkedDays.has(d)).length / m.days.length * 100) : 0;
  return m;
}
function hbars(rows, color, max) {
  if (!rows.length) return '<div class="lbl">ไม่มีข้อมูลในช่วงนี้</div>';
  const mx = max || Math.max.apply(null, rows.map(r => r[1])) || 1;
  return rows.map(r => '<div class="hb"><span title="' + esc(r[0]) + '">' + esc(r[0]) + '</span><div class="track"><i style="width:' + Math.round(r[1] / mx * 100) + '%' + (color ? ';background:' + color : '') + '"></i></div><span style="text-align:right;font-weight:600">' + r[1] + '</span></div>').join('');
}
function countBy(arr, f) { const o = {}; arr.forEach(x => { const k = f(x); if (k == null || k === '') return; o[k] = (o[k] || 0) + (x.__w || 1); }); return o; }
function topEntries(o, n) { return Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n || 99); }
function kpi(label, val, foot, color) { return '<div class="kpi"><span class="lbl">' + label + '</span><span class="kn" style="color:' + (color || 'var(--ink)') + '">' + val + '</span><span class="lbl">' + foot + '</span></div>'; }

/* ---------- ภาพรวม ---------- */
function rptOverview(m) {
  const pct = m.rxTotal ? (m.rxMis / m.rxTotal * 100).toFixed(1) : '0';
  let h = '<div class="grid2 kpis4">' +
    kpi('จ่ายยาจากรถ', m.dispRows, 'รายการ · HAD ' + m.hadRows) +
    kpi('ใบสั่งไม่ตรง', m.rxMis, 'จาก ' + m.rxTotal + ' ใบ · ' + pct + '%', m.rxMis ? 'var(--red)' : '') +
    kpi('ยาหายไม่มีใบสั่ง', m.missPharmQty, 'รายการ', m.missPharmQty ? 'var(--red)' : '') +
    kpi('พยาบาลตรวจรถ', m.nurseRate + '%', m.days.filter(d => m.checkedDays.has(d)).length + ' จาก ' + m.days.length + ' วัน', m.nurseRate >= 90 ? '' : 'var(--red)') + '</div>';
  const daily = {}; (m.D.daily_dispense || []).forEach(x => { daily[x.date] = num(x.count); });
  const vals = m.days.map(d => daily[d] || 0), mx = Math.max.apply(null, vals.concat([1]));
  h += '<div class="rgrid"><section class="card span2"><div class="row" style="align-items:baseline"><span class="h grow">จ่ายยารายวัน</span><span class="lbl">หน่วย: รายการ</span></div>' +
    '<div class="vbars" role="img" aria-label="กราฟจ่ายยารายวัน">' + vals.map((v, i) => '<i title="' + esc(thDateShort(m.days[i])) + ': ' + v + '" style="height:' + (v / mx * 100) + '%"></i>').join('') + '</div>' +
    '<div class="row lbl" style="justify-content:space-between"><span>' + esc(thDateShort(m.days[0])) + '</span><span>' + esc(thDateShort(m.days[m.days.length - 1])) + '</span></div></section>';
  h += '<section class="card"><span class="h">ยาที่จ่ายบ่อย (Top 8)</span>' + hbars((m.D.top_drugs || []).slice(0, 8).map(t => [t.name + (t.had ? ' (HAD)' : ''), num(t.total)])) + '</section>';
  const missTop = topEntries(countBy(m.missPharm.concat(m.missNurse).map(x => Object.assign({ __w: x.qty }, x)), x => x.drug), 8);
  h += '<section class="card"><span class="h">ยาที่หาย/ขาดบ่อย</span><span class="lbl" style="margin-top:-6px">รวมที่เภสัชบันทึกและพยาบาลแจ้ง</span>' + hbars(missTop, 'var(--org)') + '</section></div>';
  return h;
}

/* ---------- ความปลอดภัย ---------- */
function rptSafety(m) {
  const f = RPT.filter;
  const E = f === 'had' ? m.E.filter(e => e.had) : m.E;
  const showErr = f !== 'miss', showMiss = f === 'all' || f === 'miss' || f === 'had';
  const missP = f === 'had' ? m.missPharm.filter(x => x.had) : m.missPharm;
  const rate = m.rxTotal ? (m.E.length / m.rxTotal * 100).toFixed(1) : '—';
  let h = '<div class="row no-print" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><div class="chips">' +
    [['all', 'ทั้งหมด'], ['err', 'Med error'], ['miss', 'ยาหาย'], ['had', 'HAD']].map(([k, l]) => '<button class="chip' + (f === k ? ' on' : '') + '" type="button" onclick="RPT.filter=\'' + k + '\';renderReport()">' + l + '</button>').join('') +
    '</div><button class="chip" type="button" onclick="window.print()">พิมพ์ PCT</button></div>';
  h += '<div class="print-only h">รายงานความปลอดภัยรถยา ER · ช่วง ' + esc(thDate(RPT.from)) + ' – ' + esc(thDate(RPT.to)) + '</div>';
  h += '<div class="grid2 kpis4">' +
    kpi('Med error' + (f === 'had' ? ' (HAD)' : ''), E.length, f === 'had' ? 'จากทั้งหมด ' + m.E.length : rate + ' ต่อ 100 ใบสั่ง') +
    kpi('ระดับ E ขึ้นไป', E.filter(e => 'EFGHI'.indexOf(e.severity) >= 0 && e.severity).length, 'HAD เกี่ยวข้อง ' + m.errHad, 'var(--red)') +
    kpi('ใบสั่งไม่ตรง', m.rxMis, (m.rxTotal ? (m.rxMis / m.rxTotal * 100).toFixed(1) : '0') + '% ของใบสั่ง') +
    kpi('ยาหายไม่มีใบสั่ง', sum(missP, x => x.qty), '+ พยาบาลแจ้งขาด ' + m.missNurseQty) + '</div>';
  h += '<div class="rgrid">';
  if (showErr) {
    /* รายสัปดาห์ */
    const weeks = []; for (let d = RPT.from; d <= RPT.to; d = addDays(d, 7)) weeks.push(d);
    const wk = weeks.map(w => { const end = addDays(w, 6); const xs = E.filter(e => e.shift_date >= w && e.shift_date <= end); return { w: w, lo: xs.filter(e => 'ABCD'.indexOf(e.severity) >= 0).length, hi: xs.filter(e => 'EFGHI'.indexOf(e.severity) >= 0 && e.severity).length }; });
    const wmx = Math.max.apply(null, wk.map(x => x.lo + x.hi).concat([1]));
    h += '<section class="card span2"><span class="h">Med error รายสัปดาห์ ตามความรุนแรง</span>' +
      '<div class="legend"><span><span class="sw" style="background:var(--bar2)"></span>A–D</span><span><span class="sw" style="background:var(--org)"></span>E–I</span></div>' +
      '<div class="vbars" style="gap:10px" role="img" aria-label="Med error รายสัปดาห์">' + wk.map(x => '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%" title="' + esc(thDateShort(x.w)) + ': A–D ' + x.lo + ', E–I ' + x.hi + '"><i style="display:block;background:var(--org);height:' + (x.hi / wmx * 100) + '%"></i><i style="display:block;background:var(--bar2);border-radius:3px 3px 0 0;height:' + (x.lo / wmx * 100) + '%"></i></div>').join('') + '</div>' +
      '<div class="row lbl" style="justify-content:space-between"><span>' + esc(thDateShort(weeks[0])) + '</span><span>สัปดาห์ละแท่ง</span></div></section>';
    h += '<section class="card"><span class="h">แยกตามขั้นตอน</span>' + hbars(ERR_TYPES.map(t => [t, E.filter(e => e.error_type === t).length])) + '</section>';
    const subs = {}; E.forEach(e => String(e.error_subtype || '').split(',').map(s => s.trim()).filter(Boolean).forEach(s => { subs[s] = (subs[s] || 0) + 1; }));
    const par = topEntries(subs, 8), tot = sum(Object.values(subs)) || 1; let cum = 0;
    h += '<section class="card"><span class="h">ลักษณะที่พบบ่อย (Pareto)</span>' + hbars(par) +
      (par.length ? '<span class="lbl">สะสม: ' + par.slice(0, 3).map(p => { cum += p[1]; return Math.round(cum / tot * 100) + '%'; }).join(' → ') + ' (3 อันดับแรก)</span>' : '') + '</section>';
    const sv = Object.keys(SEV).map(k => E.filter(e => e.severity === k).length), smx = Math.max.apply(null, sv.concat([1]));
    h += '<section class="card"><span class="h">ระดับความรุนแรง A–I</span><div style="display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;align-items:end;height:90px">' +
      sv.map((n, i) => '<div style="display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center"><span class="lbl">' + (n || '') + '</span><i style="display:block;border-radius:4px 4px 0 0;background:' + (i >= 4 ? 'var(--org)' : 'var(--bar2)') + ';height:' + (n ? n / smx * 70 : 2) + 'px"></i></div>').join('') +
      '</div><div style="display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;text-align:center;font-size:12px;font-weight:700">' + Object.keys(SEV).map(k => '<span>' + k + '</span>').join('') + '</div></section>';
    const rv = E.filter(e => e.had || ('EFGHI'.indexOf(e.severity) >= 0 && e.severity));
    h += '<section class="card span2"><span class="h">ต้องทบทวน — ระดับ E ขึ้นไป หรือ HAD</span>' + (rv.length ? '<div class="scrollx"><table class="tbl"><thead><tr><th>วันที่</th><th class="l">รายการ</th><th>ระดับ</th></tr></thead><tbody>' +
      rv.map(e => '<tr><td>' + esc(thDateShort(e.shift_date)) + '</td><td class="l">' + esc(e.error_type) + (e.error_subtype ? ' · ' + esc(e.error_subtype) : '') + '<br><span class="lbl">' + esc(e.note || '') + (e.note ? ' · ' : '') + esc(e.pharmacist_name || '') + '</span></td><td><span class="pill ' + ('EFGHI'.indexOf(e.severity) >= 0 ? 'p-red' : 'p-amb') + '">' + esc(e.severity || '—') + (e.had ? ' · HAD' : '') + '</span></td></tr>').join('') + '</tbody></table></div>' : '<div class="lbl">ไม่มีรายการ</div>') + '</section>';
  }
  if (showMiss) {
    const all = missP.concat(f === 'had' ? [] : m.missNurse);
    h += '<section class="card"><span class="h">ยาหาย / ขาด — 2 แหล่ง</span><div class="legend"><span><span class="sw" style="background:var(--org)"></span>เภสัชบันทึก (ไม่มีใบสั่ง) ' + sum(missP, x => x.qty) + '</span>' + (f === 'had' ? '' : '<span><span class="sw" style="background:var(--bar)"></span>พยาบาลแจ้งขาด ' + m.missNurseQty + '</span>') + '</div>' +
      hbars(topEntries(countBy(all.map(x => Object.assign({ __w: x.qty }, x)), x => x.drug), 8), 'var(--org)') + '</section>';
    const ev = all.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
    h += '<section class="card"><span class="h">บันทึกยาหาย/ขาดในช่วงนี้</span>' + (ev.length ? '<div class="scrollx"><table class="tbl"><thead><tr><th>วันที่</th><th class="l">ยา</th><th>จำนวน</th><th class="l">แหล่ง</th></tr></thead><tbody>' +
      ev.slice(0, 60).map(x => '<tr><td>' + esc(thDateShort(x.date)) + '</td><td class="l">' + esc(x.drug) + (x.had ? ' <span class="had">HAD</span>' : '') + (x.note ? '<br><span class="lbl">' + esc(x.note) + '</span>' : '') + '</td><td>' + x.qty + '</td><td class="l"><span class="lbl">' + (x.source === 'nurse' ? 'พยาบาล' : 'เภสัช') + ' · ' + esc(x.by || '') + '</span></td></tr>').join('') +
      '</tbody></table></div>' + (ev.length > 60 ? '<span class="lbl">แสดง 60 จาก ' + ev.length + '</span>' : '') : '<div class="lbl">ไม่มีรายการ</div>') + '</section>';
  }
  if (f === 'all') {
    h += '<section class="card"><span class="h">ความเสี่ยงอื่น</span>' + hbars(topEntries(countBy(m.otherRisks, r => RISK_LABEL[r.risk_type] || r.risk_type))) + '</section>';
  }
  h += '</div>';
  return h;
}

/* ---------- ภาระงาน ---------- */
function rptWork(m) {
  const P = {};
  const pp = (n) => (P[n] = P[n] || { shifts: 0, rx: 0, mis: 0, checks: 0, restock: 0, me: 0 });
  m.S.forEach(s => { const p = pp(s.pharmacist_name || '—'); p.shifts++; p.rx += num(s.rx_total); p.mis += num(s.rx_missing); });
  (m.D.cart_checks || []).forEach(c => { pp(c.pharmacist || '—').checks++; });
  (m.D.stock_by_person || []).forEach(x => { if (x.name && x.name !== '—') pp(x.name).restock = num(x.restock_days); });
  m.E.forEach(e => { pp(e.pharmacist_name || '—').me++; });
  const rows = Object.entries(P).sort((a, b) => b[1].shifts - a[1].shifts || b[1].rx - a[1].rx);
  let h = '<div class="rgrid"><section class="card span2"><span class="h">เภสัชกร</span><div class="scrollx"><table class="tbl"><thead><tr><th>ชื่อ</th><th>เวร</th><th>ใบสั่ง</th><th>ไม่ตรง</th><th>ยืนยันตรวจรถ</th><th>วันที่เติมยา</th><th>บันทึก ME</th></tr></thead><tbody>' +
    (rows.length ? rows.map(([n, p]) => '<tr><td>' + esc(n) + '</td><td>' + p.shifts + '</td><td>' + p.rx + '</td><td>' + p.mis + '</td><td>' + p.checks + '</td><td>' + p.restock + '</td><td>' + p.me + '</td></tr>').join('') : '<tr><td colspan="7" class="l lbl">ไม่มีข้อมูล</td></tr>') +
    '</tbody></table></div><span class="lbl">บันทึก ME = จำนวนที่เป็นผู้บันทึก ไม่ใช่ผู้ก่อ</span></section>';
  const T = {}, rset = new Set(m.D.restock_dates || []);
  m.S.forEach(s => { const n = s.tech_name; if (!n) return; T[n] = T[n] || { shifts: 0, days: new Set() }; T[n].shifts++; if (rset.has(s.shift_date)) T[n].days.add(s.shift_date); });
  h += '<section class="card"><span class="h">จพ.เภสัช</span><span class="lbl" style="margin-top:-6px">จาก จพ. ที่เลือกในหน้าเวรนี้ × วันที่มีการเติมยาจริง</span><table class="tbl"><thead><tr><th>ชื่อ</th><th>เวร</th><th>วันที่เติมยา</th></tr></thead><tbody>' +
    (Object.keys(T).length ? Object.entries(T).sort((a, b) => b[1].shifts - a[1].shifts).map(([n, t]) => '<tr><td>' + esc(n) + '</td><td>' + t.shifts + '</td><td>' + t.days.size + '</td></tr>').join('') : '<tr><td colspan="3" class="l lbl">ไม่มีข้อมูล</td></tr>') + '</tbody></table></section>';
  const NN = {}; m.N.forEach(c => { const n = c.nurse_name || '—'; NN[n] = NN[n] || { n: 0, miss: 0 }; NN[n].n++; NN[n].miss += num(c.missing_cnt) > 0 ? 1 : 0; });
  const checked = m.days.filter(d => m.checkedDays.has(d)), missed = m.days.filter(d => !m.checkedDays.has(d));
  h += '<section class="card"><div class="row" style="align-items:baseline"><span class="h grow">พยาบาลตรวจรับรถยา</span><span style="font-size:20px;font-weight:700;color:' + (m.nurseRate >= 90 ? '' : 'var(--red)') + '">' + m.nurseRate + '%</span></div>' +
    '<span class="lbl" style="margin-top:-6px">มีการตรวจ ' + checked.length + ' จาก ' + m.days.length + ' วัน · ครั้งที่พบยาขาด ' + m.N.filter(c => num(c.missing_cnt) > 0).length + ' จาก ' + m.N.length + ' ครั้ง</span>';
  if (m.days.length <= 62) {
    const first = new Date(m.days[0] + 'T00:00:00Z').getUTCDay();
    h += '<div class="cal">' + ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].map(x => '<span class="lbl" style="text-align:center">' + x + '</span>').join('') +
      Array(first).fill('<div></div>').join('') + m.days.map(d => '<div title="' + esc(thDate(d)) + '" style="background:' + (m.checkedDays.has(d) ? '#e6e8ec;color:#14171f' : '#fdecef;color:#c4122f') + '">' + isoParts(d).d + '</div>').join('') + '</div>' +
      '<div class="legend"><span><span class="sw" style="background:#e6e8ec"></span>มีการตรวจ</span><span><span class="sw" style="background:#fdecef"></span>ไม่มีการตรวจ</span></div>';
  }
  h += '<div style="border-top:1px solid rgba(13,21,53,.08);padding-top:8px"><span style="font-size:13px;font-weight:600">วันที่ไม่มีการตรวจ (' + missed.length + ')</span><div class="lbl">' + (missed.length ? esc(missed.map(thDateShort).join(' · ')) : '—') + '</div></div>' +
    '<table class="tbl"><thead><tr><th>พยาบาล</th><th>ตรวจ (ครั้ง)</th><th>แจ้งขาด (ครั้ง)</th></tr></thead><tbody>' +
    (Object.keys(NN).length ? Object.entries(NN).sort((a, b) => b[1].n - a[1].n).map(([n, x]) => '<tr><td>' + esc(n) + '</td><td>' + x.n + '</td><td>' + x.miss + '</td></tr>').join('') : '<tr><td colspan="3" class="l lbl">ไม่มีข้อมูล</td></tr>') + '</tbody></table></section></div>';
  return h;
}

/* ---------- ประวัติเวร ---------- */
function rptHistory(m) {
  const S = m.S.slice().sort((a, b) => String(b.shift_date).localeCompare(String(a.shift_date)) || String(b.shift_id).localeCompare(String(a.shift_id)));
  if (!S.length) return '<div class="empty">ไม่มีบันทึกเวรในช่วงนี้</div>';
  let h = '<div class="lbl">' + S.length + ' เวร · แก้ไขบันทึกของวันนี้ได้ที่หน้า "บันทึกเวร"</div>';
  S.forEach(s => {
    const rs = m.R.filter(r => r.shift_id === s.shift_id), es = m.E.filter(e => e.shift_id === s.shift_id);
    const missQ = sum(rs.filter(r => String(r.risk_type).trim() === MISS), r => parseRiskNote(MISS, r.note).qty);
    const miss = Math.max(missQ, num(s.drug_missing_cnt)), others = rs.filter(r => String(r.risk_type).trim() !== MISS);
    const open = RPT.openShift === s.shift_id;
    const pills = (s.no_drug ? '<span class="pill p-gry">ไม่มีใบสั่งยา</span>' : '<span class="pill p-gry">ใบสั่ง ' + num(s.rx_total) + '</span>' + (num(s.rx_missing) ? '<span class="pill p-red">ไม่ตรง ' + num(s.rx_missing) + '</span>' : '<span class="pill p-grn">ตรงครบ</span>')) +
      (miss ? '<span class="pill p-red">ยาหาย ' + miss + '</span>' : '') + (others.length ? '<span class="pill p-amb">ความเสี่ยง ' + others.length + '</span>' : '') + (es.length ? '<span class="pill p-amb">ME ' + es.length + '</span>' : '');
    h += '<div class="it" style="flex-direction:column;align-items:stretch;gap:8px' + (open ? ';border:2px solid var(--ink)' : '') + '">' +
      '<button type="button" style="border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;gap:8px" onclick="RPT.openShift=RPT.openShift===\'' + esc(s.shift_id) + '\'?null:\'' + esc(s.shift_id) + '\';renderReport()" aria-expanded="' + open + '">' +
      '<span class="row" style="align-items:baseline;width:100%"><span class="grow" style="font-size:15px;font-weight:700">' + esc(thDate(s.shift_date)) + '</span><span class="lbl">' + esc(s.pharmacist_name || '—') + ' · ' + esc(s.tech_name || '—') + '</span></span>' +
      '<span class="chips">' + pills + '</span></button>';
    if (open) {
      const lines = rs.map(r => { const p = parseRiskNote(r.risk_type, r.note); return '<div class="lot"><span class="grow">' + (String(r.risk_type).trim() === MISS ? 'ยาหาย' : esc(RISK_LABEL[r.risk_type] || r.risk_type)) + ' · ' + esc(p.drug || '—') + (p.note ? '<br><span class="lbl">' + esc(p.note) + '</span>' : '') + '</span><span>' + p.qty + (r.had ? ' <span class="had">HAD</span>' : '') + '</span></div>'; }).join('') +
        es.map(e => '<div class="lot"><span class="grow">ME · ' + esc(e.error_type) + (e.error_subtype ? ' · ' + esc(e.error_subtype) : '') + (e.note ? '<br><span class="lbl">' + esc(e.note) + '</span>' : '') + '</span><span class="pill ' + ('EFGHI'.indexOf(e.severity) >= 0 ? 'p-red' : 'p-amb') + '">' + esc(e.severity || '—') + '</span></div>').join('');
      h += (lines || '<div class="lbl">ไม่มีรายการความเสี่ยง/ME</div>') +
        '<div class="row"><span class="grow lbl">' + esc(s.shift_id) + '</span><button class="btn2 danger" type="button" onclick="rptDeleteShift(\'' + esc(s.shift_id) + '\',this)">ลบเวรนี้</button></div>';
    }
    h += '</div>';
  });
  return h;
}
async function rptDeleteShift(id, btn) {
  const s = (RPT.data.shifts || []).find(x => x.shift_id === id);
  if (!(await confirmSheet({ title: 'ลบบันทึกเวร ' + (s ? thDate(s.shift_date) : '') + '?', sub: 'บันทึกเวร ความเสี่ยง และ Med error ของเวรนี้จะถูกลบถาวร', ok: 'ลบเวรนี้', danger: true }))) return;
  setBusy(btn, true, '…');
  try {
    const r = await api('deleteShiftLog', { shift_id: id });
    if (!(r && r.ok)) throw new Error((r && r.error) || 'ลบไม่ได้');
    if (APP.shift.id === id) { APP.shift.saved = false; APP.shift.id = null; }
    toast('ลบเวรแล้ว'); RPT.openShift = null; rptLoad();
  } catch (e) { setBusy(btn, false); toast(e.message, 'err'); }
}
